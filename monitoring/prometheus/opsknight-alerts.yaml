groups:
  - name: opsknight.runbooks
    rules:
      - alert: OpsKnightRunbookWorkerEvidenceMissing
        expr: opsknight_runbook_worker_health{status="unknown"} == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Runbook dispatch or reconciliation evidence is unavailable
      - alert: OpsKnightRunbookWorkersDegraded
        expr: opsknight_runbook_worker_health{status="degraded"} == 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: A fresh runbook worker reports a fault
      - alert: OpsKnightRunbookUnknownOutcome
        expr: opsknight_runbook_attempts{status="unknown"} > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Inspect the target before retrying a runbook with an uncertain outcome
      - alert: OpsKnightRunbookSpoolBacklog
        expr: opsknight_runbook_agent_spool_depth > 0 or opsknight_runbook_agent_dead_letter_depth > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Agent results remain unreported or quarantined
      - alert: OpsKnightRunbookQueueStale
        expr: opsknight_runbook_oldest_pending_attempt_age_seconds > 120
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Pending runbook work is not being claimed promptly
      - alert: OpsKnightRunbookNonceMaintenanceStalled
        expr: (sum(increase(opsknight_runbook_nonce_purge_batches_total{result="success"}[5m])) or vector(0)) == 0 and on() max(opsknight_runbook_worker_health{status="healthy"}) == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: No successful Runbook nonce maintenance batches while workers report healthy
          description: Inspect maintenance logs, database latency and locks. Do not truncate replay nonces or bypass retention controls.
      - alert: OpsKnightRunbookNonceMaintenanceLagging
        expr: max(opsknight_runbook_nonce_purge_oldest_expired_age_seconds and on(job, instance) (increase(opsknight_runbook_nonce_purge_batches_total{result="success"}[5m]) > 0)) > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Expired Runbook nonce data remains beyond the maintenance lag threshold
          description: Inspect maintenance logs, database latency and locks. Do not truncate replay nonces or bypass retention controls.
      - alert: OpsKnightRunbookNonceMaintenanceFailing
        expr: sum(increase(opsknight_runbook_nonce_purge_batches_total{result="failed"}[10m])) >= 3
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Runbook nonce maintenance repeatedly fails
          description: Inspect maintenance logs, database latency and locks. Do not truncate replay nonces or bypass retention controls.
      - alert: OpsKnightRunbookArtifactMaintenanceStalled
        expr: (sum(increase(opsknight_runbook_artifact_purge_batches_total{result="success"}[5m])) or vector(0)) == 0 and on() max(opsknight_runbook_worker_health{status="healthy"}) == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: No successful Runbook artifact maintenance batches while workers report healthy
          description: Inspect maintenance logs, database latency and locks. Do not truncate replay nonces or bypass retention controls.
      - alert: OpsKnightRunbookArtifactMaintenanceLagging
        expr: max(opsknight_runbook_artifact_purge_oldest_expired_age_seconds and on(job, instance) (increase(opsknight_runbook_artifact_purge_batches_total{result="success"}[5m]) > 0)) > 3600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Expired Runbook artifact data remains beyond the maintenance lag threshold
          description: Inspect maintenance logs, database latency and locks. Do not truncate replay nonces or bypass retention controls.
      - alert: OpsKnightRunbookArtifactMaintenanceFailing
        expr: sum(increase(opsknight_runbook_artifact_purge_batches_total{result="failed"}[10m])) >= 3
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Runbook artifact maintenance repeatedly fails
          description: Inspect maintenance logs, database latency and locks. Do not truncate replay nonces or bypass retention controls.
  - name: opsknight.critical-path
    rules:
      - alert: OpsKnightMetricsCollectorsFailing
        expr: opsknight_metrics_collection_errors > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: OpsKnight metrics collectors are persistently failing
      - alert: OpsKnightDurableJobsStale
        expr: opsknight:jobs_oldest_pending_age_seconds > 60 and opsknight:jobs_pending > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: OpsKnight durable work is not being dispatched promptly
      - alert: OpsKnightEscalationExecutionLagging
        expr: opsknight_escalations_overdue > 0 and opsknight_escalation_max_lag_seconds > 60
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: OpsKnight has overdue escalation executions
      - alert: OpsKnightNotificationDeliveryStale
        expr: opsknight_notifications_undelivered > 0 and opsknight_notifications_oldest_undelivered_age_seconds > 300
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: OpsKnight notification delivery backlog is stale
      - alert: OpsKnightRollupsStale
        expr: opsknight_rollup_freshness_age_seconds > 172800
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: OpsKnight daily metric rollups have not refreshed
      - alert: OpsKnightHttpErrorRateHigh
        expr: sum(rate(opsknight_http_requests_total{status_class="5xx"}[5m])) / clamp_min(sum(rate(opsknight_http_requests_total[5m])), 0.001) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: OpsKnight HTTP 5xx rate exceeds 5 percent
      - alert: OpsKnightHttpP95LatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(opsknight_http_request_duration_seconds_bucket[5m]))) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: OpsKnight HTTP p95 latency exceeds two seconds

  - name: opsknight.ingestion
    rules:
      - alert: OpsKnightIngestionDeadLetter
        expr: max(opsknight_ingestion_unfinished{status="DEAD"}) > 0
        labels:
          severity: critical
        annotations:
          summary: Accepted ingestion work requires operator recovery
          description: A dead letter blocks later events for its incident identity. Diagnose and replay it, or explicitly archive it with a reason after reviewing lifecycle impact. Do not skip it automatically.
      - alert: OpsKnightIngestionBacklogStale
        expr: max(opsknight_ingestion_oldest_unfinished_age_seconds) > 120
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Accepted events have waited more than two minutes
          description: Check ingestion workers, database capacity and blocked identities. Incident SLA clocks start at activation; ingestion delay needs separate response.
      - alert: OpsKnightIngestionEvidenceUnavailable
        expr: (opsknight_ingestion_enabled == 1) and (opsknight_ingestion_metrics_collection_success == 0)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Durable ingestion queue evidence is unavailable
