schemaVersion: 1
release: 2.0.0
contracts:
  - id: incident.escalate
    description: Advance an open incident's current escalation-policy step immediately.
    surfaces:
      web: NOT_SUPPORTED
      mobile: NOT_SUPPORTED
      slack: NOT_SUPPORTED
      teams: PARTIAL
      api: NOT_SUPPORTED
      automatic: SUPPORTED
    conditions:
      teams: The current Adaptive Card must be in the OPEN/TRIGGERED phase and expose the capability-gated Escalate action.
      automatic: The escalation worker advances configured policy steps while the incident remains eligible.
    evidence:
      - src/lib/chatops/action-contract.ts
      - src/lib/microsoft-teams/cards.ts
      - src/lib/microsoft-teams/invoke.ts
      - src/lib/escalation/authorization.ts
      - src/lib/escalation/worker.ts
      - src/components/incident/detail/actions.ts
      - src/lib/chatops/slack-action-map.ts
    documentation:
      - docs/v2.0.0/guides/incidents/escalate.md
      - docs/v2.0.0/guides/incidents/respond-to-an-incident.md
      - docs/v2.0.0/concepts/incidents.md
      - docs/v2.0.0/concepts/incident-response.md
      - docs/v2.0.0/integrations/communication/slack/acknowledge-resolve.md
      - docs/v2.0.0/integrations/communication/microsoft-teams/incident-actions.md
  - id: incident.reopen
    description: Return a resolved incident to OPEN while preserving historical response evidence.
    surfaces:
      web: NOT_SUPPORTED
      mobile: NOT_SUPPORTED
      slack: NOT_SUPPORTED
      teams: NOT_SUPPORTED
      api: API_ONLY
      automatic: AUTOMATIC_ONLY
    conditions:
      api: An authorized client uses PATCH /api/incidents/{id} with status OPEN.
      automatic: A new manual incident report is created with the same service and deduplication key within 30 minutes of resolution.
    evidence:
      - src/app/api/incidents/[id]/route.ts
      - src/lib/incidents/operator-lifecycle.ts
      - src/lib/incidents/creation.ts
      - src/components/incident/detail/actions.ts
    documentation:
      - docs/v2.0.0/guides/incidents/resolve.md
      - docs/v2.0.0/guides/incidents/respond-to-an-incident.md
      - docs/v2.0.0/concepts/incidents.md
      - docs/v2.0.0/concepts/incident-response.md
      - docs/v2.0.0/integrations/communication/slack/acknowledge-resolve.md
  - id: incident.assign
    description: Change immediate response ownership without advancing an escalation policy.
    surfaces:
      web: SUPPORTED
      mobile: SUPPORTED
      slack: PARTIAL
      teams: PARTIAL
      api: SUPPORTED
      automatic: SUPPORTED
    conditions:
      web: Responders assign an active user or team via the assignee picker.
      mobile: Responders assign an active user or team via the incident detail screen.
      slack: Assign to me via ChatOps action; arbitrary user/team reassignment is not supported.
      teams: Assign to me via capability-gated Action.Execute; arbitrary user/team reassignment is not supported.
      api: An authorized client updates assigneeId via PATCH /api/incidents/{id}.
      automatic: Escalation and on-call policies automatically assign designated users or teams.
    evidence:
      - src/components/incident/AssigneeSection.tsx
      - src/components/incident/IncidentDetailScreen.tsx
      - src/lib/chatops/slack-action-map.ts
      - src/app/api/slack/actions/route.ts
      - src/lib/microsoft-teams/cards.ts
      - src/lib/microsoft-teams/invoke.ts
      - src/lib/incidents/chatops-lifecycle.ts
      - src/lib/escalation/assignee-selection.ts
      - src/lib/escalation/repository.ts
      - src/app/api/incidents/[id]/route.ts
    documentation:
      - docs/v2.0.0/guides/incidents/assign.md
      - docs/v2.0.0/guides/incidents/escalate.md
