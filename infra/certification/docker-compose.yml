services:
  opsknight-db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opsknight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opsknight_cert_secure_pw_2026}
      POSTGRES_DB: ${POSTGRES_DB:-opsknight_certification_db}
      POSTGRES_INITDB_ARGS: '-E UTF8 --locale=C'
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - cert_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-opsknight} -d ${POSTGRES_DB:-opsknight_certification_db}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - cert-network

  opsknight-mail:
    image: axllent/mailpit:v1.20
    restart: unless-stopped
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_HTTP_PORT:-8025}:8025'
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: ''
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:8025/api/v1/info']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - cert-network

  opsknight-web:
    image: ${OPSKNIGHT_IMAGE:-opsknight:certification-local}
    restart: unless-stopped
    ports:
      - '${APP_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      OPSKNIGHT_PROCESS_ROLE: web
      DATABASE_URL: postgresql://${POSTGRES_USER:-opsknight}:${POSTGRES_PASSWORD:-opsknight_cert_secure_pw_2026}@opsknight-db:5432/${POSTGRES_DB:-opsknight_certification_db}?sslmode=prefer&connection_limit=30
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-cert_secret_key_at_least_32_chars_long_2026}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      NEXTAUTH_COOKIE_SECURE: 'false'
      TRUST_PROXY_HEADERS: 'false'
      EMAIL_PROVIDER: SMTP
      SMTP_HOST: opsknight-mail
      SMTP_PORT: '1025'
      SMTP_SECURE: 'false'
      SMTP_FROM: cert-compliance@opsknight.local
      COMPLIANCE_MONITORING_ENABLED: 'true'
      COMPLIANCE_MONITOR_INTERVAL_MINUTES: '5'
      COMPLIANCE_DRIFT_NOTIFICATIONS_ENABLED: 'true'
      COMPLIANCE_DRIFT_RENOTIFY_COOLDOWN_MINUTES: '60'
      NOTIFICATION_CONTROL_PLANE_PERSONAL: 'true'
      PORT: '3000'
      HOSTNAME: '0.0.0.0'
      NEXT_TELEMETRY_DISABLED: '1'
    depends_on:
      opsknight-db:
        condition: service_healthy
      opsknight-mail:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "require(''http'').get(''http://localhost:3000/api/health?mode=readiness'', (r) => {let data='''';r.on(''data'',(c)=>data+=c);r.on(''end'',()=>{try{const res=JSON.parse(data);process.exit(res.status===''healthy''?0:1)}catch(e){process.exit(1)}});}).on(''error'',()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - cert-network

  opsknight-worker:
    image: ${OPSKNIGHT_IMAGE:-opsknight:certification-local}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      OPSKNIGHT_PROCESS_ROLE: worker
      DATABASE_URL: postgresql://${POSTGRES_USER:-opsknight}:${POSTGRES_PASSWORD:-opsknight_cert_secure_pw_2026}@opsknight-db:5432/${POSTGRES_DB:-opsknight_certification_db}?sslmode=prefer&connection_limit=30
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-cert_secret_key_at_least_32_chars_long_2026}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      NEXTAUTH_COOKIE_SECURE: 'false'
      EMAIL_PROVIDER: SMTP
      SMTP_HOST: opsknight-mail
      SMTP_PORT: '1025'
      SMTP_SECURE: 'false'
      SMTP_FROM: cert-compliance@opsknight.local
      COMPLIANCE_MONITORING_ENABLED: 'true'
      COMPLIANCE_MONITOR_INTERVAL_MINUTES: '5'
      COMPLIANCE_DRIFT_NOTIFICATIONS_ENABLED: 'true'
      COMPLIANCE_DRIFT_RENOTIFY_COOLDOWN_MINUTES: '60'
      NOTIFICATION_CONTROL_PLANE_PERSONAL: 'true'
      PORT: '3001'
      HOSTNAME: '0.0.0.0'
      NEXT_TELEMETRY_DISABLED: '1'
    depends_on:
      opsknight-db:
        condition: service_healthy
      opsknight-mail:
        condition: service_healthy
    networks:
      - cert-network

  opsknight-scheduler:
    image: ${OPSKNIGHT_IMAGE:-opsknight:certification-local}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      OPSKNIGHT_PROCESS_ROLE: scheduler
      DATABASE_URL: postgresql://${POSTGRES_USER:-opsknight}:${POSTGRES_PASSWORD:-opsknight_cert_secure_pw_2026}@opsknight-db:5432/${POSTGRES_DB:-opsknight_certification_db}?sslmode=prefer&connection_limit=30
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-cert_secret_key_at_least_32_chars_long_2026}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      NEXTAUTH_COOKIE_SECURE: 'false'
      COMPLIANCE_MONITORING_ENABLED: 'true'
      COMPLIANCE_MONITOR_INTERVAL_MINUTES: '5'
      NOTIFICATION_CONTROL_PLANE_PERSONAL: 'true'
      PORT: '3002'
      HOSTNAME: '0.0.0.0'
      NEXT_TELEMETRY_DISABLED: '1'
    depends_on:
      opsknight-db:
        condition: service_healthy
    networks:
      - cert-network

volumes:
  cert_postgres_data:

networks:
  cert-network:
    driver: bridge
