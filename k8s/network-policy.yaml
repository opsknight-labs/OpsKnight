apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opsknight-app-netpol
  namespace: opsknight
spec:
  podSelector:
    matchLabels:
      app: opsknight-app
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Standard namespace label added by Kubernetes; adjust for your ingress controller namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
    - from:
        - podSelector:
            matchLabels:
              app: opsknight-app
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # Allow PostgreSQL on 5432. This supports the bundled DB and managed/external PostgreSQL.
    # Production overlays should narrow this to the actual database CIDR/namespace when known.
    - to: []
      ports:
        - protocol: TCP
          port: 5432
    # DNS may use UDP or TCP.
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # External integrations and identity/notification providers.
    - to: []
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opsknight-postgres-netpol
  namespace: opsknight
spec:
  podSelector:
    matchLabels:
      app: opsknight-postgres
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: opsknight-app
      ports:
        - protocol: TCP
          port: 5432
  # PostgreSQL does not initiate network connections in the bundled topology.
  egress: []
