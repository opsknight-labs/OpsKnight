apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: opsknight-web-pgbouncer-egress, namespace: opsknight }
spec:
  podSelector: { matchLabels: { app: opsknight-app, opsknight-role: web } }
  policyTypes: [Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app: opsknight-pgbouncer } } }]
      ports: [{ protocol: TCP, port: 6432 }]
