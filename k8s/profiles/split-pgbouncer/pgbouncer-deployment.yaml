apiVersion: apps/v1
kind: Deployment
metadata: { name: opsknight-pgbouncer, namespace: opsknight }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector: { matchLabels: { app: opsknight-pgbouncer } }
  template:
    metadata: { labels: { app: opsknight-pgbouncer } }
    spec:
      automountServiceAccountToken: false
      securityContext: { seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: pgbouncer
          image: ghcr.io/icoretech/pgbouncer-docker@sha256:ff6568eecd8c84087d46e08fd154e80928b387def94eac55fb94ec592fa4c4fd
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            readOnlyRootFilesystem: true
          ports: [{ name: pgbouncer, containerPort: 6432 }]
          volumeMounts:
            - { name: config, mountPath: /etc/pgbouncer/pgbouncer.ini, subPath: pgbouncer.ini, readOnly: true }
            - { name: auth, mountPath: /etc/pgbouncer-auth, readOnly: true }
            - { name: run, mountPath: /var/run/pgbouncer }
            - { name: tmp, mountPath: /tmp }
          readinessProbe: { exec: { command: ["/usr/bin/pg_isready", "-h", "127.0.0.1", "-p", "6432"] }, periodSeconds: 5, failureThreshold: 3 }
          livenessProbe: { tcpSocket: { port: pgbouncer }, periodSeconds: 10, failureThreshold: 3 }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 500m, memory: 256Mi } }
      volumes:
        - { name: config, configMap: { name: opsknight-pgbouncer } }
        - name: auth
          secret:
            secretName: opsknight-pgbouncer-auth
            items: [{ key: userlist.txt, path: userlist.txt }]
        - { name: run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: DoNotSchedule, labelSelector: { matchLabels: { app: opsknight-pgbouncer } } }
