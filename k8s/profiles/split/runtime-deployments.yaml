apiVersion: apps/v1
kind: Deployment
metadata: { name: opsknight-web, namespace: opsknight }
spec:
  replicas: 2
  selector: { matchLabels: { app: opsknight-app, opsknight-role: web } }
  template:
    metadata: { labels: { app: opsknight-app, opsknight-role: web } }
    spec:
      serviceAccountName: opsknight-app
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext: { runAsUser: 1001, runAsGroup: 1001, fsGroup: 1001 }
      containers:
        - name: opsknight-app
          image: ghcr.io/opsknight-labs/opsknight:1.4.0-hotfix
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 3000 }]
          envFrom: [{ configMapRef: { name: opsknight-config } }, { secretRef: { name: opsknight-secrets } }]
          env:
            - { name: OPSKNIGHT_PROCESS_ROLE, value: web }
            - { name: DATABASE_POOL_SIZE_WEB, value: '20' }
            - { name: DATABASE_URL, value: 'postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)?schema=public&connection_limit=40&pool_timeout=30' }
          resources: { requests: { cpu: 250m, memory: 256Mi }, limits: { cpu: '1', memory: 1Gi } }
          startupProbe: { httpGet: { path: '/api/health?mode=readiness', port: http }, periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 30 }
          livenessProbe: { httpGet: { path: '/api/health', port: http }, periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 3 }
          readinessProbe: { httpGet: { path: '/api/health?mode=readiness', port: http }, periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 3 }
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: { matchLabels: { app: opsknight-app, opsknight-role: web } } }
---
