apiVersion: v1
kind: Secret
metadata:
  name: opsknight-secrets
  namespace: opsknight
type: Opaque
data:
  # Base64 encoded values - CHANGE THESE IN PRODUCTION!
  # To encode: echo -n 'your-value' | base64

  # Database credentials
  # Default: opsknight
  POSTGRES_USER: b3Bza25pZ2h0

  # Default: opsknight_secure_password_change_me
  # checkov:skip=CKV_SECRET_6: This is a default placeholder secret
  POSTGRES_PASSWORD: b3Bza25pZ2h0X3NlY3VyZV9wYXNzd29yZF9jaGFuZ2VfbWU=

  # NextAuth secret - Default: change_this_to_a_random_secret_in_production
  # checkov:skip=CKV_SECRET_6: This is a default placeholder secret
  NEXTAUTH_SECRET: Y2hhbmdlX3RoaXNfdG9fYV9yYW5kb21fc2VjcmV0X2luX3Byb2R1Y3Rpb24=

  # Encryption Key - Mandatory in production. Must be exactly 64 hex characters (32 bytes).
  # Below is a base64-encoded placeholder of '9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08'
  # checkov:skip=CKV_SECRET_6: This is a default placeholder secret
  ENCRYPTION_KEY: OWY4NmQwODE4ODRjN2Q2NTlhMmZlYWEwYzU1YWQwMTVhM2JmNGYxYjJiMGI4MjJjZDE1ZDZjMTViMGYwMGEwOA==

---
# To create your own secret values, run:
# echo -n 'your-username' | base64
# echo -n 'your-password' | base64
# echo -n 'your-nextauth-secret' | base64
# echo -n 'your-64-char-hex-encryption-key' | base64
#
# Or use kubectl:
# kubectl create secret generic opsknight-secrets \
#   --from-literal=POSTGRES_USER=opsknight \
#   --from-literal=POSTGRES_PASSWORD=your-secure-password \
#   --from-literal=NEXTAUTH_SECRET=your-nextauth-secret \
#   --from-literal=ENCRYPTION_KEY=your-64-char-hex-encryption-key \
#   -n opsknight
#
# Notification providers are configured in the OpsKnight UI after deployment.
