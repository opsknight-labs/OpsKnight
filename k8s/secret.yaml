# To create your own secret values, run:
# echo -n 'your-username' | base64
# echo -n 'your-password' | base64
# echo -n 'your-nextauth-secret' | base64
# echo -n 'your-64-char-hex-encryption-key' | base64
# echo -n 'your-database-url' | base64
# echo -n 'your-direct-database-url' | base64
# echo -n 'your-web-database-url' | base64
#
# Or use kubectl:
# kubectl create secret generic opsknight-secrets \
#   --from-literal=POSTGRES_USER=<your-username> \
#   --from-literal=POSTGRES_PASSWORD=<your-secure-password> \
#   --from-literal=NEXTAUTH_SECRET=<your-nextauth-secret> \
#   --from-literal=ENCRYPTION_KEY=<your-64-char-hex-encryption-key> \
#   --from-literal=DATABASE_URL='postgresql://<username>:<password>@opsknight-postgres-service:5432/opsknight_db?schema=public&connection_limit=40&pool_timeout=30' \
