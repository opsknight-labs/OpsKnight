apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opsknight-app-netpol
  namespace: opsknight
spec:
  podSelector:
    matchLabels:
      app: opsknight-app
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to: []
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to: []
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opsknight-postgres-netpol
  namespace: opsknight
spec:
  podSelector:
    matchLabels:
      app: opsknight-postgres
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: opsknight-app
      ports:
        - protocol: TCP
          port: 5432
  egress: []
