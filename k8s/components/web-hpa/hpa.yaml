apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: opsknight-app-hpa
  namespace: opsknight
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: opsknight-app
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
