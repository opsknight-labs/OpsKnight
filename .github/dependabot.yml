version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    # Git Flow: updates land in the next release, not straight into released code.
    target-branch: 'develop'
    schedule:
      interval: 'weekly'
    # Each Dependabot PR runs CI; a small cap and one grouped PR keep Actions usage down.
    open-pull-requests-limit: 2
    groups:
      dependencies:
        patterns:
          - '*'
  - package-ecosystem: 'github-actions'
    directory: '/'
    # Git Flow: updates land in the next release, not straight into released code.
    target-branch: 'develop'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - '*'
