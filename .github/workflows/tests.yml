name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write # Required for sticky comments

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  fast-validation:
    name: Fast validation (L0 lint/typecheck + L1 unit)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node & dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: 20
          generate-prisma: 'true'

      - name: Source ESLint check (visible, non-blocking until lint debt cleanup)
        run: npm run lint:check
        continue-on-error: true

      - name: Changed-source ESLint gate (blocking)
        run: |
          base="$(git merge-base origin/main HEAD)"
          git diff --name-only --diff-filter=d "$base" HEAD -- '*.ts' '*.tsx' '*.mjs' '*.cjs' > changed-source.txt
          if [ -s changed-source.txt ]; then
            xargs -a changed-source.txt npx eslint --max-warnings 0 --no-warn-ignored
          fi

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Verify generated REST clients and OpenAPI
        run: npm run api:clients:check

      - name: Generate enterprise API coverage review matrix
        run: |
          mkdir -p reports
          npm run --silent api:coverage > reports/rest-api-coverage.json

      - name: Upload enterprise API coverage review matrix
        uses: actions/upload-artifact@v4
        with:
          name: rest-api-coverage-${{ github.sha }}
          path: reports/rest-api-coverage.json
          if-no-files-found: error

      - name: Set up Python SDK runtime
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Python REST client workflows
        run: python -m unittest discover -s tests/sdk -p 'test_*.py'

      - name: Unit tests
        run: |
          mkdir -p reports
          npm run test:ci:unit

      - name: Upload unit test report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-unit-report
          path: reports/junit-unit.xml
          if-no-files-found: error

  database-secret-scripts:
    name: Database secret operator scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pr847_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pr847_test?schema=public
      DB_SECRET_SCRIPTS_CERTIFICATION: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node & dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: 20
          generate-prisma: 'true'

      - name: Apply migrations to isolated operator-script database
        run: npx prisma migrate deploy

      - name: Verify secret-only bootstrap, CLI, indexes, and readiness
        run: npx vitest run --no-file-parallelism --maxWorkers=1 tests/integration/db-secret-scripts.test.ts

  build:
    name: Application build & budgets (canonical E2E artifact)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXTAUTH_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      NEXTAUTH_SECRET: opsknight-e2e-session-signing-secret-7c41d9e2b8
      API_KEY_SECRET: opsknight-e2e-api-key-secret-independent-32chars
      ENCRYPTION_KEY: 68112f544b2c8b0f84436ea34293f733c33e49b41e657b9db0275f5edf09c7ba
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node & dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: 20
          generate-prisma: 'true'

      - name: Build application & verify budgets
        uses: ./.github/actions/build-app
        with:
          upload-artifact: 'true'
          artifact-name: next-build-artifact

  ingestion-durability:
    name: Ingestion durability (isolated PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ingestion_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d ingestion_test_ci"
          --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ingestion_test_ci?connection_limit=5
      ENCRYPTION_KEY: 68112f544b2c8b0f84436ea34293f733c33e49b41e657b9db0275f5edf09c7ba
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
        with:
          node-version: 20
          generate-prisma: 'true'
      - uses: ./.github/actions/setup-test-db
      - name: Real database ingestion regressions
        run: >-
          npx vitest run --config vitest.ingestion.config.ts
          --reporter=default --reporter=junit --outputFile=reports/junit-ingestion.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-ingestion-report
          path: reports/junit-ingestion.xml
          if-no-files-found: error

  db-integration:
    name: Database integration (L2, shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opsknight_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opsknight_test?schema=public
      ENCRYPTION_KEY: 68112f544b2c8b0f84436ea34293f733c33e49b41e657b9db0275f5edf09c7ba
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node & dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: 20
          generate-prisma: 'true'

      # Match deployment contract: prisma migrate deploy && npm run prisma:indexes:status-platform
      - name: Prepare test database
        uses: ./.github/actions/setup-test-db
        with:
          run-indexes: 'true'
          run-smoke: 'true'
          run-validation: 'true'

      - name: Verify idempotent index installation contract
        run: npm run prisma:indexes:status-platform

      - name: Authorization regression gate
        run: npm run test:authorization

      - name: Database integration tests
        # Enable real database for integration and resilience tests
        env:
          VITEST_USE_REAL_DB: '1'
        # These five certification suites require enterprise_sso_test and run in
        # enterprise-sso-certification.yml against their own migrated database.
        # Keep their guards: never run recovery/failure-injection fixtures on this
        # general opsknight_test database. No assertions or dedicated gates are skipped.
        run: >-
          npm run test:ci:db --
          --shard=${{ matrix.shard }}/2
          --exclude tests/integration/authentication-policy-database.test.ts
          --exclude tests/integration/emergency-authentication-database.test.ts
          --exclude tests/integration/oidc-staged-authentication-database.test.ts
          --exclude tests/integration/provider-feedback-isolation-database.test.ts
          --exclude tests/integration/emergency-password-database.test.ts

      - name: Name isolated database shard reports
        if: always()
        env:
          DB_SHARD: ${{ matrix.shard }}
        run: |
          test -f reports/junit-db.xml
          mv reports/junit-db.xml "reports/junit-db-${DB_SHARD}.xml"
          if test -f reports/ci-db-smoke.xml; then
            mv reports/ci-db-smoke.xml "reports/ci-db-smoke-${DB_SHARD}.xml"
          fi

      - name: Upload db test report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-db-report-${{ matrix.shard }}
          path: |
            reports/junit-db-${{ matrix.shard }}.xml
            reports/ci-db-smoke-${{ matrix.shard }}.xml
          if-no-files-found: error

  auth-e2e:
    name: Auth browser E2E (L3)
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opsknight_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/opsknight_e2e_test?schema=public
      HUSKY: '0'
      PLAYWRIGHT_PRODUCTION_SERVER: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node & dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: 20
          generate-prisma: 'true'

      - name: Restore application build artifact
        uses: ./.github/actions/restore-build
        with:
          artifact-name: next-build-artifact

      - name: Prepare browser-test database
        uses: ./.github/actions/setup-test-db
        with:
          run-smoke: 'false'
          run-validation: 'false'

      - name: Run authentication browser contracts (direct origin)
        run: bash scripts/ci/playwright-in-container.sh --project=chromium

      - name: Run trusted-proxy host routing browser contracts (reverse proxy)
        run: TRUST_PROXY_HEADERS=true bash scripts/ci/playwright-in-container.sh tests/e2e/host-bootstrap-routing.spec.ts --project=chromium

      - name: Upload Auth Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: auth-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  mobile-e2e:
    name: Mobile & PWA browser E2E (L3)
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opsknight_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/opsknight_e2e?schema=public
      NEXTAUTH_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      NEXTAUTH_SECRET: opsknight-e2e-session-signing-secret-7c41d9e2b8
      API_KEY_SECRET: opsknight-e2e-api-key-secret-independent-32chars
      ENCRYPTION_KEY: 68112f544b2c8b0f84436ea34293f733c33e49b41e657b9db0275f5edf09c7ba
      AUTH_TRUST_HOST: 'true'
      HUSKY: '0'
      PLAYWRIGHT_PRODUCTION_SERVER: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node & dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: 20
          generate-prisma: 'true'

      - name: Restore application build artifact
        uses: ./.github/actions/restore-build
        with:
          artifact-name: next-build-artifact

      - name: Prepare mobile-test database
        uses: ./.github/actions/setup-test-db
        with:
          run-smoke: 'false'
          run-validation: 'false'

      - name: Run Android and iPhone browser contracts + responsive matrix
        run: >-
          bash scripts/ci/playwright-in-container.sh
          tests/e2e/mobile-pwa.spec.ts
          tests/e2e/mobile-responsive-matrix.spec.ts
          --project=mobile-chromium
          --project=mobile-webkit

      - name: Run production PWA service-worker contract
        run: >-
          bash scripts/ci/playwright-in-container.sh
          -c playwright.pwa.config.ts
          --project=pwa-production-chromium
          --project=pwa-production-webkit

      - name: Upload Mobile Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  dashboard-e2e:
    name: Live Dashboard browser certification (L3)
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opsknight_dashboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d opsknight_dashboard"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/opsknight_dashboard?schema=public
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/opsknight_dashboard?schema=public
      NEXTAUTH_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      NEXTAUTH_SECRET: opsknight-e2e-session-signing-secret-7c41d9e2b8
      API_KEY_SECRET: opsknight-e2e-api-key-secret-independent-32chars
      ENCRYPTION_KEY: 68112f544b2c8b0f84436ea34293f733c33e49b41e657b9db0275f5edf09c7ba
      AUTH_TRUST_HOST: 'true'
      HUSKY: '0'
      PLAYWRIGHT_PRODUCTION_SERVER: 'true'
      DASHBOARD_SEED_ALLOW_DB: opsknight_dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node & dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: 20
          generate-prisma: 'true'

      - name: Restore application build artifact
        uses: ./.github/actions/restore-build
        with:
          artifact-name: next-build-artifact

      - name: Prepare dashboard-test database
        uses: ./.github/actions/setup-test-db
        with:
          run-smoke: 'false'
          run-validation: 'false'

      - name: Seed baseline dashboard scenario
        run: npx ts-node --project tsconfig.script.json scripts/dev/seed-dashboard-live.ts --scenario=busy

      - name: Run Dashboard Playwright certification matrix
        run: bash scripts/ci/playwright-in-container.sh -c playwright.dashboard.config.ts

      - name: Upload Dashboard Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  test:
    runs-on: ubuntu-latest
    needs: [fast-validation, build, db-integration, auth-e2e, mobile-e2e, dashboard-e2e]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download unit test reports
        uses: actions/download-artifact@v4
        with:
          name: junit-unit-report
          path: reports

      - name: Download db test reports
        uses: actions/download-artifact@v4
        with:
          pattern: junit-db-report-*
          merge-multiple: true
          path: reports

      - name: Publish test results to GitHub Checks
        uses: dorny/test-reporter@v3
        with:
          name: '✅ Tests: Vitest Suite'
          path: reports/*.xml
          reporter: java-junit
        continue-on-error: true

      - name: Summarize test results & evaluate gate status
        id: junit_summary
        env:
          FAST_STATUS: ${{ needs.fast-validation.result }}
          BUILD_STATUS: ${{ needs.build.result }}
          DB_STATUS: ${{ needs.db-integration.result }}
          AUTH_STATUS: ${{ needs.auth-e2e.result }}
          MOBILE_STATUS: ${{ needs.mobile-e2e.result }}
          DASHBOARD_STATUS: ${{ needs.dashboard-e2e.result }}
        run: |
          node - <<'NODE'
          const fs = require('fs');

          // Robust XML attribute parser
          const getAttr = (tag, attr) => {
            const match = tag.match(new RegExp(`${attr}="([^"]*)"`));
            return match ? Number(match[1]) : 0;
          };

          const parseXml = (content) => {
            const suitesMatch = content.match(/<testsuites[^>]*>/);
            if (suitesMatch) {
              return {
                tests: getAttr(suitesMatch[0], 'tests'),
                failures: getAttr(suitesMatch[0], 'failures'),
                errors: getAttr(suitesMatch[0], 'errors'),
                skipped: getAttr(suitesMatch[0], 'skipped'),
              };
            }
            
            const suiteMatch = content.match(/<testsuite[^>]*>/);
            if (suiteMatch) {
              return {
                tests: getAttr(suiteMatch[0], 'tests'),
                failures: getAttr(suiteMatch[0], 'failures'),
                errors: getAttr(suiteMatch[0], 'errors'),
                skipped: getAttr(suiteMatch[0], 'skipped'),
              };
            }
            
            throw new Error('Malformed or empty JUnit XML: missing <testsuites> or <testsuite> root element');
          };

          let gateStatus = 'failure';

          try {
            if (!fs.existsSync('reports')) {
              throw new Error('Reports directory does not exist; no test artifacts downloaded');
            }
            const xmlFiles = fs.readdirSync('reports').filter((f) => f.endsWith('.xml'));
            console.log(`Found ${xmlFiles.length} XML files: ${xmlFiles.join(', ')}`);

            if (xmlFiles.length === 0) {
              throw new Error('No JUnit XML files found in reports directory');
            }

            const unitPath = 'reports/junit-unit.xml';
            const dbPaths = ['reports/junit-db-1.xml', 'reports/junit-db-2.xml'];
            if (!fs.existsSync(unitPath)) {
              throw new Error(`${unitPath} is missing; unit test report artifact was not produced`);
            }
            for (const dbPath of dbPaths) {
              if (!fs.existsSync(dbPath)) {
                throw new Error(`${dbPath} is missing; every database shard must produce a report`);
              }
            }

            const unitCounts = parseXml(fs.readFileSync(unitPath, 'utf8'));
            const dbCounts = dbPaths.map(dbPath => ({ path: dbPath, ...parseXml(fs.readFileSync(dbPath, 'utf8')) }));

            if (unitCounts.tests === 0) {
              throw new Error(`${unitPath} reports 0 tests; unit suite was empty or failed silently`);
            }
            for (const counts of dbCounts) {
              if (counts.tests === 0) {
                throw new Error(`${counts.path} reports 0 tests; every database shard must execute tests`);
              }
            }

            const totals = xmlFiles.reduce(
              (acc, f) => {
                const xml = fs.readFileSync(`reports/${f}`, 'utf8');
                const c = parseXml(xml);
                acc.tests += c.tests;
                acc.failures += c.failures;
                acc.errors += c.errors;
                acc.skipped += c.skipped;
                return acc;
              },
              { tests: 0, failures: 0, errors: 0, skipped: 0 }
            );

            console.log('Parsed Totals:', totals);

            const hasTests = totals.tests > 0;
            const passed = Math.max(0, totals.tests - totals.failures - totals.errors - totals.skipped);
            const prereqsOk = process.env.FAST_STATUS === 'success' &&
                              process.env.BUILD_STATUS === 'success' &&
                              process.env.DB_STATUS === 'success' &&
                              process.env.AUTH_STATUS === 'success' &&
                              process.env.MOBILE_STATUS === 'success' &&
                              process.env.DASHBOARD_STATUS === 'success';

            const suiteOk = hasTests && (totals.failures === 0 && totals.errors === 0);
            gateStatus = (prereqsOk && suiteOk) ? 'success' : 'failure';

            const status = (gateStatus === 'success') ? '✅ Passed' : '❌ Failed';
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

            const prereqLines = [
              `- **Fast validation (lint, typecheck & unit)**: ${process.env.FAST_STATUS === 'success' ? '✅ Passed' : '❌ Failed'}`,
              `- **Application build & budgets**: ${process.env.BUILD_STATUS === 'success' ? '✅ Passed' : '❌ Failed'}`,
              `- **Database integration**: ${process.env.DB_STATUS === 'success' ? '✅ Passed' : '❌ Failed'}`,
              `- **Auth browser E2E**: ${process.env.AUTH_STATUS === 'success' ? '✅ Passed' : '❌ Failed'}`,
              `- **Mobile & PWA browser E2E**: ${process.env.MOBILE_STATUS === 'success' ? '✅ Passed' : '❌ Failed'}`,
              `- **Live Dashboard browser certification**: ${process.env.DASHBOARD_STATUS === 'success' ? '✅ Passed' : '❌ Failed'}`,
            ];

            for (const shard of [1, 2]) {
              const smokePath = `reports/ci-db-smoke-${shard}.xml`;
              if (!fs.existsSync(smokePath)) continue;
              const smokeXml = fs.readFileSync(smokePath, 'utf8');
              const smokeCounts = parseXml(smokeXml);
              const ok = (smokeCounts.failures + smokeCounts.errors) === 0;
              prereqLines.push(`- **DB smoke test (shard ${shard}/2)**: ${ok ? '✅ Passed' : '❌ Failed'}`);
            }

            const md = [
              `## ${status} Test Suite & Pipeline Results`,
              '',
              '| Metric | Count |',
              '| :--- | :---: |',
              `| **Unit & DB Tests** | ${totals.tests} |`,
              `| **Passed** | ${passed} |`,
              `| **Failed** | ${totals.failures + totals.errors} |`,
              `| **Skipped** | ${totals.skipped} |`,
              '',
              '### Pipeline Jobs',
              ...prereqLines,
              '',
              `[View Full Test Report](${runUrl})`,
              '',
            ].join('\n');

            fs.appendFileSync(process.env.GITHUB_OUTPUT, `markdown<<EOF\n${md}\nEOF\n`);
          } catch (error) {
            console.error('Error summarizing results:', error);
            gateStatus = 'failure';
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `markdown<<EOF\n## ❌ Test Summary generation failed: ${error.message}\nCheck job logs for details.\nEOF\n`);
          } finally {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `gate_status=${gateStatus}\n`);
          }
          NODE

      - name: Post results to PR conversation (sticky)
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: vitest
          message: ${{ steps.junit_summary.outputs.markdown }}
        continue-on-error: true

      - name: Enforce aggregate test gate
        run: |
          if [ "${{ steps.junit_summary.outputs.gate_status }}" != "success" ]; then
            echo "CI Test Gate Failed: One or more test suites or prerequisites failed."
            exit 1
          fi
          echo "All pipeline test jobs and test suites passed successfully."
