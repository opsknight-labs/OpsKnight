name: Runbook protocol validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/**', 'fix/**']
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: runbook-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect validation changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runbooks: ${{ steps.gates.outputs.runbooks }}
      deployment: ${{ steps.gates.outputs.deployment }}
      swarm: ${{ steps.gates.outputs.swarm }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Test change classification
        run: node --test tests/ci/runbook-change-gates.test.cjs tests/ci/runtime-database-readiness.test.cjs
      - name: Detect affected checks
        id: gates
        run: node scripts/ci/runbook-change-gates.cjs

  maintenance-alerts:
    needs: changes
    if: needs.changes.outputs.runbooks == 'true'
    name: Runbook maintenance alert rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Verify pinned Prometheus tooling and test maintenance alerts
        shell: bash
        run: |
          set -euo pipefail
          tool_dir=$(mktemp -d)
          archive=prometheus-3.15.0.linux-amd64.tar.gz
          release=https://github.com/prometheus/prometheus/releases/download/v3.15.0
          curl --fail --location --retry 3 "$release/$archive" --output "$tool_dir/$archive"
          curl --fail --location --retry 3 "$release/sha256sums.txt" --output "$tool_dir/sha256sums.txt"
          (cd "$tool_dir" && sha256sum --ignore-missing --check sha256sums.txt)
          tar -xzf "$tool_dir/$archive" -C "$tool_dir" --strip-components=1 prometheus-3.15.0.linux-amd64/promtool
          "$tool_dir/promtool" check rules monitoring/prometheus/opsknight-alerts.yaml
          "$tool_dir/promtool" test rules monitoring/prometheus/runbook-maintenance.test.yml

  runbook-ui:
    needs: changes
    if: needs.changes.outputs.runbooks == 'true'
    name: Runbook authoring and browser matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: opsknight
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: runbook_ui_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U opsknight -d runbook_ui_test"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgresql://opsknight:test_password@localhost:5432/runbook_ui_test
      DIRECT_URL: postgresql://opsknight:test_password@localhost:5432/runbook_ui_test
      NEXTAUTH_URL: http://127.0.0.1:3205
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3205
      NEXTAUTH_SECRET: runbook-ui-test-session-signing-independent-secret
      API_KEY_SECRET: runbook-ui-test-api-key-independent-secret
      ENCRYPTION_KEY: 68112f544b2c8b0f84436ea34293f733c33e49b41e657b9db0275f5edf09c7ba
      PLAYWRIGHT_PRODUCTION_SERVER: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
        with:
          node-version: 20
          generate-prisma: 'true'
      - name: Apply migrations to isolated UI database
        run: npx prisma migrate deploy
      - name: Install browser
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Production build
        run: npm run build
      - name: Authoring, execution preview and responsive browser checks
        run: npx playwright test --config playwright.runbooks.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runbook-ui-results
          path: test-results/
          retention-days: 7

  execution-safety:
    needs: changes
    if: needs.changes.outputs.runbooks == 'true'
    name: Runbook fault injection and database safety
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: opsknight
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: runbook_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U opsknight -d runbook_test"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://opsknight:test_password@localhost:5432/runbook_test
      DIRECT_URL: postgresql://opsknight:test_password@localhost:5432/runbook_test
      ENCRYPTION_KEY: 68112f544b2c8b0f84436ea34293f733c33e49b41e657b9db0275f5edf09c7ba
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
        with:
          node-version: 20
          generate-prisma: 'true'
      - name: Apply all migrations
        run: npx prisma migrate deploy
      - name: Typecheck
        run: npx tsc --noEmit --incremental false
      - name: Agent runtime and authorization regressions
        run: >-
          npx vitest run --no-file-parallelism --maxWorkers=1
          tests/lib/runbooks tests/lib/client-navigation-guard.test.ts tests/components/RunbookBuilder.test.tsx tests/components/RunbookExecutionPreview.test.tsx tests/lib/deployment-config-unit.test.ts
          tests/api/runbook-artifacts.test.ts tests/api/runbook-version-configuration.test.ts tests/api/metrics.test.ts
          tests/lib/operational-metric-registry.test.ts
          tests/unit/encryption-registry.test.ts tests/lib/encryption-keyring-rotation.test.ts
          tests/integration/runbook-agent-runtime.test.ts
          tests/lib/job-worker.test.ts tests/components/AgentSetupInstructions.test.tsx
          tests/components/ServiceRunbooks.test.tsx tests/components/RunbookSelectorBuilder.test.tsx
          tests/components/RunbookBindingVersionInputs.test.tsx tests/components/RunbookHealthTruth.test.tsx
          tests/components/RuleWizard.test.tsx tests/components/SelectorFormValidation.test.tsx
      - name: Real PostgreSQL concurrency and execution fences
        env: { VITEST_USE_REAL_DB: '1' }
        run: >-
          npx vitest run --no-file-parallelism --maxWorkers=1
          tests/integration/runbook-enterprise-readiness-database.test.ts
          tests/integration/runbook-execution-safety.test.ts
          tests/integration/runbook-preview-authorization.test.ts
          tests/integration/runbook-lifecycle-database.test.ts
          tests/integration/runbook-binding-readiness-database.test.ts
          tests/integration/runbook-artifact-retention-database.test.ts
          tests/integration/runbook-operational-backlog-database.test.ts
          tests/integration/runbook-nonce-maintenance-database.test.ts
          tests/integration/runbook-policy-checks-database.test.ts
          tests/integration/runbook-worker-evidence-database.test.ts
          tests/integration/runbook-review-regressions-database.test.ts
          tests/integration/runbook-resolve-race.test.ts
          tests/integration/runbook-monitoring-trigger.test.ts
          tests/integration/runbook-automation-safety.test.ts
          tests/integration/runbook-automation-context.test.ts
          tests/integration/runbook-recovery.test.ts
          tests/integration/automation-response-context.test.ts
          tests/integration/incident-response-timeline.test.ts
          tests/integration/encryption-migration.test.ts

  physical-targets:
    needs: changes
    if: needs.changes.outputs.runbooks == 'true'
    name: Disposable Docker and Kind physical actions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUNBOOK_PHYSICAL_TARGETS: 'true'
      RUNBOOK_PHYSICAL_EVIDENCE: plans/runbook-engine/evidence/physical-targets-current.json
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
        with:
          node-version: 20
          generate-prisma: 'true'
      - name: Install verified Kind tooling
        run: |
          curl --fail --silent --show-error --location https://github.com/kubernetes-sigs/kind/releases/download/v0.30.0/kind-linux-amd64 -o /tmp/rbe-kind
          curl --fail --silent --show-error --location https://github.com/kubernetes-sigs/kind/releases/download/v0.30.0/kind-linux-amd64.sha256sum -o /tmp/rbe-kind.sha256sum
          expected=$(awk '{print $1}' /tmp/rbe-kind.sha256sum)
          printf '%s  %s\n' "$expected" /tmp/rbe-kind | sha256sum --check -
          sudo install -m 0755 /tmp/rbe-kind /usr/local/bin/kind
      - name: Exercise real target mutations through the Agent executor
        run: npx vitest run --no-file-parallelism --maxWorkers=1 tests/integration/runbook-physical-targets.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: runbook-physical-target-evidence
          path: plans/runbook-engine/evidence/physical-targets-current.json
          if-no-files-found: error

  authenticated-http-capacity:
    needs: changes
    if: needs.changes.outputs.runbooks == 'true'
    name: Authenticated HTTP idle-fleet capacity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: opsknight
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: rbe_http_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U opsknight -d rbe_http_test"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgresql://opsknight:test_password@localhost:5432/rbe_http_test
      DIRECT_URL: postgresql://opsknight:test_password@localhost:5432/rbe_http_test
      ENCRYPTION_KEY: 68112f544b2c8b0f84436ea34293f733c33e49b41e657b9db0275f5edf09c7ba
      VITEST_USE_REAL_DB: '1'
      RUNBOOK_HTTP_CAPACITY: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
        with:
          node-version: 20
          generate-prisma: 'true'
      - name: Apply isolated database migrations
        run: npx prisma migrate deploy
      - name: Measure signed HTTP claims at 10, 100, 500 and 1000 Agents
        run: npx vitest run -c vitest.int.config.ts --no-file-parallelism --maxWorkers=1 tests/integration/runbook-authenticated-http-capacity.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: runbook-authenticated-http-evidence
          path: plans/runbook-engine/evidence/authenticated-http-current.json
          if-no-files-found: error

  deployment-candidate:
    needs: changes
    if: needs.changes.outputs.runbooks == 'true'
    name: Real HTTPS Agent enrollment and deployment candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: opsknight
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: rbe_engine_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U opsknight -d rbe_engine_test"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgresql://opsknight:test_password@localhost:5432/rbe_engine_test
      DIRECT_URL: postgresql://opsknight:test_password@localhost:5432/rbe_engine_test
      ENCRYPTION_KEY: 68112f544b2c8b0f84436ea34293f733c33e49b41e657b9db0275f5edf09c7ba
      OPSKNIGHT_PROCESS_ROLE: web
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
        with:
          node-version: 20
          generate-prisma: 'true'
      - name: Apply isolated database migrations
        run: npx prisma migrate deploy
      - name: Build production candidate
        run: npm run build
      - name: Build local Agent candidate
        run: docker build -f agent/Dockerfile -t opsknight-agent:rbe-local .
      - name: Prepare disposable same-cluster Agent fleet certification
        run: |
          command -v helm
          command -v kubectl
          curl --fail --silent --show-error --location https://github.com/kubernetes-sigs/kind/releases/download/v0.30.0/kind-linux-amd64 -o /tmp/rbe-kind
          curl --fail --silent --show-error --location https://github.com/kubernetes-sigs/kind/releases/download/v0.30.0/kind-linux-amd64.sha256sum -o /tmp/rbe-kind.sha256sum
          expected=$(awk '{print $1}' /tmp/rbe-kind.sha256sum)
          printf '%s  %s\n' "$expected" /tmp/rbe-kind | sha256sum --check -
          sudo install -m 0755 /tmp/rbe-kind /usr/local/bin/kind
          docker swarm init --advertise-addr 127.0.0.1
          kind create cluster --name rbe-engine-cert --wait 120s
      - name: Exercise trusted HTTPS enrollment, execution, artifacts, policy and identity recovery
        env:
          RUNBOOK_LIVE_DEPLOYMENT: 'true'
          RUNBOOK_FLEET_SMOKE: 'true'
          RUNBOOK_FLEET_HOST: '172.17.0.1'
          VITEST_USE_REAL_DB: '1'
        run: npx vitest run --no-file-parallelism --maxWorkers=1 tests/integration/runbook-live-compose.test.ts
      - name: Remove disposable fleet cluster
        if: always()
        run: kind delete cluster --name rbe-engine-cert
      - name: Measure simulated 10/100/1000 Agent claim load
        env:
          RUNBOOK_SCALE_SIMULATION: 'true'
          VITEST_USE_REAL_DB: '1'
        run: npx vitest run --no-file-parallelism --maxWorkers=1 tests/integration/runbook-scale-simulation.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runbook-deployment-candidate-evidence
          path: test-results/runbook-engine/
          retention-days: 14

  native-agent-artifacts:
    name: Native Linux Agent artifacts & installer verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
        with:
          node-version: 20
      - name: Build standalone native Agent artifacts with Node 24
        run: bash scripts/build-agent-artifacts.sh
      - name: Verify generated artifacts and SHA256SUMS
        run: |
          cd dist/agent
          test -f opsknight-agent-linux-x64.tar.gz
          test -f opsknight-agent-linux-arm64.tar.gz
          test -f install.sh
          test -f preflight.sh
          test -f SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Verify bundled x64 Node 24 runtime execution
        run: |
          mkdir -p /tmp/agent-test
          tar -xzf dist/agent/opsknight-agent-linux-x64.tar.gz --strip-components=1 -C /tmp/agent-test
          test -f /tmp/agent-test/runtime/bin/node
          test -f /tmp/agent-test/preflight.sh
          test -f /tmp/agent-test/VERSION
          /tmp/agent-test/runtime/bin/node --version
          /tmp/agent-test/runtime/bin/node -e "console.log('Node 24 runtime operational in tarball')"

      - name: Test installer failure modes (fail closed validation)
        run: |
          # Test non-root rejection
          if ./dist/agent/install.sh --url https://example.com --key "test" --token "test" 2>/dev/null; then
            echo "Expected non-root failure"
            exit 1
          fi
          # Test missing URL
          if sudo ./dist/agent/install.sh --key "test" --token "test" 2>/dev/null; then
            echo "Expected missing URL failure"
            exit 1
          fi
          # Test missing local tarball fails closed (no remote download fallback)
          if sudo ./dist/agent/install.sh --url https://example.com --tarball /nonexistent/tarball.tar.gz --key "test" --token "test" 2>/dev/null; then
            echo "Expected bad tarball failure"
            exit 1
          fi
          # Test unverified local tarball fails closed without checksum
          cp dist/agent/opsknight-agent-linux-x64.tar.gz /tmp/unverified-agent.tar.gz
          if sudo ./dist/agent/install.sh --url https://example.com --tarball /tmp/unverified-agent.tar.gz --key "test" --token "test" 2>/dev/null; then
            echo "Expected unverified tarball failure"
            rm -f /tmp/unverified-agent.tar.gz
            exit 1
          fi
          rm -f /tmp/unverified-agent.tar.gz

      - name: Test end-to-end installation, service enrollment, and runtime health
        run: |
          # 1. Start mock OpsKnight control-plane server
          node -e '
            const http = require("http");
            const server = http.createServer((req, res) => {
              if (req.url === "/api/runbook-agent/v1/time") {
                res.writeHead(200, { "Content-Type": "application/json", "Cache-Control": "no-store" });
                return res.end(JSON.stringify({
                  success: true,
                  data: { epochMs: Date.now(), serverTime: new Date().toISOString() }
                }));
              }
              if (req.url === "/api/runbook-agent/v1/enroll" && req.method === "POST") {
                res.writeHead(200, { "Content-Type": "application/json" });
                return res.end(JSON.stringify({
                  success: true,
                  data: { agent: { id: "agent-ci-test-uuid-001" } }
                }));
              }
              if (req.url === "/api/runbook-agent/v1/heartbeat" && req.method === "POST") {
                res.writeHead(200, { "Content-Type": "application/json" });
                return res.end(JSON.stringify({
                  success: true,
                  data: { acknowledged: true }
                }));
              }
              if (req.url.startsWith("/api/runbook-agent/v1/claim")) {
                res.writeHead(204);
                return res.end();
              }
              if (req.url.endsWith("/release") && req.method === "POST") {
                res.writeHead(200, { "Content-Type": "application/json" });
                return res.end(JSON.stringify({ success: true, data: { released: true } }));
              }
              res.writeHead(404);
              res.end();
            });
            server.listen(3999, "127.0.0.1", () => {
              console.log("Mock OpsKnight control-plane listening on 127.0.0.1:3999");
            });
          ' &
          MOCK_PID=$!
          sleep 1

          TEST_KEY=$(node -e 'const { generateKeyPairSync } = require("crypto"); const { publicKey } = generateKeyPairSync("ed25519"); console.log(publicKey.export({ type: "spki", format: "der" }).toString("base64"));')
          echo "Generated test Ed25519 key: $TEST_KEY"

          # 2. Perform initial installation with one-time token
          sudo ./dist/agent/install.sh \
            --url http://127.0.0.1:3999 \
            --key "$TEST_KEY" \
            --token "test-token-123" \
            --tarball dist/agent/opsknight-agent-linux-x64.tar.gz \
            --no-restart

          # 3. Verify file layout and strict permissions
          test -d /opt/opsknight-agent
          test -f /opt/opsknight-agent/opsknight-agent.mjs
          test -x /opt/opsknight-agent/runtime/bin/node
          test -x /opt/opsknight-agent/preflight.sh
          test -f /opt/opsknight-agent/VERSION
          test -f /etc/opsknight-agent/policy.json
          test -f /etc/opsknight-agent/agent.env
          test "$(sudo stat -c '%a' /etc/opsknight-agent/agent.env)" = "600"
          test "$(sudo stat -c '%U:%G' /etc/opsknight-agent/agent.env)" = "root:root"
          sudo grep -q "OPSKNIGHT_URL=http://127.0.0.1:3999" /etc/opsknight-agent/agent.env
          sudo grep -q "OPSKNIGHT_EXECUTION_PUBLIC_KEY=$TEST_KEY" /etc/opsknight-agent/agent.env
          sudo grep -q "OPSKNIGHT_AGENT_ENROLLMENT_TOKEN=test-token-123" /etc/opsknight-agent/agent.env
          test -f /etc/systemd/system/opsknight-agent.service
          grep -q "EnvironmentFile=/etc/opsknight-agent/agent.env" /etc/systemd/system/opsknight-agent.service

          # 4. Preflight before start - should pass with READY
          sudo /opt/opsknight-agent/preflight.sh

          # 5. Enable and start live systemd service - triggers real enrollment
          sudo systemctl enable --now opsknight-agent
          echo "Waiting for live agent enrollment and identity generation..."
          ENROLLED=false
          for i in $(seq 1 60); do
            if sudo test -f /var/lib/opsknight-agent/identity.json && sudo grep -q '"ready":true' /var/lib/opsknight-agent/health.json; then
              ENROLLED=true
              break
            fi
            sleep 1
          done
          if [[ "$ENROLLED" != "true" ]]; then
            echo "Agent service failed to generate identity within 60s. Journal logs:"
            sudo systemctl status opsknight-agent --no-pager || true
            sudo cat /var/lib/opsknight-agent/health.json || true
            sudo journalctl -u opsknight-agent -n 100 --no-pager
            exit 1
          fi

          # 6. Verify enrolled identity and health state
          sudo grep -q '"agentId":"agent-ci-test-uuid-001"' /var/lib/opsknight-agent/identity.json
          sudo grep -q '"ready":true' /var/lib/opsknight-agent/health.json
          INITIAL_PID=$(systemctl show opsknight-agent --property=MainPID --value)
          test "$INITIAL_PID" -gt 0
          echo "Live agent enrolled successfully with PID $INITIAL_PID: [OK]"

          # 7. Preflight re-run on enrolled system
          sudo /opt/opsknight-agent/preflight.sh

      - name: Test live upgrade, claim drain, key rotation, and rollback
        run: |
          # 1. Generate bootstrap (default) and staged UUID keys
          STAGED_KEY_ID="87ddce2f-34a1-4321-9876-abcdef012345"
          node -e '
            const { generateKeyPairSync, writeFileSync } = require("crypto");
            const fs = require("fs");
            const pairDefault = generateKeyPairSync("ed25519");
            const pairStaged = generateKeyPairSync("ed25519");
            const pubDefault = pairDefault.publicKey.export({ type: "spki", format: "der" }).toString("base64");
            const pubStaged = pairStaged.publicKey.export({ type: "spki", format: "der" }).toString("base64");
            
            // Write multiline formatted JSON keys file
            const keysObj = {
              "default": pubDefault,
              "87ddce2f-34a1-4321-9876-abcdef012345": pubStaged
            };
            fs.writeFileSync("/tmp/keys-staged.json", JSON.stringify(keysObj, null, 2));

            // Save private keys for envelope verification test
            fs.writeFileSync("/tmp/priv-default.pem", pairDefault.privateKey.export({ type: "pkcs8", format: "pem" }));
            fs.writeFileSync("/tmp/priv-staged.pem", pairStaged.privateKey.export({ type: "pkcs8", format: "pem" }));
          '

          # 2. Re-run installer on the ACTIVE service WITHOUT --token (proves identity preservation & live drain/restart!)
          sudo ./dist/agent/install.sh \
            --url http://127.0.0.1:3999 \
            --keys-file /tmp/keys-staged.json \
            --tarball dist/agent/opsknight-agent-linux-x64.tar.gz

          # 3. Verify identity was preserved across upgrade
          sudo grep -q '"agentId":"agent-ci-test-uuid-001"' /var/lib/opsknight-agent/identity.json

          # 4. Verify plural keys configured and singular key cleared
          sudo grep -q 'OPSKNIGHT_EXECUTION_PUBLIC_KEYS={"default":' /etc/opsknight-agent/agent.env
          sudo grep -q "87ddce2f-34a1-4321-9876-abcdef012345" /etc/opsknight-agent/agent.env
          if sudo grep -q "OPSKNIGHT_EXECUTION_PUBLIC_KEY=" /etc/opsknight-agent/agent.env; then
            echo "Singular key was not cleared after plural update"
            exit 1
          fi

          # 5. Verify the service restarted and health.json was updated with new PID
          NEW_PID=$(systemctl show opsknight-agent --property=MainPID --value)
          test "$NEW_PID" -gt 0
          sudo grep -q '"ready":true' /var/lib/opsknight-agent/health.json
          echo "Upgraded agent healthy with new PID $NEW_PID: [OK]"

          # 6. Test envelope signing and verification using the bundled agent node runtime
          sudo /opt/opsknight-agent/runtime/bin/node -e '
            const fs = require("fs");
            const { createPrivateKey, createPublicKey, sign, verify } = require("crypto");

            const envContent = fs.readFileSync("/etc/opsknight-agent/agent.env", "utf8");
            const keysLine = envContent.split("\n").find(l => l.startsWith("OPSKNIGHT_EXECUTION_PUBLIC_KEYS="));
            if (!keysLine) throw new Error("OPSKNIGHT_EXECUTION_PUBLIC_KEYS missing");
            const keysMap = JSON.parse(keysLine.substring("OPSKNIGHT_EXECUTION_PUBLIC_KEYS=".length));

            function canonical(val) {
              const norm = (e) => {
                if (Array.isArray(e)) return e.map(norm);
                if (e && typeof e === "object") {
                  return Object.fromEntries(Object.entries(e).sort(([a], [b]) => a.localeCompare(b)).map(([k, v]) => [k, norm(v)]));
                }
                return e;
              };
              return JSON.stringify(norm(val));
            }

            function makeAttempt(privPem, keyId) {
              const priv = createPrivateKey(privPem);
              const payload = {
                attemptId: "att-cert-test",
                signingAgentId: "agent-ci-test-uuid-001",
                executionDeadlineAt: new Date(Date.now() + 60000).toISOString(),
                leaseExpiresAt: new Date(Date.now() + 30000).toISOString(),
                ...(keyId ? { signingKeyId: keyId } : {})
              };
              const sig = sign(null, Buffer.from(canonical(payload)), priv).toString("base64");
              return { ...payload, signature: sig };
            }

            function verifyAttempt(att, keys) {
              const { signature, ...payload } = att;
              const pin = keys[att.signingKeyId || "default"];
              if (!pin) throw new Error("Untrusted key id");
              const pub = createPublicKey({ key: Buffer.from(pin, "base64"), type: "spki", format: "der" });
              if (!verify(null, Buffer.from(canonical(payload)), pub, Buffer.from(signature, "base64"))) {
                throw new Error("Invalid signature");
              }
            }

            const privDefault = fs.readFileSync("/tmp/priv-default.pem", "utf8");
            const privStaged = fs.readFileSync("/tmp/priv-staged.pem", "utf8");

            // 1. Verify default bootstrap key envelope (legacy signingKeyId omitted)
            verifyAttempt(makeAttempt(privDefault), keysMap);
            // 2. Verify default key envelope with explicit "default" ID
            verifyAttempt(makeAttempt(privDefault, "default"), keysMap);
            // 3. Verify staged UUID key envelope
            verifyAttempt(makeAttempt(privStaged, "87ddce2f-34a1-4321-9876-abcdef012345"), keysMap);

            // 4. Untrusted key ID must fail
            let failedAsExpected = false;
            try {
              verifyAttempt(makeAttempt(privDefault, "non-existent-uuid"), keysMap);
            } catch {
              failedAsExpected = true;
            }
            if (!failedAsExpected) throw new Error("Expected failure for non-existent key ID");

            console.log("Envelope verification with plural key map PASSED");
          '

          # 7. Deliberate upgrade failure test: prove automatic rollback on activation failure
          echo "Testing intentional failure and transactional rollback on /opt..."
          mkdir -p /tmp/broken-staging
          tar -xzf dist/agent/opsknight-agent-linux-x64.tar.gz -C /tmp/broken-staging
          echo 'console.error("Deliberate startup failure for rollback testing"); process.exit(1);' > /tmp/broken-staging/opsknight-agent-linux-x64/opsknight-agent.mjs
          tar -czf /tmp/broken-agent.tar.gz -C /tmp/broken-staging opsknight-agent-linux-x64
          BROKEN_SHA=$(sha256sum /tmp/broken-agent.tar.gz | awk '{print $1}')
          rm -rf /tmp/broken-staging

          if sudo ./dist/agent/install.sh \
            --url http://127.0.0.1:3999 \
            --tarball /tmp/broken-agent.tar.gz \
            --checksum "$BROKEN_SHA" 2>/dev/null; then
            echo "Expected broken activation to fail"
            exit 1
          fi

          # Prove rollback preserved the working installation and active service
          test -d /opt/opsknight-agent
          test -x /opt/opsknight-agent/runtime/bin/node
          sudo systemctl is-active --quiet opsknight-agent
          sudo grep -q '"ready":true' /var/lib/opsknight-agent/health.json
          sudo grep -q '"agentId":"agent-ci-test-uuid-001"' /var/lib/opsknight-agent/identity.json
          echo "Post-activation rollback restored working service on /opt: [OK]"

          # 8. Deliberate rollback test from legacy /usr/local/lib/opsknight-agent layout
          echo "Testing rollback from legacy /usr/local layout..."
          sudo mkdir -p /usr/local/lib/opsknight-agent
          sudo cp -a /opt/opsknight-agent/* /usr/local/lib/opsknight-agent/
          sudo rm -rf /opt/opsknight-agent
          sudo sed -i 's|/opt/opsknight-agent|/usr/local/lib/opsknight-agent|g' /etc/systemd/system/opsknight-agent.service
          sudo systemctl daemon-reload
          sudo systemctl restart opsknight-agent
          sudo systemctl is-active --quiet opsknight-agent

          # Attempt upgrade with broken tarball from legacy layout
          if sudo ./dist/agent/install.sh \
            --url http://127.0.0.1:3999 \
            --tarball /tmp/broken-agent.tar.gz \
            --checksum "$BROKEN_SHA" 2>/dev/null; then
            echo "Expected broken legacy migration to fail"
            exit 1
          fi

          # Verify legacy layout is preserved and service restarted from /usr/local
          test -d /usr/local/lib/opsknight-agent
          grep -q "/usr/local/lib/opsknight-agent" /etc/systemd/system/opsknight-agent.service
          sudo systemctl is-active --quiet opsknight-agent
          sudo grep -q '"ready":true' /var/lib/opsknight-agent/health.json
          echo "Legacy layout rollback successfully restored /usr/local service: [OK]"

          # 9. Successful migration from legacy layout to /opt/opsknight-agent
          echo "Testing successful migration from legacy layout..."
          sudo ./dist/agent/install.sh \
            --url http://127.0.0.1:3999 \
            --tarball dist/agent/opsknight-agent-linux-x64.tar.gz

          # Verify new layout is active, and legacy layout is deleted
          test -d /opt/opsknight-agent
          test -x /opt/opsknight-agent/runtime/bin/node
          test ! -d /usr/local/lib/opsknight-agent
          grep -q "/opt/opsknight-agent" /etc/systemd/system/opsknight-agent.service
          sudo systemctl is-active --quiet opsknight-agent
          sudo grep -q '"ready":true' /var/lib/opsknight-agent/health.json
          echo "Legacy migration to /opt/opsknight-agent completed and verified: [OK]"

          # Clean up
          sudo systemctl stop opsknight-agent
          sudo systemctl disable opsknight-agent
          pkill -f "Mock OpsKnight control-plane" || true
          rm -rf /tmp/keys-staged.json /tmp/priv-default.pem /tmp/priv-staged.pem /tmp/broken-agent.tar.gz /tmp/broken-staging

      - name: Diagnose native Agent failure
        if: failure()
        run: |
          sudo systemctl status opsknight-agent --no-pager || true
          sudo journalctl -u opsknight-agent -n 100 --no-pager || true
          sudo cat /var/lib/opsknight-agent/health.json || true

