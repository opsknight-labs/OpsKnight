name: Backup test image

# Runs only in the backup repo OpsKnightLabs/OpsKnight-backup, which backup-mirror.yml keeps in
# sync with main. It only builds and publishes the test-channel image the staging
# server pulls (ghcr.io/opsknightlabs/opsknight-test). The main repo's docker-image.yml
# already validates every merge, so nothing is re-tested here.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backup-test-image
  cancel-in-progress: true

jobs:
  publish:
    # The owner, not the full name, so a repo rename cannot silently stop the image.
    if: github.repository_owner == 'OpsKnightLabs'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/opsknightlabs/opsknight-test:latest
            ghcr.io/opsknightlabs/opsknight-test:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/OpsKnightLabs/OpsKnight-backup
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            SOURCE_CODE_URL=https://github.com/opsknight-labs/OpsKnight/tree/${{ github.sha }}
            BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=backup-test-amd64
          cache-to: type=gha,scope=backup-test-amd64,mode=max
          provenance: false
          sbom: false
