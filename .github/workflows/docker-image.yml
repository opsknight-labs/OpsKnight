name: Docker Image (build + push)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME_TEST: ghcr.io/${{ github.repository_owner }}/opsknight-test
  IMAGE_NAME_RELEASE: ghcr.io/${{ github.repository_owner }}/opsknight
  IMAGE_NAME_AGENT: ghcr.io/${{ github.repository_owner }}/opsknight-agent

jobs:
  validate-release-tag:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v7

      - name: Validate release tag ordering
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_RELEASE_TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || true)"
          LATEST_RELEASE_TAG="$LATEST_RELEASE_TAG" node scripts/validate-release-tag.cjs "$GITHUB_REF_NAME"

  release-quality:
    needs: validate-release-tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opsknight_release
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opsknight_release?schema=public
      PGPASSWORD: postgres
    steps:
      - name: Checkout release history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install candidate dependencies
        env:
          HUSKY: '0'
        run: npm ci --legacy-peer-deps

      - name: Validate release licensing contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').license")" = 'AGPL-3.0-only'
          test -f LICENSE
          test -f LICENSE-TRANSITION.md
          test -f TRADEMARKS.md
          test -f LICENSES/Apache-2.0.txt
          grep -q 'GNU AFFERO GENERAL PUBLIC LICENSE' LICENSE
          grep -q 'OpsKnight 2.0.0 is the first stable release distributed under.*AGPL-3.0-only' LICENSE-TRANSITION.md
          grep -i -q 'License-AGPL--3.0--only' README.md
          grep -q 'OpsKnight 1.4.0 and earlier' LICENSE-TRANSITION.md

      - name: Clean-install and migration contract
        run: |
          mkdir -p reports
          npx prisma migrate deploy
          npx prisma generate
          npm run prisma:indexes:status-platform
          npm run prisma:validate
          npm run prisma:health
          node scripts/ci-db-smoke.cjs
          npx vitest run -c vitest.unit.config.ts \
            tests/unit/migration-recovery.test.ts \
            tests/lib/deployment-config-unit.test.ts \
            tests/lib/api-keys.test.ts \
            tests/unit/env-validation.test.ts

      - name: Event, escalation, and notification contract
        env:
          VITEST_USE_REAL_DB: '1'
        run: |
          npx vitest run -c vitest.int.config.ts --no-file-parallelism \
            tests/integration/event-resilience.test.ts \
            tests/integration/notification-flow.test.ts \
            tests/integration/job-queue.test.ts

      - name: Upgrade from previous stable release
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_TAG="${GITHUB_REF_NAME}"
          PREVIOUS_TAG="$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -Fvx "$CURRENT_TAG" | head -n 1 || true)"
          if [ -z "$PREVIOUS_TAG" ]; then
            echo 'No previous stable tag exists; upgrade gate is not applicable.'
            exit 0
          fi
          echo "Testing upgrade from $PREVIOUS_TAG to $CURRENT_TAG"
          createdb -h localhost -U postgres opsknight_upgrade
          git worktree add /tmp/opsknight-previous "$PREVIOUS_TAG"
          (
            cd /tmp/opsknight-previous
            HUSKY=0 npm ci --legacy-peer-deps
            DATABASE_URL='postgresql://postgres:postgres@localhost:5432/opsknight_upgrade?schema=public' npx prisma migrate deploy
          )
          DATABASE_URL='postgresql://postgres:postgres@localhost:5432/opsknight_upgrade?schema=public' npx prisma migrate deploy
          DATABASE_URL='postgresql://postgres:postgres@localhost:5432/opsknight_upgrade?schema=public' npm run prisma:indexes:status-platform
          DATABASE_URL='postgresql://postgres:postgres@localhost:5432/opsknight_upgrade?schema=public' npm run prisma:health

      - name: Backup and restore contract
        run: |
          POSTGRES_CONTAINER="${{ job.services.postgres.id }}"
          test -n "$POSTGRES_CONTAINER"
          # Use the service image's matching PostgreSQL client. The Ubuntu
          # runner's older pg_dump refuses to dump a PostgreSQL 16 server.
          docker exec "$POSTGRES_CONTAINER" pg_dump -U postgres -Fc \
            -f /tmp/opsknight-release.dump opsknight_release
          docker exec "$POSTGRES_CONTAINER" createdb -U postgres opsknight_restore
          docker exec "$POSTGRES_CONTAINER" pg_restore -U postgres --no-owner \
            -d opsknight_restore /tmp/opsknight-release.dump
          DATABASE_URL='postgresql://postgres:postgres@localhost:5432/opsknight_restore?schema=public' npm run prisma:indexes:status-platform
          DATABASE_URL='postgresql://postgres:postgres@localhost:5432/opsknight_restore?schema=public' npm run prisma:health
          DATABASE_URL='postgresql://postgres:postgres@localhost:5432/opsknight_restore?schema=public' node scripts/ci-db-smoke.cjs

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5

      - name: Render release deployment contract
        run: |
          cp env.example .env
          docker compose -f deploy/compose/docker-compose.yml config > /tmp/opsknight-compose.yaml
          helm lint deploy/kubernetes/helm/opsknight
          helm template opsknight deploy/kubernetes/helm/opsknight --namespace opsknight > /tmp/opsknight-helm.yaml
          kubectl kustomize deploy/kubernetes/kustomize/profiles/integrated > /tmp/opsknight-kustomize.yaml
          grep -q 'startupProbe:' /tmp/opsknight-helm.yaml
          grep -q 'startupProbe:' /tmp/opsknight-kustomize.yaml

  integration-certification:
    needs: validate-release-tag
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/integration-certification.yml

  build:
    needs: [release-quality, integration-certification]
    if: >-
      !cancelled() &&
      (!startsWith(github.ref, 'refs/tags/v') ||
        (needs.release-quality.result == 'success' && needs.integration-certification.result == 'success'))
    runs-on: ubuntu-22.04
    outputs:
      release_image_digest: ${{ steps.release_build.outputs.digest }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opsknight_bootstrap_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (test channel - PR)
        if: github.event_name == 'pull_request'
        id: meta_test_pr
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME_TEST }}
          tags: |
            type=ref,event=pr,prefix=pr-

      - name: Docker metadata (test channel - main)
        if: github.ref == 'refs/heads/main'
        id: meta_test_main
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME_TEST }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-

      - name: Docker metadata (release staging - version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        id: meta_release_tag
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME_RELEASE }}
          tags: |
            type=raw,value=rc-${{ github.sha }}

      - name: Build (PR validation - no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: |
            ${{ steps.meta_test_pr.outputs.tags }}
            opsknight-pr-validation:${{ github.sha }}
          labels: ${{ steps.meta_test_pr.outputs.labels }}
          build-args: |
            SOURCE_CODE_URL=https://github.com/${{ github.repository }}/tree/${{ github.sha }}
            BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=opsknight-main-amd64
          provenance: false
          sbom: false

      - name: Prove first-admin bootstrap CLI in production image
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="opsknight-pr-validation:${GITHUB_SHA}"
          DATABASE_URL='postgresql://postgres:postgres@localhost:5432/opsknight_bootstrap_ci?schema=public'

          docker run --rm --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            --entrypoint node "$IMAGE" \
            node_modules/prisma/build/index.js migrate deploy

          FIRST_OUTPUT="$(docker run --rm --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            --entrypoint node "$IMAGE" \
            scripts/create-bootstrap-code.mjs)"
          printf '%s\n' "$FIRST_OUTPUT" | grep -q 'OpsKnight first-admin setup capability'
          printf '%s\n' "$FIRST_OUTPUT" | grep -q 'Expires:'

          if docker run --rm --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            --entrypoint node "$IMAGE" \
            scripts/create-bootstrap-code.mjs; then
            echo 'Second bootstrap issuance unexpectedly succeeded.' >&2
            exit 1
          fi

      - name: Build Agent image (PR validation - no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./agent/Dockerfile
          platforms: linux/amd64
          push: false
          tags: opsknight-agent-pr-validation:${{ github.sha }}
          build-args: |
            OPSKNIGHT_VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=opsknight-agent-main-amd64
          provenance: false
          sbom: false

      - name: Verify Compose split runtime and PgBouncer live stack
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="opsknight-pr-validation:${GITHUB_SHA}"
          echo "Verifying live Docker Compose split runtime with image: $IMAGE"

          COMPOSE_PROJECT="ci-split-${GITHUB_SHA:0:8}"
          CI_POSTGRES_PASSWORD="$(openssl rand -hex 24)"
          export OPSKNIGHT_IMAGE="$IMAGE"
          export OPSKNIGHT_PULL_POLICY="if_not_present"
          export COMPOSE_PROJECT_NAME="$COMPOSE_PROJECT"
          export APP_PORT=33000
          export POSTGRES_PORT=35432
          export POSTGRES_PASSWORD="$CI_POSTGRES_PASSWORD"
          export NEXTAUTH_SECRET="$(openssl rand -base64 48)"
          export API_KEY_SECRET="$(openssl rand -base64 48)"
          export ENCRYPTION_KEY="$(openssl rand -hex 32)"
          export ENCRYPTION_KEYS="ci:$(openssl rand -hex 32)"

          docker pull postgres:15-alpine
          docker build -t opsknight-pgbouncer:1.26.0 deploy/images/pgbouncer
          export PGBOUNCER_IMAGE="opsknight-pgbouncer:1.26.0"

          cleanup() {
            docker compose \
              -f deploy/compose/docker-compose.yml \
              -f deploy/compose/docker-compose.split.yml \
              -f deploy/compose/docker-compose.pgbouncer.yml \
              down -v || true
          }
          trap cleanup EXIT

          docker compose \
            -f deploy/compose/docker-compose.yml \
            -f deploy/compose/docker-compose.split.yml \
            -f deploy/compose/docker-compose.pgbouncer.yml \
            up -d

          echo "Waiting for opsknight-migration container to complete..."
          mig_status=""
          mig_exit=""
          for i in $(seq 1 30); do
            mig_status=$(docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.split.yml ps -a opsknight-migration --format '{{.State}}' 2>/dev/null || true)
            mig_exit=$(docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.split.yml ps -a opsknight-migration --format '{{.ExitCode}}' 2>/dev/null || true)
            if [ "$mig_status" = "exited" ] && [ "$mig_exit" = "0" ]; then
              echo "opsknight-migration successfully completed (exit 0)!"
              break
            fi
            sleep 2
          done
          test "$mig_status" = "exited"
          test "$mig_exit" = "0"

          echo "Waiting for opsknight-pgbouncer health..."
          pgb_health=""
          for i in $(seq 1 30); do
            pgb_health=$(docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.split.yml -f deploy/compose/docker-compose.pgbouncer.yml ps opsknight-pgbouncer --format '{{.Health}}' 2>/dev/null || true)
            if [ "$pgb_health" = "healthy" ]; then
              echo "opsknight-pgbouncer is healthy with authenticated backend query!"
              break
            fi
            sleep 2
          done
          test "$pgb_health" = "healthy"

          echo "Waiting for opsknight-web readiness..."
          for i in $(seq 1 45); do
            if curl -s -f "http://127.0.0.1:33000/api/health?mode=readiness" 2>/dev/null | grep -q 'healthy'; then
              echo "opsknight-web is healthy and serving HTTP readiness!"
              break
            fi
            sleep 2
          done
          curl -s -f "http://127.0.0.1:33000/api/health?mode=readiness" | grep -q 'healthy'

          echo "Verifying split background workers are running..."
          for role in opsknight-scheduler opsknight-general-worker opsknight-critical-worker opsknight-bulk-worker opsknight-runbook-worker opsknight-status-projector; do
            role_state=$(docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.split.yml ps "$role" --format '{{.State}}' 2>/dev/null || true)
            echo "Role $role state: $role_state"
            test "$role_state" = "running"
          done

          echo "Live Docker Compose split runtime + PgBouncer validation passed successfully!"

      - name: Verify Compose split runtime with PgBouncer and external PostgreSQL
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="opsknight-pr-validation:${GITHUB_SHA}"
          echo "Verifying live Docker Compose split runtime + PgBouncer with external PostgreSQL"

          COMPOSE_PROJECT="ci-ext-${GITHUB_SHA:0:8}"
          EXT_DB_CONTAINER="ci-ext-postgres-${GITHUB_SHA:0:8}"
          EXT_NETWORK="ci-ext-net-${GITHUB_SHA:0:8}"
          EXT_DB_PASSWORD="$(openssl rand -hex 24)"

          export COMPOSE_PROJECT_NAME="$COMPOSE_PROJECT"
          export OPSKNIGHT_IMAGE="$IMAGE"
          export PGBOUNCER_IMAGE="opsknight-pgbouncer:1.26.0"
          export OPSKNIGHT_PULL_POLICY="if_not_present"
          export APP_PORT=33001
          export NEXTAUTH_SECRET="$(openssl rand -base64 48)"
          export API_KEY_SECRET="$(openssl rand -base64 48)"
          export ENCRYPTION_KEY="$(openssl rand -hex 32)"
          export ENCRYPTION_KEYS="ci:$(openssl rand -hex 32)"
          export OPSKNIGHT_DATABASE_URL="postgresql://ext_opsknight_user:${EXT_DB_PASSWORD}@${EXT_DB_CONTAINER}:5432/ext_opsknight_db?sslmode=verify-full&sslrootcert=/etc/ssl/certs/custom-ca.crt"
          export PGBOUNCER_DB_HOST="$EXT_DB_CONTAINER"
          export PGBOUNCER_DB_PORT="5432"
          export PGBOUNCER_DB_NAME="ext_opsknight_db"
          export PGBOUNCER_DB_USER="ext_opsknight_user"
          export PGBOUNCER_DB_PASSWORD="$EXT_DB_PASSWORD"
          export PGBOUNCER_SERVER_TLS_SSLMODE="verify-full"
          export PGBOUNCER_TLS_CA_CERT="/tmp/ci-tls/ca.crt"
          export PGBOUNCER_SERVER_TLS_CA_FILE="/etc/ssl/certs/custom-ca.crt"

          printf 'networks:\n  opsknight-network:\n    external: true\n    name: %s\n' "$EXT_NETWORK" > /tmp/ci-ext-net.yml

          docker network create "$EXT_NETWORK"

          mkdir -p /tmp/ci-tls
          openssl req -new -x509 -days 1 -nodes -out /tmp/ci-tls/ca.crt \
            -keyout /tmp/ci-tls/ca.key -subj "/CN=ci-ca" 2>/dev/null
          openssl req -new -nodes -out /tmp/ci-tls/server.csr \
            -keyout /tmp/ci-tls/server.key -subj "/CN=${EXT_DB_CONTAINER}" 2>/dev/null
          openssl x509 -req -in /tmp/ci-tls/server.csr -days 1 \
            -CA /tmp/ci-tls/ca.crt -CAkey /tmp/ci-tls/ca.key -CAcreateserial \
            -out /tmp/ci-tls/server.crt 2>/dev/null
          docker run --rm -v /tmp/ci-tls:/tls:rw alpine sh -c "chown 70:70 /tls/server.key /tls/server.crt && chmod 600 /tls/server.key && chmod 644 /tls/server.crt"
          chmod 644 /tmp/ci-tls/ca.crt

          docker run -d \
            --name "$EXT_DB_CONTAINER" \
            --network "$EXT_NETWORK" \
            -v /tmp/ci-tls/server.crt:/var/lib/postgresql/server.crt:ro \
            -v /tmp/ci-tls/server.key:/var/lib/postgresql/server.key:ro \
            -e POSTGRES_USER=ext_opsknight_user \
            -e POSTGRES_PASSWORD="$EXT_DB_PASSWORD" \
            -e POSTGRES_DB=ext_opsknight_db \
            postgres:16-alpine \
            -c ssl=on \
            -c ssl_cert_file=/var/lib/postgresql/server.crt \
            -c ssl_key_file=/var/lib/postgresql/server.key

          cleanup() {
            docker compose \
              -f deploy/compose/docker-compose.yml \
              -f deploy/compose/docker-compose.split.yml \
              -f deploy/compose/docker-compose.pgbouncer.yml \
              -f deploy/compose/docker-compose.external-db.yml \
              -f /tmp/ci-ext-net.yml \
              down -v || true
            docker rm -f "$EXT_DB_CONTAINER" 2>/dev/null || true
            docker network rm "$EXT_NETWORK" 2>/dev/null || true
            rm -rf /tmp/ci-ext-net.yml /tmp/ci-tls 2>/dev/null || true
          }
          trap cleanup EXIT

          for i in $(seq 1 30); do
            if docker exec "$EXT_DB_CONTAINER" pg_isready -U ext_opsknight_user >/dev/null 2>&1; then
              echo "External PostgreSQL container is ready!"
              break
            fi
            sleep 1
          done

          docker compose \
            -f deploy/compose/docker-compose.yml \
            -f deploy/compose/docker-compose.split.yml \
            -f deploy/compose/docker-compose.pgbouncer.yml \
            -f deploy/compose/docker-compose.external-db.yml \
            -f deploy/compose/docker-compose.pgbouncer-ca.yml \
            -f /tmp/ci-ext-net.yml \
            up -d

          echo "Waiting for opsknight-migration container to complete against external DB..."
          mig_status=""
          mig_exit=""
          for i in $(seq 1 30); do
            mig_status=$(docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.split.yml ps -a opsknight-migration --format '{{.State}}' 2>/dev/null || true)
            mig_exit=$(docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.split.yml ps -a opsknight-migration --format '{{.ExitCode}}' 2>/dev/null || true)
            if [ "$mig_status" = "exited" ] && [ "$mig_exit" = "0" ]; then
              echo "opsknight-migration successfully completed (exit 0) against external DB!"
              break
            fi
            sleep 2
          done
          test "$mig_status" = "exited"
          test "$mig_exit" = "0"

          echo "Waiting for opsknight-pgbouncer health pointing to external DB..."
          pgb_health=""
          for i in $(seq 1 30); do
            pgb_health=$(docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.split.yml -f deploy/compose/docker-compose.pgbouncer.yml ps opsknight-pgbouncer --format '{{.Health}}' 2>/dev/null || true)
            if [ "$pgb_health" = "healthy" ]; then
              echo "opsknight-pgbouncer is healthy with authenticated query to external DB!"
              break
            fi
            sleep 2
          done
          test "$pgb_health" = "healthy"

          echo "Waiting for opsknight-web readiness through PgBouncer..."
          for i in $(seq 1 45); do
            if curl -s -f "http://127.0.0.1:33001/api/health?mode=readiness" 2>/dev/null | grep -q 'healthy'; then
              echo "opsknight-web is healthy and connected to external DB via PgBouncer!"
              break
            fi
            sleep 2
          done
          curl -s -f "http://127.0.0.1:33001/api/health?mode=readiness" | grep -q 'healthy'

          echo "Verifying split background workers are running with direct external DB TLS..."
          for worker in scheduler general-worker critical-worker bulk-worker runbook-worker status-projector; do
            w_state=$(docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.split.yml ps "opsknight-${worker}" --format '{{.State}}' 2>/dev/null || true)
            if [ "$w_state" != "running" ]; then
              echo "Error: opsknight-${worker} is in state '$w_state', expected 'running'" >&2
              docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.split.yml logs "opsknight-${worker}" --tail 30 >&2 || true
              exit 1
            fi
            echo "opsknight-${worker} is running."
          done

          echo "External PostgreSQL + PgBouncer + split runtime validation passed successfully!"

      - name: Build + push (test channel - main)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta_test_main.outputs.tags }}
          labels: ${{ steps.meta_test_main.outputs.labels }}
          build-args: |
            SOURCE_CODE_URL=https://github.com/${{ github.repository }}/tree/${{ github.sha }}
            BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=opsknight-main-amd64
          cache-to: type=gha,scope=opsknight-main-amd64,mode=max
          provenance: false
          sbom: false

      - name: Build + push (release channel - version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        id: release_build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_release_tag.outputs.tags }}
          labels: ${{ steps.meta_release_tag.outputs.labels }}
          build-args: |
            SOURCE_CODE_URL=https://github.com/${{ github.repository }}/tree/${{ github.sha }}
            BUILD_REVISION=${{ github.sha }}
          cache-from: |
            type=gha,scope=opsknight-release
            type=gha,scope=opsknight-main-amd64
          cache-to: type=gha,scope=opsknight-release,mode=max
          provenance: mode=max
          sbom: true

      - name: Build + push PgBouncer (test channel - main)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: deploy/images/pgbouncer
          file: deploy/images/pgbouncer/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/opsknight-pgbouncer:latest
            ghcr.io/${{ github.repository_owner }}/opsknight-pgbouncer:1.26.0
            ghcr.io/${{ github.repository_owner }}/opsknight-pgbouncer:sha-${{ github.sha }}
          cache-from: type=gha,scope=opsknight-pgbouncer-main
          cache-to: type=gha,scope=opsknight-pgbouncer-main,mode=max
          provenance: false
          sbom: false

      - name: Build + push Agent (test channel - main)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./agent/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME_AGENT }}:latest
            ${{ env.IMAGE_NAME_AGENT }}:sha-${{ github.sha }}
          build-args: |
            OPSKNIGHT_VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=opsknight-agent-main-amd64
          cache-to: type=gha,scope=opsknight-agent-main-amd64,mode=max
          provenance: false
          sbom: false

  sbom-provenance:
    needs: [build]
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      needs.build.result == 'success'
    runs-on: ubuntu-22.04
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release image digest with embedded SBOM and provenance
        env:
          RELEASE_IMAGE_DIGEST: ${{ needs.build.outputs.release_image_digest }}
        run: |
          test -n "$RELEASE_IMAGE_DIGEST"
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const ref = `${process.env.IMAGE_NAME_RELEASE}@${process.env.RELEASE_IMAGE_DIGEST}`;
          execFileSync('docker', ['buildx', 'imagetools', 'inspect', ref], { stdio: 'inherit' });
          const inspectJson = (name, format) => {
            const raw = execFileSync(
              'docker',
              ['buildx', 'imagetools', 'inspect', ref, '--format', format],
              { encoding: 'utf8' }
            ).trim();
            if (!raw || raw === 'null' || raw === '{}' || raw === '[]') {
              throw new Error(`${name} is missing from the release image index`);
            }
            return JSON.parse(raw);
          };
          const assertPresent = (name, raw) => {
            if (raw === null || (Array.isArray(raw) && raw.length === 0) || (typeof raw === 'object' && Object.keys(raw).length === 0)) {
              throw new Error(`${name} is missing from the release image index`);
            }
            return raw;
          };
          const sbom = assertPresent('SBOM', inspectJson('SBOM', '{{ json .SBOM }}'));
          const provenance = assertPresent('Provenance', inspectJson('Provenance', '{{ json .Provenance }}'));
          const hasPlatform = (value, platform) => {
            const text = JSON.stringify(value);
            const [os, arch] = platform.split('/');
            return text.includes(platform) || (text.includes(`"os":"${os}"`) && text.includes(`"architecture":"${arch}"`));
          };
          for (const platform of ['linux/amd64', 'linux/arm64']) {
            if (!hasPlatform(sbom, platform)) throw new Error(`SBOM missing for ${platform}`);
            if (!hasPlatform(provenance, platform)) throw new Error(`Provenance missing for ${platform}`);
          }
          NODE

  pgbouncer-image:
    needs: sbom-provenance
    if: startsWith(github.ref, 'refs/tags/v') && needs.sbom-provenance.result == 'success'
    runs-on: ubuntu-22.04
    outputs:
      pgbouncer_image_digest: ${{ steps.pgbouncer_build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve PgBouncer release tags
        id: pgbouncer_tags
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'tags<<EOF'
            if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/opsknight-pgbouncer:1.26.0"
              echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/opsknight-pgbouncer:latest"
            else
              echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/opsknight-pgbouncer:sha-${GITHUB_SHA}"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build + push PgBouncer (release channel - version tag)
        id: pgbouncer_build
        uses: docker/build-push-action@v7
        with:
          context: deploy/images/pgbouncer
          file: deploy/images/pgbouncer/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.pgbouncer_tags.outputs.tags }}
          cache-from: type=gha,scope=opsknight-pgbouncer-release
          cache-to: type=gha,scope=opsknight-pgbouncer-release,mode=max
          provenance: mode=max
          sbom: true

  agent-image:
    needs: sbom-provenance
    if: startsWith(github.ref, 'refs/tags/v') && needs.sbom-provenance.result == 'success'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata (Agent release)
        id: agent_meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME_AGENT }}
          tags: |
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref_name, '-') }}
      - name: Build + push Agent release image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.agent_meta.outputs.tags }}
          labels: ${{ steps.agent_meta.outputs.labels }}
          build-args: |
            OPSKNIGHT_VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=opsknight-agent-release
          cache-to: type=gha,scope=opsknight-agent-release,mode=max
          provenance: mode=max
          sbom: true

  promote-release-tags:
    needs: [build, pgbouncer-image, agent-image]
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      needs.build.result == 'success' &&
      needs.pgbouncer-image.result == 'success' &&
      needs.agent-image.result == 'success'
    runs-on: ubuntu-22.04
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (promoted release tags)
        id: promote_meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME_RELEASE }}
          tags: |
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref_name, '-') }}

      - name: Promote certified digest to release tags
        env:
          RELEASE_IMAGE_DIGEST: ${{ needs.build.outputs.release_image_digest }}
          PROMOTED_TAGS: ${{ steps.promote_meta.outputs.tags }}
        run: |
          set -euo pipefail
          source_ref="${IMAGE_NAME_RELEASE}@${RELEASE_IMAGE_DIGEST}"
          test -n "$RELEASE_IMAGE_DIGEST"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker buildx imagetools create -t "$tag" "$source_ref"
            promoted_digest="$(docker buildx imagetools inspect "$tag" | awk '/^Digest:/ {print $2; exit}')"
            test "$promoted_digest" = "$RELEASE_IMAGE_DIGEST"
          done <<EOF
          $PROMOTED_TAGS
          EOF

  native-agent-release-artifacts:
    needs: validate-release-tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        env:
          HUSKY: '0'
        run: npm ci --legacy-peer-deps
      - name: Build native Agent release artifacts
        env:
          OPSKNIGHT_VERSION: ${{ github.ref_name }}
        run: bash scripts/build-agent-artifacts.sh
      - name: Verify generated artifacts and SHA256SUMS
        run: |
          cd dist/agent
          test -f opsknight-agent-linux-x64.tar.gz
          test -f opsknight-agent-linux-arm64.tar.gz
          test -f install.sh
          test -f preflight.sh
          test -f SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Upload native agent artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-agent-release-artifacts-${{ github.ref_name }}
          path: dist/agent/
          retention-days: 7

  publish-github-release:
    needs: [build, sbom-provenance, pgbouncer-image, agent-image, promote-release-tags, native-agent-release-artifacts]
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      needs.build.result == 'success' &&
      needs.sbom-provenance.result == 'success' &&
      needs.pgbouncer-image.result == 'success' &&
      needs.promote-release-tags.result == 'success' &&
      needs.native-agent-release-artifacts.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download native agent release artifacts
        uses: actions/download-artifact@v4
        with:
          name: native-agent-release-artifacts-${{ github.ref_name }}
          path: dist/agent

      - name: Verify certified native agent artifacts before publishing
        run: |
          cd dist/agent
          test -f opsknight-agent-linux-x64.tar.gz
          test -f opsknight-agent-linux-arm64.tar.gz
          test -f install.sh
          test -f preflight.sh
          test -f SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Download tag release certification evidence
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: release-certification-${{ github.ref_name }}
          path: release-certification

      - name: Publish GitHub Release after release artifacts succeed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_IMAGE_DIGEST: ${{ needs.build.outputs.release_image_digest }}
          PGBOUNCER_IMAGE_DIGEST: ${{ needs.pgbouncer-image.outputs.pgbouncer_image_digest }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          title="OpsKnight ${tag#v}"
          prerelease=false
          make_latest=false
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            make_latest=true
          else
            prerelease=true
          fi

          release_notes_file=".github/releases/${tag}.md"
          curated_body_file="$(mktemp)"
          has_curated_notes=false
          if [ -f "$release_notes_file" ]; then
            echo "Found curated release notes in ${release_notes_file}"
            parsed_title="$(RELEASE_NOTES_FILE="$release_notes_file" CURATED_BODY_FILE="$curated_body_file" node <<'NODE'
            const fs = require('node:fs');
            const content = fs.readFileSync(process.env.RELEASE_NOTES_FILE, 'utf8');
            const lines = content.split('\n');
            let title = '';
            let body = content;
            if (lines[0].startsWith('# ')) {
              title = lines[0].replace(/^#\s+/, '').trim();
              body = lines.slice(1).join('\n').trimStart();
            }
            fs.writeFileSync(process.env.CURATED_BODY_FILE, body);
            process.stdout.write(title);
            NODE
            )"
            if [ -n "$parsed_title" ]; then
              title="$parsed_title"
            fi
            has_curated_notes=true
          fi

          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq .id 2>/dev/null || true)"
          if [ -n "$release_id" ]; then
            echo "GitHub Release ${tag} already exists; refreshing latest/prerelease flags and certification evidence."
            if [ "$has_curated_notes" = true ]; then
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
                -f name="$title" \
                -F body=@"$curated_body_file" \
                -F prerelease="$prerelease" \
                -f make_latest="$make_latest" >/dev/null
            else
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
                -f name="$title" \
                -F prerelease="$prerelease" \
                -f make_latest="$make_latest" >/dev/null
            fi
          else
            if [ "$has_curated_notes" = true ]; then
              gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
                -f tag_name="$tag" \
                -f target_commitish="${GITHUB_SHA}" \
                -f name="$title" \
                -F body=@"$curated_body_file" \
                -F generate_release_notes=false \
                -F prerelease="$prerelease" \
                -f make_latest="$make_latest" >/dev/null
            else
              gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
                -f tag_name="$tag" \
                -f target_commitish="${GITHUB_SHA}" \
                -f name="$title" \
                -F generate_release_notes=true \
                -F prerelease="$prerelease" \
                -f make_latest="$make_latest" >/dev/null
            fi
          fi
          rm -f "$curated_body_file"

          summary_asset="$(find release-certification -name "release-certification-${tag}.json" -print -quit 2>/dev/null || true)"
          if [ -n "$summary_asset" ] && [ -f "$summary_asset" ]; then
            SUMMARY_ASSET="$summary_asset" node <<'NODE'
            const fs = require('node:fs');
            const summary = JSON.parse(fs.readFileSync(process.env.SUMMARY_ASSET, 'utf8'));
            summary.releaseImageIndexDigest = process.env.RELEASE_IMAGE_DIGEST;
            summary.pgbouncerImageDigest = process.env.PGBOUNCER_IMAGE_DIGEST;
            fs.writeFileSync(process.env.SUMMARY_ASSET, `${JSON.stringify(summary, null, 2)}\n`);
            NODE
            gh release upload "$tag" "$summary_asset" --clobber || true
          fi

          echo "Uploading certified Native Linux Agent release assets..."
          if [ -d dist/agent ]; then
            gh release upload "$tag" \
              dist/agent/opsknight-agent-linux-*.tar.gz \
              dist/agent/install.sh \
              dist/agent/preflight.sh \
              dist/agent/SHA256SUMS --clobber
          fi

          release_body="$(gh release view "$tag" --json body --jq .body)"
          updated_body_file="$(mktemp)"
          RELEASE_BODY="$release_body" UPDATED_BODY_FILE="$updated_body_file" node <<'NODE'
          const fs = require('node:fs');
          const marker = '<!-- opsknight-release-certification -->';
          const section = `${marker}
          ## Release certification
          - Release image index digest: \`${process.env.RELEASE_IMAGE_DIGEST}\`
          - PgBouncer image digest: \`${process.env.PGBOUNCER_IMAGE_DIGEST}\`
          `;
          const body = process.env.RELEASE_BODY || '';
          const withoutOld = body.includes(marker) ? body.slice(0, body.indexOf(marker)).trimEnd() : body.trimEnd();
          fs.writeFileSync(process.env.UPDATED_BODY_FILE, `${withoutOld}${withoutOld ? '\n\n' : ''}${section}\n`);
          NODE
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq .id)"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" -F body=@"$updated_body_file" >/dev/null
          rm -f "$updated_body_file"

          if [ "$make_latest" = true ]; then
            latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
            test "$latest_tag" = "$tag"
          else
            release_prerelease="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq .prerelease)"
            test "$release_prerelease" = true
          fi
