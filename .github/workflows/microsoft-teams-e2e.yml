name: Microsoft Teams Contract + DB Integration

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/microsoft-teams/**'
      - 'src/app/api/microsoft-teams/**'
      - 'src/app/(app)/settings/integrations/microsoft-teams/**'
      - 'src/components/settings/microsoft-teams/**'
      - 'prisma/schema.prisma'
      - 'prisma/migrations/**teams**/**'
      - 'tests/**/*microsoft-teams*'
      - '.github/workflows/microsoft-teams-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'src/lib/microsoft-teams/**'
      - 'src/app/api/microsoft-teams/**'
      - 'src/app/(app)/settings/integrations/microsoft-teams/**'
      - 'src/components/settings/microsoft-teams/**'
      - 'prisma/schema.prisma'
      - 'prisma/migrations/**teams**/**'
      - 'tests/**/*microsoft-teams*'
      - '.github/workflows/microsoft-teams-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: microsoft-teams-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  teams-contract-and-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opsknight_teams_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/opsknight_teams_e2e?schema=public
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci --legacy-peer-deps
      - name: Apply production migrations
        run: npx prisma migrate deploy && npx prisma generate
      - name: Teams transport, delivery, lifecycle, and manifest contracts
        run: >-
          npx vitest run --no-file-parallelism
          tests/lib/microsoft-teams-app-manifest.test.ts
          tests/lib/microsoft-teams-auth.test.ts
          tests/lib/microsoft-teams-capabilities.test.ts
          tests/lib/microsoft-teams-cards.test.ts
          tests/lib/microsoft-teams-delivery.test.ts
          tests/lib/microsoft-teams-delivery-processor.test.ts
          tests/lib/microsoft-teams-service-url.test.ts
          tests/architecture/microsoft-teams-transport-contract.test.ts

  live-tenant-credentials:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    env:
      TENANT_ID: ${{ secrets.TEAMS_E2E_TENANT_ID }}
      CLIENT_ID: ${{ secrets.TEAMS_E2E_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.TEAMS_E2E_CLIENT_SECRET }}
      TEAM_ID: ${{ secrets.TEAMS_E2E_TEAM_ID }}
      CHANNEL_ID: ${{ secrets.TEAMS_E2E_CHANNEL_ID }}
      SERVICE_URL: ${{ secrets.TEAMS_E2E_SERVICE_URL }}
    steps:
      - id: check
        run: |
          if test -n "$TENANT_ID" && test -n "$CLIENT_ID" && test -n "$CLIENT_SECRET" && test -n "$TEAM_ID" && test -n "$CHANNEL_ID" && test -n "$SERVICE_URL"; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi

  live-tenant-smoke:
    needs: live-tenant-credentials
    if: needs.live-tenant-credentials.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TEAMS_E2E_TENANT_ID: ${{ secrets.TEAMS_E2E_TENANT_ID }}
      TEAMS_E2E_CLIENT_ID: ${{ secrets.TEAMS_E2E_CLIENT_ID }}
      TEAMS_E2E_CLIENT_SECRET: ${{ secrets.TEAMS_E2E_CLIENT_SECRET }}
      TEAMS_E2E_TEAM_ID: ${{ secrets.TEAMS_E2E_TEAM_ID }}
      TEAMS_E2E_CHANNEL_ID: ${{ secrets.TEAMS_E2E_CHANNEL_ID }}
      TEAMS_E2E_SERVICE_URL: ${{ secrets.TEAMS_E2E_SERVICE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      - name: Discover channel, create card, and update the same activity
        run: node scripts/ci/microsoft-teams-live-smoke.mjs
