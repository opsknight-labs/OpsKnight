name: Auth Browser E2E

# Canonical PR browser E2E runs inside tests.yml under the single shared build artifact.
# This workflow is preserved for isolated manual debugging and dispatch.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opsknight_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/opsknight_e2e?schema=public
      HUSKY: '0'
      PLAYWRIGHT_PRODUCTION_SERVER: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node & dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: 20
          generate-prisma: 'true'

      - name: Prepare browser-test database
        uses: ./.github/actions/setup-test-db
        with:
          run-smoke: 'false'
          run-validation: 'false'

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build auth browser application
        run: npm run build

      - name: Run authentication browser contracts
        run: npx playwright test --project=chromium

      - name: Run trusted-proxy host routing browser contracts
        run: TRUST_PROXY_HEADERS=true npx playwright test tests/e2e/host-bootstrap-routing.spec.ts --project=chromium

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: auth-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
