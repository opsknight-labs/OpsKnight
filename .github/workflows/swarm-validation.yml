name: Docker Swarm Validation

on:
  push:
    branches:
      - main
    paths:
      - 'deploy/swarm/**'
      - 'docker-entrypoint.sh'
      - 'deploy/images/pgbouncer/**'
      - 'deploy/scripts/validate-runtime-capacity.cjs'
      - 'Dockerfile'
      - 'package.json'
      - 'prisma/**'
      - '.github/workflows/swarm-validation.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'deploy/swarm/**'
      - 'docker-entrypoint.sh'
      - 'deploy/images/pgbouncer/**'
      - 'deploy/scripts/validate-runtime-capacity.cjs'
      - 'Dockerfile'
      - 'package.json'
      - 'prisma/**'
      - '.github/workflows/swarm-validation.yml'

concurrency:
  group: swarm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swarm-l0-validation:
    name: L0 Syntax, Config & Capacity Validation
    runs-on: ubuntu-latest
    env:
      OPSKNIGHT_IMAGE: ghcr.io/opsknight-labs/opsknight:ci-test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Shell Script Syntax
        run: |
          echo "Checking shell scripts syntax..."
          bash -n deploy/swarm/scripts/*.sh
          echo "All scripts passed syntax validation."

      - name: Validate YAML Parses
        run: |
          ruby -e 'require "yaml"; ARGV.each { |f| YAML.load_file(f); puts "Parsed #{f}" }' \
            .github/workflows/swarm-validation.yml \
            deploy/swarm/docker-stack.db.yml \
            deploy/swarm/docker-stack.integrated.yml \
            deploy/swarm/docker-stack.yml \
            deploy/swarm/docker-stack.pgbouncer.yml \
            deploy/swarm/docker-stack.external-db.yml \
            deploy/swarm/docker-stack.external-db.integrated.yml \
            deploy/swarm/docker-stack.ca.split.yml \
            deploy/swarm/docker-stack.ca.integrated.yml \
            deploy/swarm/docker-stack.pgbouncer-ca.yml

      - name: Validate Bundled DB Stack Config
        run: |
          cd deploy/swarm
          docker stack config -c docker-stack.db.yml >/dev/null
          echo "Bundled DB docker-stack.db.yml is valid."

      - name: Validate Integrated Stack Config
        run: |
          cd deploy/swarm
          docker stack config -c docker-stack.integrated.yml >/dev/null
          echo "Integrated docker-stack.integrated.yml is valid."

      - name: Validate Core Split Stack Config
        run: |
          cd deploy/swarm
          docker stack config -c docker-stack.yml >/dev/null
          echo "Core split docker-stack.yml is valid."

      - name: Validate Core Split Stack Fails Closed Without OPSKNIGHT_IMAGE
        run: |
          cd deploy/swarm
          if env -u OPSKNIGHT_IMAGE docker stack config -c docker-stack.yml >/dev/null 2>&1; then
            echo "❌ Expected docker stack config to fail when OPSKNIGHT_IMAGE is unset!" >&2
            exit 1
          fi
          echo "Core split docker-stack.yml correctly fails closed without explicit OPSKNIGHT_IMAGE."

      - name: Validate PgBouncer Overlay Config
        run: |
          cd deploy/swarm
          docker stack config -c docker-stack.yml -c docker-stack.pgbouncer.yml >/dev/null
          echo "PgBouncer overlay configuration is valid."

      - name: Validate External DB Overlay Config
        run: |
          cd deploy/swarm
          docker stack config -c docker-stack.yml -c docker-stack.external-db.yml >/dev/null
          docker stack config -c docker-stack.integrated.yml -c docker-stack.external-db.integrated.yml >/dev/null
          echo "External DB overlay configurations are valid."

      - name: Validate Custom CA Overlay Config
        run: |
          cd deploy/swarm
          docker stack config -c docker-stack.yml -c docker-stack.ca.split.yml >/dev/null
          docker stack config -c docker-stack.integrated.yml -c docker-stack.ca.integrated.yml >/dev/null
          docker stack config -c docker-stack.pgbouncer.yml -c docker-stack.pgbouncer-ca.yml >/dev/null
          echo "Custom CA overlay configuration is valid."

      - name: Validate All Combined Overlays
        run: |
          cd deploy/swarm
          docker stack config \
            -c docker-stack.yml \
            -c docker-stack.external-db.yml \
            -c docker-stack.pgbouncer.yml \
            -c docker-stack.ca.split.yml \
            -c docker-stack.pgbouncer-ca.yml >/dev/null
          echo "All combined overlays are valid."

      - name: Validate Runtime Capacity for Swarm Replicas
        run: |
          echo "--- Testing Split Swarm Capacity ---"
          SWARM_REPLICAS_WEB=2 \
          SWARM_REPLICAS_SCHEDULER=2 \
          SWARM_REPLICAS_GENERAL_WORKER=1 \
          SWARM_REPLICAS_CRITICAL_WORKER=1 \
          SWARM_REPLICAS_BULK_WORKER=1 \
          SWARM_REPLICAS_STATUS_PROJECTOR=1 \
          node deploy/scripts/validate-runtime-capacity.cjs

          echo "--- Testing Split Swarm + PgBouncer Capacity ---"
          SWARM_REPLICAS_WEB=4 \
          SWARM_REPLICAS_PGBOUNCER=2 \
          SWARM_REPLICAS_SCHEDULER=2 \
          SWARM_STACK_FILE="docker-stack.pgbouncer.yml" \
          PGBOUNCER_ENABLED="true" \
          node deploy/scripts/validate-runtime-capacity.cjs

          echo "--- Testing Integrated Swarm Capacity (3 replicas) ---"
          OPSKNIGHT_RUNTIME_MODE="integrated" \
          INTEGRATED_REPLICAS=3 \
          node deploy/scripts/validate-runtime-capacity.cjs

  swarm-e2e-lifecycle:
    name: L1-L5 Swarm Convergence, Scaling, Secret Rotation & Mode Switching
    needs: swarm-l0-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Initialize Docker Swarm Node
        run: |
          docker swarm init --advertise-addr 127.0.0.1
          docker node update --label-add opsknight.database=true $(docker info --format '{{.Swarm.NodeID}}')
          docker node ls

      - name: Build Swarm Test Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: opsknight-local:swarm-ci
          build-args: |
            SOURCE_CODE_URL=https://github.com/${{ github.repository }}/tree/${{ github.sha }}
            BUILD_REVISION=${{ github.sha }}

      - name: Build Swarm PgBouncer Test Container Image
        run: |
          docker build -t opsknight-pgbouncer:local deploy/images/pgbouncer

      - name: Generate Production Swarm Secret Matrix
        run: |
          mkdir -p .swarm-ci
          NEXTAUTH_SECRET="$(openssl rand -base64 48)"
          API_KEY_SECRET="$(openssl rand -base64 48)"
          while [ "${API_KEY_SECRET}" = "${NEXTAUTH_SECRET}" ]; do
            API_KEY_SECRET="$(openssl rand -base64 48)"
          done
          {
            printf 'export NEXTAUTH_SECRET=%q\n' "${NEXTAUTH_SECRET}"
            printf 'export API_KEY_SECRET=%q\n' "${API_KEY_SECRET}"
            printf 'export POSTGRES_PASSWORD=%q\n' "$(openssl rand -base64 36)"
            printf 'export ROTATED_NEXTAUTH_SECRET=%q\n' "$(openssl rand -base64 48)"
            printf 'export SWARM_OLD_ENCRYPTION_KEY=%q\n' "$(openssl rand -hex 32)"
            printf 'export SWARM_NEW_ENCRYPTION_KEY=%q\n' "$(openssl rand -hex 32)"
          } > .swarm-ci/secrets.env

      - name: Create Swarm Validation Helpers
        run: |
          cat > .swarm-ci/swarm-validation-helpers.sh <<'BASH'
          set -euo pipefail

          load_swarm_ci_secrets() {
            # shellcheck source=/dev/null
            . ./.swarm-ci/secrets.env
            export OPSKNIGHT_IMAGE="opsknight-local:swarm-ci"
            export SWARM_RESOLVE_IMAGE_NEVER="true"
            export ENVIRONMENT="production"
            unset ALLOW_INSECURE_SECRETS || true
          }

          use_keyring_only() {
            unset ENCRYPTION_KEY || true
            export ENCRYPTION_KEYS="k1:${SWARM_OLD_ENCRYPTION_KEY}"
          }

          use_legacy_single_key() {
            export ENCRYPTION_KEY="${SWARM_OLD_ENCRYPTION_KEY}"
            unset ENCRYPTION_KEYS || true
          }

          use_rotated_keyring() {
            export ENCRYPTION_KEY="${SWARM_OLD_ENCRYPTION_KEY}"
            export ENCRYPTION_KEYS="k2:${SWARM_NEW_ENCRYPTION_KEY},k1:${SWARM_OLD_ENCRYPTION_KEY}"
          }

          swarm_services_for_mode() {
            if [ "${1:-split}" = "integrated" ]; then
              printf '%s\n' opsknight_opsknight-app
            else
              printf '%s\n' \
                opsknight_opsknight-web \
                opsknight_opsknight-scheduler \
                opsknight_opsknight-general-worker \
                opsknight_opsknight-critical-worker \
                opsknight_opsknight-bulk-worker \
                opsknight_opsknight-status-projector
            fi
          }

          service_env_value() {
            local service="$1"
            local key="$2"
            docker service inspect "${service}" --format '{{json .Spec.TaskTemplate.ContainerSpec.Env}}' |
              node -e 'const fs=require("fs"); const env=JSON.parse(fs.readFileSync(0,"utf8")); const key=process.argv[1]; const row=env.find(v => v === key || v.startsWith(`${key}=`)); if (!row) process.exit(2); console.log(row.includes("=") ? row.slice(key.length + 1) : "");' "${key}"
          }

          assert_service_env_equals() {
            local service="$1"
            local key="$2"
            local expected="$3"
            local actual
            actual="$(service_env_value "${service}" "${key}")"
            if [ "${actual}" != "${expected}" ]; then
              echo "❌ ${service} expected ${key}=${expected}, got '${actual}'" >&2
              exit 1
            fi
          }

          container_for_service() {
            local service="$1"
            local container_id
            container_id="$(docker ps --filter "label=com.docker.swarm.service.name=${service}" --format '{{.ID}}' | head -n 1)"
            if [ -z "${container_id}" ]; then
              echo "❌ No running container found for ${service}" >&2
              exit 1
            fi
            printf '%s\n' "${container_id}"
          }

          assert_secret_file_equals() {
            local service="$1"
            local path="$2"
            local expected="$3"
            local container_id actual
            container_id="$(container_for_service "${service}")"
            actual="$(docker exec "${container_id}" sh -c "cat '${path}'")"
            if [ "${actual}" != "${expected}" ]; then
              echo "❌ ${service} secret ${path} did not match expected value" >&2
              exit 1
            fi
          }

          assert_runtime_secret_delivery() {
            local mode="${1:-split}"
            local service
            while read -r service; do
              [ -z "${service}" ] && continue
              assert_service_env_equals "${service}" "API_KEY_SECRET_FILE" "/run/secrets/opsknight_api_key_secret"
              assert_service_env_equals "${service}" "ENCRYPTION_KEY_FILE" "/run/secrets/opsknight_encryption_key"
              assert_service_env_equals "${service}" "ENCRYPTION_KEYS_FILE" "/run/secrets/opsknight_encryption_keys"
              assert_secret_file_equals "${service}" "/run/secrets/opsknight_api_key_secret" "${API_KEY_SECRET}"
            done < <(swarm_services_for_mode "${mode}")
          }

          assert_allow_insecure_propagated() {
            local service
            while read -r service; do
              [ -z "${service}" ] && continue
              assert_service_env_equals "${service}" "ALLOW_INSECURE_SECRETS" "true"
            done < <(swarm_services_for_mode split)
          }

          assert_split_keyring_secret() {
            local expected="$1"
            local service
            while read -r service; do
              [ -z "${service}" ] && continue
              assert_service_env_equals "${service}" "ENCRYPTION_KEYS_FILE" "/run/secrets/opsknight_encryption_keys"
              assert_secret_file_equals "${service}" "/run/secrets/opsknight_encryption_keys" "${expected}"
            done < <(swarm_services_for_mode split)
          }

          secret_name_for_target() {
            local service="$1"
            local target="$2"
            docker service inspect "${service}" --format '{{json .Spec.TaskTemplate.ContainerSpec.Secrets}}' |
              node -e 'const fs=require("fs"); const secrets=JSON.parse(fs.readFileSync(0,"utf8")); const target=process.argv[1]; const match=secrets.find(s => s.File && s.File.Name === target); if (!match) process.exit(2); console.log(match.SecretName);' "${target}"
          }

          assert_migration_api_secret_delivery() {
            local probe="opsknight_migration_api_secret_probe"
            local api_secret
            api_secret="$(secret_name_for_target opsknight_opsknight-web /run/secrets/opsknight_api_key_secret)"
            docker service rm "${probe}" >/dev/null 2>&1 || true
            docker service create \
              --name "${probe}" \
              --network opsknight_network \
              --no-resolve-image \
              --restart-condition none \
              --secret "source=${api_secret},target=/run/secrets/opsknight_api_key_secret" \
              --env API_KEY_SECRET_FILE=/run/secrets/opsknight_api_key_secret \
              --entrypoint sh \
              "${OPSKNIGHT_IMAGE}" \
              -c 'test -s "$API_KEY_SECRET_FILE" && test "$(wc -c < "$API_KEY_SECRET_FILE")" -ge 32' >/dev/null
            assert_service_env_equals "${probe}" "API_KEY_SECRET_FILE" "/run/secrets/opsknight_api_key_secret"
            for _ in $(seq 1 60); do
              state="$(docker service ps "${probe}" --no-trunc --format '{{.CurrentState}}' 2>/dev/null | head -n 1 || true)"
              if echo "${state}" | grep -qiE '^Complete|Shutdown \(0\)'; then
                docker service rm "${probe}" >/dev/null 2>&1 || true
                return 0
              fi
              if echo "${state}" | grep -qiE '^Failed|^Rejected|\([1-9][0-9]*\)'; then
                docker service logs "${probe}" || true
                docker service rm "${probe}" >/dev/null 2>&1 || true
                echo "❌ Migration API secret probe failed: ${state}" >&2
                exit 1
              fi
              sleep 1
            done
            docker service logs "${probe}" || true
            docker service rm "${probe}" >/dev/null 2>&1 || true
            echo "❌ Migration API secret probe timed out" >&2
            exit 1
          }
          BASH

      - name: Deploy Core Split Swarm Stack with Keyring-Only Production Secrets
        run: |
          . ./.swarm-ci/swarm-validation-helpers.sh
          load_swarm_ci_secrets
          use_keyring_only
          ./deploy/swarm/scripts/deploy.sh
          ./deploy/swarm/scripts/health-check.sh
          assert_runtime_secret_delivery split
          assert_migration_api_secret_delivery

      - name: Test Horizontal Dynamic Scaling
        run: |
          echo "Scaling web tier from 2 to 3 replicas..."
          docker service scale opsknight_opsknight-web=3
          sleep 10
          ./deploy/swarm/scripts/health-check.sh

      - name: Test Legacy Single-Key Upgrade Produces k1 Keyring
        run: |
          echo "Deploying with legacy ENCRYPTION_KEY only and asserting k1 keyring synthesis..."
          . ./.swarm-ci/swarm-validation-helpers.sh
          load_swarm_ci_secrets
          use_legacy_single_key
          ./deploy/swarm/scripts/deploy.sh
          ./deploy/swarm/scripts/health-check.sh
          assert_split_keyring_secret "k1:${SWARM_OLD_ENCRYPTION_KEY}"

      - name: Test Encryption Keyring Rotation with Zero Downtime
        run: |
          echo "Rotating encryption to k2:new,k1:old..."
          . ./.swarm-ci/swarm-validation-helpers.sh
          load_swarm_ci_secrets
          use_rotated_keyring
          ./deploy/swarm/scripts/deploy.sh
          ./deploy/swarm/scripts/health-check.sh
          assert_split_keyring_secret "k2:${SWARM_NEW_ENCRYPTION_KEY},k1:${SWARM_OLD_ENCRYPTION_KEY}"

      - name: Test Session Secret Rotation with Zero Downtime
        run: |
          echo "Rotating session secret with new production-valid value..."
          . ./.swarm-ci/swarm-validation-helpers.sh
          load_swarm_ci_secrets
          use_rotated_keyring
          export NEXTAUTH_SECRET="${ROTATED_NEXTAUTH_SECRET}"
          ./deploy/swarm/scripts/deploy.sh
          ./deploy/swarm/scripts/health-check.sh

      - name: Test Runtime Mode Switching (Split -> Integrated with Prune)
        run: |
          echo "Switching runtime from split to integrated mode..."
          . ./.swarm-ci/swarm-validation-helpers.sh
          load_swarm_ci_secrets
          use_rotated_keyring
          export SWARM_RUNTIME_MODE="integrated"
          ./deploy/swarm/scripts/deploy.sh

          if docker service inspect opsknight_opsknight-web >/dev/null 2>&1; then
            echo "❌ Old opsknight-web service was not pruned!" >&2
            exit 1
          fi
          docker service inspect opsknight_opsknight-app >/dev/null 2>&1
          assert_runtime_secret_delivery integrated
          echo "✅ Successfully transitioned to integrated mode; split services pruned."

      - name: Test Topology-Aware Rollback on Integrated App
        run: |
          echo "Testing rollback on integrated app..."
          ./deploy/swarm/scripts/rollback.sh

      - name: Test Runtime Mode Switching (Integrated -> Split with Prune)
        run: |
          echo "Switching runtime back from integrated to split mode..."
          . ./.swarm-ci/swarm-validation-helpers.sh
          load_swarm_ci_secrets
          use_rotated_keyring
          export SWARM_RUNTIME_MODE="split"
          ./deploy/swarm/scripts/deploy.sh

          if docker service inspect opsknight_opsknight-app >/dev/null 2>&1; then
            echo "❌ Old opsknight-app service was not pruned!" >&2
            exit 1
          fi
          docker service inspect opsknight_opsknight-web >/dev/null 2>&1
          echo "✅ Successfully transitioned back to split mode; integrated service pruned."

      - name: Test ALLOW_INSECURE_SECRETS Propagation Escape Hatch
        run: |
          echo "Deploying one deliberate insecure-secret escape-hatch scenario..."
          . ./.swarm-ci/swarm-validation-helpers.sh
          load_swarm_ci_secrets
          use_rotated_keyring
          export SWARM_RUNTIME_MODE="split"
          export ENVIRONMENT="development"
          export ALLOW_INSECURE_SECRETS="true"
          ./deploy/swarm/scripts/deploy.sh
          ./deploy/swarm/scripts/health-check.sh
          assert_allow_insecure_propagated

      - name: Test Split Swarm with PgBouncer and Custom CA
        run: |
          echo "Deploying Swarm with PgBouncer and Custom CA..."
          mkdir -p .swarm-ci
          openssl req -x509 -newkey rsa:2048 -nodes -keyout .swarm-ci/ca.key -out .swarm-ci/ca.crt -days 1 -subj "/CN=test-ca"
          . ./.swarm-ci/swarm-validation-helpers.sh
          load_swarm_ci_secrets
          use_rotated_keyring
          export OPSKNIGHT_PGBOUNCER_IMAGE="opsknight-pgbouncer:local"
          export SWARM_RUNTIME_MODE="split"
          export ENABLE_PGBOUNCER="true"
          export PGBOUNCER_TLS_CA_CERT=".swarm-ci/ca.crt"
          ./deploy/swarm/scripts/deploy.sh
          ./deploy/swarm/scripts/health-check.sh
          echo "✅ Swarm with PgBouncer and Custom CA deployed and healthy."

      - name: Test Integrated Runtime with Custom CA
        run: |
          echo "Deploying Integrated Runtime with Custom CA..."
          . ./.swarm-ci/swarm-validation-helpers.sh
          load_swarm_ci_secrets
          use_rotated_keyring
          export SWARM_RUNTIME_MODE="integrated"
          export PGBOUNCER_TLS_CA_CERT=".swarm-ci/ca.crt"
          ./deploy/swarm/scripts/deploy.sh
          ./deploy/swarm/scripts/health-check.sh
          echo "✅ Integrated Swarm with Custom CA deployed and healthy."

      - name: Test Live External PostgreSQL with TLS, Custom CA, and PgBouncer verify-full
        run: |
          echo "Setting up external TLS-enabled PostgreSQL on Swarm overlay network..."
          docker network inspect opsknight_network >/dev/null 2>&1 || \
            docker network create --driver overlay --attachable opsknight_network

          mkdir -p .swarm-ci/swarm-tls
          openssl req -new -x509 -days 1 -nodes -out .swarm-ci/swarm-tls/ca.crt \
            -keyout .swarm-ci/swarm-tls/ca.key -subj "/CN=swarm-ca" 2>/dev/null
          openssl req -new -nodes -out .swarm-ci/swarm-tls/server.csr \
            -keyout .swarm-ci/swarm-tls/server.key -subj "/CN=swarm-ext-postgres" 2>/dev/null
          openssl x509 -req -in .swarm-ci/swarm-tls/server.csr -days 1 \
            -CA .swarm-ci/swarm-tls/ca.crt -CAkey .swarm-ci/swarm-tls/ca.key -CAcreateserial \
            -out .swarm-ci/swarm-tls/server.crt 2>/dev/null
          docker run --rm -v "${PWD}/.swarm-ci/swarm-tls:/tls:rw" alpine sh -c "chown 70:70 /tls/server.key /tls/server.crt && chmod 600 /tls/server.key && chmod 644 /tls/server.crt"
          chmod 644 .swarm-ci/swarm-tls/ca.crt

          docker rm -f swarm-ext-postgres 2>/dev/null || true
          docker run -d \
            --name swarm-ext-postgres \
            --network opsknight_network \
            -v "${PWD}/.swarm-ci/swarm-tls/server.crt:/var/lib/postgresql/server.crt:ro" \
            -v "${PWD}/.swarm-ci/swarm-tls/server.key:/var/lib/postgresql/server.key:ro" \
            -e POSTGRES_USER=ext_swarm_user \
            -e POSTGRES_PASSWORD=ext_swarm_secret_password_123 \
            -e POSTGRES_DB=ext_swarm_db \
            postgres:16-alpine \
            -c ssl=on \
            -c ssl_cert_file=/var/lib/postgresql/server.crt \
            -c ssl_key_file=/var/lib/postgresql/server.key
          cleanup_ext_db() {
            docker rm -f swarm-ext-postgres 2>/dev/null || true
          }
          trap cleanup_ext_db EXIT

          for i in $(seq 1 30); do
            if docker exec swarm-ext-postgres pg_isready -U ext_swarm_user >/dev/null 2>&1; then
              echo "External TLS PostgreSQL is ready!"
              break
            fi
            sleep 1
          done

          echo "Deploying Swarm split stack with external TLS DB + PgBouncer verify-full..."
          . ./.swarm-ci/swarm-validation-helpers.sh
          load_swarm_ci_secrets
          use_rotated_keyring
          export OPSKNIGHT_PGBOUNCER_IMAGE="opsknight-pgbouncer:local"
          export SWARM_RUNTIME_MODE="split"
          export ENABLE_PGBOUNCER="true"
          export EXTERNAL_DB="true"
          export EXTERNAL_DB_HOST="swarm-ext-postgres"
          export EXTERNAL_DB_PORT="5432"
          export EXTERNAL_DB_USER="ext_swarm_user"
          export EXTERNAL_DB_PASSWORD="ext_swarm_secret_password_123"
          export EXTERNAL_DB_NAME="ext_swarm_db"
          export EXTERNAL_DB_SSLMODE="verify-full"
          export PGBOUNCER_TLS_CA_CERT=".swarm-ci/swarm-tls/ca.crt"

          ./deploy/swarm/scripts/deploy.sh
          ./deploy/swarm/scripts/health-check.sh
          echo "✅ External PostgreSQL with TLS verify-full, Custom CA, and PgBouncer succeeded!"
