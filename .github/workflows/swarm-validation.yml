name: Docker Swarm Validation

on:
  push:
    branches:
      - main
      - feat/docker-swarm-deployment
    paths:
      - 'deploy/swarm/**'
      - 'docker-entrypoint.sh'
      - 'scripts/validate-runtime-capacity.cjs'
      - '.github/workflows/swarm-validation.yml'
  pull_request:
    paths:
      - 'deploy/swarm/**'
      - 'docker-entrypoint.sh'
      - 'scripts/validate-runtime-capacity.cjs'
      - '.github/workflows/swarm-validation.yml'

concurrency:
  group: swarm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swarm-l0-validation:
    name: L0 Syntax, Config & Capacity Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Shell Script Syntax
        run: |
          echo "Checking shell scripts syntax..."
          bash -n deploy/swarm/scripts/*.sh
          echo "All scripts passed syntax validation."

      - name: Validate Core Stack Config
        run: |
          cd deploy/swarm
          docker stack config -c docker-stack.yml >/dev/null
          echo "Core docker-stack.yml is valid."

      - name: Validate PgBouncer Overlay Config
        run: |
          cd deploy/swarm
          docker stack config -c docker-stack.yml -c docker-stack.pgbouncer.yml >/dev/null
          echo "PgBouncer overlay configuration is valid."

      - name: Validate External DB Overlay Config
        run: |
          cd deploy/swarm
          docker stack config -c docker-stack.yml -c docker-stack.external-db.yml >/dev/null
          echo "External DB overlay configuration is valid."

      - name: Validate All Combined Overlays
        run: |
          cd deploy/swarm
          docker stack config -c docker-stack.yml -c docker-stack.pgbouncer.yml -c docker-stack.external-db.yml >/dev/null
          echo "All combined overlays are valid."

      - name: Validate Runtime Capacity for Swarm Replicas
        run: |
          SWARM_REPLICAS_WEB=2 \
          SWARM_REPLICAS_SCHEDULER=2 \
          SWARM_REPLICAS_GENERAL_WORKER=1 \
          SWARM_REPLICAS_CRITICAL_WORKER=1 \
          SWARM_REPLICAS_BULK_WORKER=1 \
          SWARM_REPLICAS_STATUS_PROJECTOR=1 \
          node scripts/validate-runtime-capacity.cjs

  swarm-e2e-lifecycle:
    name: L1-L5 Swarm Convergence, Scaling & Fault Recovery
    needs: swarm-l0-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Initialize Docker Swarm Node
        run: |
          docker swarm init --advertise-addr 127.0.0.1
          docker node ls

      - name: Build Swarm Test Container Image
        run: |
          docker build -t opsknight-local:swarm-ci -f Dockerfile .

      - name: Deploy Swarm Secrets
        run: |
          SECRETS_DIR="deploy/swarm/secrets.example"
          docker secret create opsknight_database_url "${SECRETS_DIR}/database-url.txt.example"
          docker secret create opsknight_direct_database_url "${SECRETS_DIR}/direct-database-url.txt.example"
          docker secret create opsknight_nextauth_secret "${SECRETS_DIR}/nextauth-secret.txt.example"
          docker secret create opsknight_encryption_key "${SECRETS_DIR}/encryption-key.txt.example"

      - name: Deploy Core Stack
        run: |
          export OPSKNIGHT_IMAGE="opsknight-local:swarm-ci"
          docker stack deploy -c deploy/swarm/docker-stack.yml opsknight

      - name: Wait for Stack Convergence
        run: |
          echo "Waiting up to 180s for all services to converge..."
          for i in {1..36}; do
            PENDING=0
            while read -r name image replicas ports; do
              [ -z "$replicas" ] && continue
              current=$(echo "$replicas" | cut -d'/' -f1)
              desired=$(echo "$replicas" | cut -d'/' -f2)
              if [ "$current" != "$desired" ]; then
                PENDING=$((PENDING + 1))
              fi
            done < <(docker stack services opsknight --format '{{.Name}} {{.Image}} {{.Replicas}} {{.Ports}}')
            if [ "$PENDING" -eq 0 ]; then
              echo "Stack converged in $((i * 5))s!"
              break
            fi
            echo "Waiting for $PENDING services to converge ($((i * 5))s)..."
            sleep 5
          done
          docker stack services opsknight

      - name: Run Swarm Health Verification
        run: |
          ./deploy/swarm/scripts/health-check.sh

      - name: Test Horizontal Dynamic Scaling
        run: |
          echo "Scaling web tier from 2 to 3 replicas..."
          docker service scale opsknight_opsknight-web=3
          sleep 10
          docker stack services opsknight

      - name: Test Task Recovery (Forced Task Replacement)
        run: |
          echo "Forcing web service rolling replacement..."
          docker service update --force opsknight_opsknight-web
          sleep 15
          ./deploy/swarm/scripts/health-check.sh

      - name: Test Safe Rollback
        run: |
          ./deploy/swarm/scripts/rollback.sh
