name: Docs links (v1.4)

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/v1.4/**'
      - 'scripts/check-docs-links.cjs'
      - 'scripts/check-docs-capabilities.cjs'
      - 'docs/V1_4_CAPABILITY_INVENTORY.md'
      - '.github/workflows/docs-links.yml'
  push:
    branches: [main]
    paths:
      - 'docs/v1.4/**'
      - 'scripts/check-docs-links.cjs'
      - 'scripts/check-docs-capabilities.cjs'
      - 'docs/V1_4_CAPABILITY_INVENTORY.md'
      - '.github/workflows/docs-links.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check relative markdown links in docs/v1.4
        run: node scripts/check-docs-links.cjs
      - name: Check code-to-doc capability coverage
        run: node scripts/check-docs-capabilities.cjs
