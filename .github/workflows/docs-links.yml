name: Documentation quality

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/v2.0.0/**'
      - 'docs/internal/**'
      - 'scripts/docs/**'
      - 'src/**'
      - 'deploy/**'
      - 'prisma/**'
      - 'scripts/check-docs-links.cjs'
      - 'scripts/check-docs-capabilities.cjs'
      - 'package.json'
      - '.github/workflows/docs-links.yml'
  push:
    branches: [main]
    paths:
      - 'docs/v2.0.0/**'
      - 'docs/internal/**'
      - 'scripts/docs/**'
      - 'src/**'
      - 'deploy/**'
      - 'prisma/**'
      - 'scripts/check-docs-links.cjs'
      - 'scripts/check-docs-capabilities.cjs'
      - 'package.json'
      - '.github/workflows/docs-links.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate 2.0.0 documentation contracts
        run: npm run docs:lint
      - name: Detect documentation impact
        if: github.event_name == 'pull_request'
        env:
          DOCS_IMPACT_BASE: origin/${{ github.base_ref }}
          DOCS_IMPACT_STRICT: 'true'
        run: npm run docs:impact
