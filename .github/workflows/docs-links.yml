name: Documentation quality

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'docs/v2.0.0/**'
      - 'docs/internal/**'
      - 'scripts/docs/**'
      - 'src/**'
      - 'deploy/**'
      - 'artifacts/load-certification/certification-summary.json'
      - 'prisma/**'
      - 'scripts/check-docs-links.cjs'
      - 'scripts/check-docs-capabilities.cjs'
      - 'package.json'
      - '.github/workflows/docs-links.yml'
  push:
    branches: [main]
    paths:
      - 'docs/v2.0.0/**'
      - 'docs/internal/**'
      - 'scripts/docs/**'
      - 'src/**'
      - 'deploy/**'
      - 'artifacts/load-certification/certification-summary.json'
      - 'prisma/**'
      - 'scripts/check-docs-links.cjs'
      - 'scripts/check-docs-capabilities.cjs'
      - 'package.json'
      - '.github/workflows/docs-links.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Test documentation tooling
        run: npm run docs:test
      - name: Regenerate documentation artifacts
        run: |
          npm run docs:discover:write
          npm run docs:reference
          npm run docs:integrations
          npm run docs:capacity
          npm run docs:routes
          npm run docs:v15-parity
          npm run docs:depth
          npm run docs:claims
      - name: Reject generated documentation drift
        run: git diff --exit-code -- generated/docs-discovery/current.json generated/docs-contracts/current.json generated/docs-contracts/capacity.json generated/docs-contracts/routes.json generated/docs-certification/depth.json generated/docs-certification/v15-parity-report.md docs/internal/certification/v1.5-to-v2-parity.yaml docs/v2.0.0/reference docs/v2.0.0/integrations docs/v2.0.0/operate/capacity/benchmark-results.md
      - name: Validate 2.0.0 documentation contracts
        run: npm run docs:certify:static
      - name: Detect documentation impact
        if: github.event_name == 'pull_request'
        env:
          DOCS_IMPACT_BASE: origin/${{ github.base_ref }}
          DOCS_IMPACT_STRICT: 'true'
        run: npm run docs:impact

  runtime-certification:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Run full documentation certification
        run: npm run docs:certify
