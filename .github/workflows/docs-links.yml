name: Documentation quality

# Lightweight checks only: documentation is written by hand (each release copies the
# previous version's pages and adds pages for new features). Nothing here generates docs.
on:
  # The PR gate (tests.yml static validation) runs docs:lint and docs:impact; this is manual-only.
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Check frontmatter, links, capabilities and evidence
        run: npm run docs:lint
