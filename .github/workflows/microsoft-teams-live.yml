name: Microsoft Teams Live Tenant Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: microsoft-teams-live-tenant
  cancel-in-progress: false

jobs:
  live-tenant-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: microsoft-teams-e2e
    env:
      TEAMS_E2E_TENANT_ID: ${{ secrets.TEAMS_E2E_TENANT_ID }}
      TEAMS_E2E_CLIENT_ID: ${{ secrets.TEAMS_E2E_CLIENT_ID }}
      TEAMS_E2E_CLIENT_SECRET: ${{ secrets.TEAMS_E2E_CLIENT_SECRET }}
      TEAMS_E2E_TEAM_ID: ${{ secrets.TEAMS_E2E_TEAM_ID }}
      TEAMS_E2E_CHANNEL_ID: ${{ secrets.TEAMS_E2E_CHANNEL_ID }}
      TEAMS_E2E_SERVICE_URL: ${{ secrets.TEAMS_E2E_SERVICE_URL }}
      TEAMS_E2E_INCIDENT_ID: ${{ secrets.TEAMS_E2E_INCIDENT_ID }}
      TEAMS_E2E_DESTINATION_ID: ${{ secrets.TEAMS_E2E_DESTINATION_ID }}
      TEAMS_E2E_MESSAGE_GENERATION: ${{ secrets.TEAMS_E2E_MESSAGE_GENERATION }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      - name: Discover channel, create card, and update the same activity
        run: node scripts/ci/microsoft-teams-live-smoke.mjs
