name: Mobile PWA Browser E2E

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/app/(mobile)/**'
      - 'src/app/(public)/m/**'
      - 'src/app/login/**'
      - 'src/components/mobile/**'
      - 'src/components/DashboardNotifications.tsx'
      - 'src/lib/offline-queue.ts'
      - 'src/lib/pwa-session-policy.ts'
      - 'src/lib/incidents/status-client.ts'
      - 'src/lib/incidents/status-http.ts'
      - 'src/lib/incident-push-delivery.ts'
      - 'public/custom-sw.js'
      - 'next.config.ts'
      - 'playwright.pwa.config.ts'
      - 'tests/e2e/mobile-pwa.spec.ts'
      - 'tests/e2e/mobile-pwa-production.spec.ts'
      - 'tests/e2e/mobile-responsive-matrix.spec.ts'
      - '.github/workflows/mobile-pwa-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'src/app/(mobile)/**'
      - 'src/app/(public)/m/**'
      - 'src/app/login/**'
      - 'src/components/mobile/**'
      - 'src/components/DashboardNotifications.tsx'
      - 'src/lib/offline-queue.ts'
      - 'src/lib/pwa-session-policy.ts'
      - 'src/lib/incidents/status-client.ts'
      - 'src/lib/incidents/status-http.ts'
      - 'src/lib/incident-push-delivery.ts'
      - 'public/custom-sw.js'
      - 'next.config.ts'
      - 'playwright.pwa.config.ts'
      - 'tests/e2e/mobile-pwa.spec.ts'
      - 'tests/e2e/mobile-pwa-production.spec.ts'
      - 'tests/e2e/mobile-responsive-matrix.spec.ts'
      - '.github/workflows/mobile-pwa-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-pwa-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build mobile application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node & dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: 20
          generate-prisma: 'true'

      - name: Build application & verify budgets
        uses: ./.github/actions/build-app
        with:
          upload-artifact: 'true'
          artifact-name: mobile-next-build

  mobile-browser:
    name: Mobile browser matrix
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opsknight_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/opsknight_e2e?schema=public
      HUSKY: '0'
      PLAYWRIGHT_PRODUCTION_SERVER: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node & dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: 20
          generate-prisma: 'true'

      - name: Restore mobile build artifact
        uses: ./.github/actions/restore-build
        with:
          artifact-name: mobile-next-build

      - name: Prepare browser-test database
        uses: ./.github/actions/setup-test-db
        with:
          run-smoke: 'false'
          run-validation: 'false'

      - name: Install mobile browser engines
        run: npx playwright install --with-deps chromium webkit

      - name: Run Android and iPhone browser contracts + responsive matrix
        run: >-
          npx playwright test
          tests/e2e/mobile-pwa.spec.ts
          tests/e2e/mobile-responsive-matrix.spec.ts
          --project=mobile-chromium
          --project=mobile-webkit

      - name: Upload browser Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-browser-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  pwa-production:
    name: Production PWA contract
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opsknight_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/opsknight_e2e?schema=public
      NEXTAUTH_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      NEXTAUTH_SECRET: opsknight-e2e-nextauth-secret-change-me
      ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      AUTH_TRUST_HOST: 'true'
      HUSKY: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node & dependencies
        uses: ./.github/actions/setup-node
        with:
          node-version: 20
          generate-prisma: 'true'

      - name: Restore mobile build artifact
        uses: ./.github/actions/restore-build
        with:
          artifact-name: mobile-next-build

      - name: Prepare PWA-test database
        uses: ./.github/actions/setup-test-db
        with:
          run-smoke: 'false'
          run-validation: 'false'

      - name: Install production PWA browser engine
        run: npx playwright install --with-deps chromium

      - name: Run generated service-worker contract
        run: >-
          npx playwright test
          -c playwright.pwa.config.ts
          --project=pwa-production-chromium

      - name: Upload production PWA Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-pwa-production-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
