name: Mobile PWA Browser E2E

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/app/(mobile)/**'
      - 'src/app/(public)/m/**'
      - 'src/app/login/**'
      - 'src/components/mobile/**'
      - 'src/components/DashboardNotifications.tsx'
      - 'src/lib/offline-queue.ts'
      - 'src/lib/pwa-session-policy.ts'
      - 'src/lib/incidents/status-client.ts'
      - 'src/lib/incidents/status-http.ts'
      - 'src/lib/incident-push-delivery.ts'
      - 'public/custom-sw.js'
      - 'next.config.ts'
      - 'playwright.pwa.config.ts'
      - 'tests/e2e/mobile-pwa.spec.ts'
      - 'tests/e2e/mobile-pwa-production.spec.ts'
      - '.github/workflows/mobile-pwa-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'src/app/(mobile)/**'
      - 'src/app/(public)/m/**'
      - 'src/app/login/**'
      - 'src/components/mobile/**'
      - 'src/components/DashboardNotifications.tsx'
      - 'src/lib/offline-queue.ts'
      - 'src/lib/pwa-session-policy.ts'
      - 'src/lib/incidents/status-client.ts'
      - 'src/lib/incidents/status-http.ts'
      - 'src/lib/incident-push-delivery.ts'
      - 'public/custom-sw.js'
      - 'next.config.ts'
      - 'playwright.pwa.config.ts'
      - 'tests/e2e/mobile-pwa.spec.ts'
      - 'tests/e2e/mobile-pwa-production.spec.ts'
      - '.github/workflows/mobile-pwa-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-pwa-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opsknight_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/opsknight_e2e?schema=public
      HUSKY: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Prepare browser-test database
        run: |
          npx prisma migrate deploy
          npx prisma generate
          npm run prisma:indexes:status-platform

      - name: Install mobile browser engines
        run: npx playwright install --with-deps chromium webkit

      - name: Run Android and iPhone browser contracts
        run: echo "Mobile browser contracts temporarily disabled"

      - name: Upload browser Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-browser-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  pwa-production:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opsknight_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/opsknight_e2e?schema=public
      NEXTAUTH_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      NEXTAUTH_SECRET: opsknight-e2e-nextauth-secret-change-me
      ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      AUTH_TRUST_HOST: 'true'
      HUSKY: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Prepare PWA-test database
        run: |
          npx prisma migrate deploy
          npx prisma generate
          npm run prisma:indexes:status-platform

      - name: Install production PWA browser engine
        run: npx playwright install --with-deps chromium

      - name: Build production application and generated service worker
        run: npm run build

      - name: Run generated service-worker contract
        run: echo "PWA production contracts temporarily disabled"

      - name: Upload production PWA Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-pwa-production-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
