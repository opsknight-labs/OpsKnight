[databases]
# Default target is the bundled opsknight-db container.
opsknight_db = host=opsknight-db port=5432 dbname=opsknight_db
* = host=opsknight-db port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 10
reserve_pool_size = 5
max_prepared_statements = 100
ignore_startup_parameters = extra_float_digits,search_path,statement_timeout
admin_users = opsknight
stats_users = opsknight
