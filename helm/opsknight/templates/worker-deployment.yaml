{{- if eq .Values.runtime.mode "split" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opsknight.fullname" . }}-worker
  labels:
    {{- include "opsknight.labels" . | nindent 4 }}
    opsknight-role: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "opsknight.selectorLabels" . | nindent 6 }}
      opsknight-role: worker
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "opsknight.selectorLabels" . | nindent 8 }}
        opsknight-role: worker
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.secrets.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      serviceAccountName: {{ include "opsknight.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "opsknight.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "opsknight.fullname" . }}-config
          env:
            - name: OPSKNIGHT_PROCESS_ROLE
              value: worker
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "opsknight.secretName" . }}
                  key: {{ .Values.secrets.keys.workerDatabaseUrl }}
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "opsknight.secretName" . }}
                  key: {{ .Values.secrets.keys.nextauthSecret }}
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "opsknight.secretName" . }}
                  key: {{ .Values.secrets.keys.encryptionKey }}
            - name: OPSKNIGHT_WORKER_BATCH_SIZE
              value: {{ .Values.worker.config.batchSize | quote }}
            - name: OPSKNIGHT_WORKER_CONCURRENCY
              value: {{ .Values.worker.config.concurrency | quote }}
            - name: OPSKNIGHT_WORKER_IDLE_POLL_MS
              value: {{ .Values.worker.config.idlePollMs | quote }}
            - name: OPSKNIGHT_WORKER_BUSY_POLL_MS
              value: {{ .Values.worker.config.busyPollMs | quote }}
          {{- if and (not .Values.postgresql.enabled) .Values.postgresql.tls.enabled (not .Values.database.url) }}
          volumeMounts:
            - name: database-tls
              mountPath: /etc/opsknight-db-tls
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      {{- if and (not .Values.postgresql.enabled) .Values.postgresql.tls.enabled (not .Values.database.url) }}
      volumes:
        - name: database-tls
          secret:
            secretName: {{ required "postgresql.tls.existingSecret is required when postgresql.tls.enabled=true" .Values.postgresql.tls.existingSecret }}
            items:
              - key: {{ .Values.postgresql.tls.caKey }}
                path: ca.crt
      {{- end }}
{{- end }}
