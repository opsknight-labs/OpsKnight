{{- if .Values.networkPolicy.enabled }}
{{- $split := eq .Values.runtime.mode "split" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "opsknight.fullname" . }}-app
spec:
  podSelector:
    matchLabels:
      {{- include "opsknight.selectorLabels" . | nindent 6 }}
      opsknight-role: {{ ternary "web" "integrated" $split }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressNamespaceLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
  egress:
    {{- if and $split .Values.pgbouncer.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "opsknight.name" . }}-pgbouncer
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: {{ .Values.pgbouncer.port }}
    {{- else if .Values.postgresql.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "opsknight.name" . }}-postgresql
      ports:
        - protocol: TCP
          port: 5432
    {{- else }}
    - to: []
      ports:
        - protocol: TCP
          port: {{ .Values.database.port | int }}
    {{- end }}
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to: []
      ports:
        - protocol: TCP
          port: 443
{{- if $split }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "opsknight.fullname" . }}-background
spec:
  podSelector:
    matchExpressions:
      - key: opsknight-role
        operator: In
        values: [worker, scheduler]
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to: []
      ports:
        - protocol: TCP
          port: {{ .Values.database.port | int }}
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to: []
      ports:
        - protocol: TCP
          port: 443
{{- end }}
{{- if .Values.pgbouncer.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "opsknight.pgbouncer.fullname" . }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "opsknight.name" . }}-pgbouncer
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "opsknight.selectorLabels" . | nindent 14 }}
              opsknight-role: web
      ports:
        - protocol: TCP
          port: {{ .Values.pgbouncer.port }}
  egress:
    - to: []
      ports:
        - protocol: TCP
          port: {{ .Values.postgresql.port | int }}
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
{{- if .Values.postgresql.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "opsknight.fullname" . }}-postgresql
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "opsknight.name" . }}-postgresql
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "opsknight.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5432
    {{- if .Values.pgbouncer.enabled }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "opsknight.name" . }}-pgbouncer
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 5432
    {{- end }}
  egress: []
{{- end }}
{{- end }}
