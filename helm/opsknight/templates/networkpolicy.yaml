{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "opsknight.fullname" . }}-app
  labels:
    {{- include "opsknight.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "opsknight.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressNamespaceLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "opsknight.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
  egress:
    {{- if .Values.postgresql.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "opsknight.name" . }}-postgresql
      ports:
        - protocol: TCP
          port: 5432
    {{- else }}
    # External/managed PostgreSQL may live outside this namespace or cluster.
    - to: []
      ports:
        - protocol: TCP
          port: {{ .Values.postgresql.port | int }}
    {{- end }}
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to: []
      ports:
        - protocol: TCP
          port: 443
{{- end }}
