{{- $split := eq .Values.runtime.mode "split" -}}
{{- $enabled := ternary .Values.web.autoscaling.enabled .Values.autoscaling.enabled $split -}}
{{- if $enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "opsknight.fullname" . }}
  labels:
    {{- include "opsknight.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "opsknight.fullname" . }}
  minReplicas: {{ ternary .Values.web.autoscaling.minReplicas .Values.autoscaling.minReplicas $split }}
  maxReplicas: {{ ternary .Values.web.autoscaling.maxReplicas .Values.autoscaling.maxReplicas $split }}
  metrics:
    {{- $cpu := ternary .Values.web.autoscaling.targetCPUUtilizationPercentage .Values.autoscaling.targetCPUUtilizationPercentage $split }}
    {{- $memory := ternary .Values.web.autoscaling.targetMemoryUtilizationPercentage .Values.autoscaling.targetMemoryUtilizationPercentage $split }}
    {{- if $cpu }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $cpu }}
    {{- end }}
    {{- if $memory }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ $memory }}
    {{- end }}
{{- end }}
