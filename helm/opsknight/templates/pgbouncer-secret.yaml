{{- if .Values.pgbouncer.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opsknight.pgbouncer.fullname" . }}-auth
  labels:
    app.kubernetes.io/name: {{ include "opsknight.name" . }}-pgbouncer
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  userlist.txt: |
    "{{ .Values.postgresql.username }}" "{{ .Values.postgresql.password }}"
{{- end }}
