# Default values for opsknight
# This is a YAML-formatted file.

# Backward-compatible chart default. For new production Kubernetes deployments,
# prefer runtime.mode=split so web, worker, and scheduler capacity can scale independently.
runtime:
  mode: integrated

replicaCount: 2

image:
  repository: ghcr.io/opsknight-labs/opsknight
  pullPolicy: IfNotPresent
  tag: ''
  # When set, digest takes precedence over tag and renders repository@digest.
  digest: ''

imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''

serviceAccount:
  create: true
  annotations: {}
  name: ''
  automount: false

podAnnotations: {}

podSecurityContext:
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1001

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: false
  className: ''
  annotations: {}
  hosts:
    - host: opsknight.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1Gi

# Integrated-mode HPA. Split mode uses web.autoscaling instead.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}

# Spread replicas across nodes by default. Enterprise deployments should use
# three or more nodes and may change ScheduleAnyway to DoNotSchedule.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway

terminationGracePeriodSeconds: 30

startupProbe:
  httpGet:
    path: /api/health?mode=readiness
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /api/health
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/health?mode=readiness
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3

# Split-runtime settings. These are ignored while runtime.mode=integrated.
web:
  replicaCount: 2
  database:
    connectionLimit: 10
    poolTimeout: 30
  # Keep the request modest for small installations while allowing a Node.js
  # web process to burst above 500m while the default HPA adds replicas.
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  # Split mode is the recommended production topology, so its web tier scales
  # automatically by default. The minimum remains two replicas for small installs.
  # CPU is the default signal because validation identified CPU throttling as the
  # first web-tier bottleneck; memory scaling stays configurable but disabled.
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 12
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: null
  terminationGracePeriodSeconds: 30

worker:
  replicaCount: 2
  database:
    connectionLimit: 10
    poolTimeout: 30
  config:
    batchSize: 100
    concurrency: 15
    idlePollMs: 1000
    busyPollMs: 100
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  terminationGracePeriodSeconds: 60
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

scheduler:
  replicaCount: 1
  database:
    connectionLimit: 5
    poolTimeout: 30
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  terminationGracePeriodSeconds: 30

secrets:
  # Use a pre-created Secret instead of rendering secret values into the Helm release.
  # External Secrets/CSI operators should keep the required keys synchronized.
  existingSecret: ''
  keys:
    databaseUrl: DATABASE_URL
    webDatabaseUrl: WEB_DATABASE_URL
    workerDatabaseUrl: WORKER_DATABASE_URL
    schedulerDatabaseUrl: SCHEDULER_DATABASE_URL
    nextauthSecret: NEXTAUTH_SECRET
    encryptionKey: ENCRYPTION_KEY
    postgresUser: POSTGRES_USER
    postgresPassword: POSTGRES_PASSWORD
  nextauthSecret: 'change_this_to_a_random_secret_in_production'
  encryptionKey: '9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08'

networkPolicy:
  enabled: false
  ingressNamespaceLabels:
    kubernetes.io/metadata.name: ingress-nginx

config:
  nodeEnv: production
  nextauthUrl: 'http://localhost:3000'
  nextPublicAppUrl: 'http://localhost:3000'
  port: '3000'
  hostname: '0.0.0.0'
  nextTelemetryDisabled: '1'

# Full DATABASE_URL override. In integrated mode this behaves exactly as before.
# In split mode it is used directly for all roles unless PgBouncer is enabled.
# Built-in PgBouncer needs structured postgresql.* values because Helm cannot
# safely parse arbitrary connection URLs.
database:
  url: ''
  port: 5432

postgresql:
  enabled: true
  database: opsknight_db
  host: ''
  port: '5432'
  username: opsknight
  password: 'opsknight_secure_password_change_me'
  # Integrated-mode Prisma pool defaults retained for backward compatibility.
  connectionLimit: 40
  poolTimeout: 30
  storage: 10Gi
  storageClass: ''
  image:
    repository: postgres
    tag: '15-alpine'
    pullPolicy: IfNotPresent
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 70
    runAsGroup: 70
    fsGroup: 70
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 70
    runAsGroup: 70
  resources:
    requests:
      memory: 512Mi
      cpu: 500m
    limits:
      memory: 2Gi
      cpu: 2000m

# Optional PgBouncer for split mode. Only web traffic is pooled through it;
# workers and the scheduler keep direct PostgreSQL connections.
pgbouncer:
  enabled: false
  image:
    repository: ghcr.io/icoretech/pgbouncer-docker
    tag: '1.25.1'
    pullPolicy: IfNotPresent
  port: 6432
  poolMode: transaction
  maxClientConnections: 1000
  defaultPoolSize: 40
  reservePoolSize: 10
  maxPreparedStatements: 100
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    runAsUser: 70
    runAsGroup: 70
    readOnlyRootFilesystem: true