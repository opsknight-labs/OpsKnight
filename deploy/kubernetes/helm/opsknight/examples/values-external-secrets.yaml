# Apply one provider SecretProviderClass example in the release namespace first.
externalSecrets:
  csi:
    enabled: true
    secretProviderClass: opsknight-runtime
    mountPath: /mnt/opsknight-secrets
secrets:
  existingSecret: opsknight-runtime
# These examples use an external database, not chart-managed PostgreSQL.
postgresql:
  enabled: false
  host: db.example.internal
serviceAccount:
  create: true
  name: opsknight
# For Azure Workload Identity also set:
# podLabels:
#   azure.workload.identity/use: "true"
# serviceAccount:
#   annotations:
#     azure.workload.identity/client-id: <managed-identity-client-id>
# For AWS IRSA instead annotate this account with eks.amazonaws.com/role-arn.
