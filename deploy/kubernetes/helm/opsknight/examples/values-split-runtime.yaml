runtime:
  mode: split

# Requires at least two schedulable nodes. Add a zone-level constraint in a
# production values file when the cluster spans multiple zones.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule

# Required: set a tag or digest for an image built with split-runtime support.
# image:
#   digest: sha256:<tested-split-runtime-manifest-digest>

database:
  maxApplicationConnections: 200

web:
  replicaCount: 2
  database:
    poolSize: 10
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 12

scheduler:
  replicaCount: 2
  profile: maintenance
  database:
    poolSize: 3

generalWorker:
  replicaCount: 2
  database:
    poolSize: 15

criticalWorker:
  replicaCount: 2
  database:
    poolSize: 15

bulkWorker:
  replicaCount: 2
  database:
    poolSize: 10

runbookWorker:
  replicaCount: 2
  database:
    poolSize: 3

statusProjector:
  replicaCount: 2
  database:
    poolSize: 5

# When enabled, two replicas can open up to 30 PostgreSQL backends at the
# configured default and reserve pool sizes, replacing Web's 20 direct
# connections. Budget those backends together with 102 direct scheduler/worker
# connections and leave PostgreSQL operational headroom.
pgbouncer:
  defaultPoolSize: 10
  reservePoolSize: 5

networkPolicy:
  enabled: true
