# Replace all example identifiers; apply in the Helm release namespace.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: opsknight-runtime
  namespace: opsknight
spec:
  provider: azure
  secretObjects:
    - secretName: opsknight-runtime
      type: Opaque
      data:
        - objectName: DATABASE_URL
          key: DATABASE_URL
        - objectName: DIRECT_DATABASE_URL
          key: DIRECT_DATABASE_URL
        - objectName: WEB_DATABASE_URL
          key: WEB_DATABASE_URL
        - objectName: NEXTAUTH_SECRET
          key: NEXTAUTH_SECRET
        - objectName: API_KEY_SECRET
          key: API_KEY_SECRET
        - objectName: ENCRYPTION_KEYS
          key: ENCRYPTION_KEYS
        - objectName: SETUP_SECRET
          key: SETUP_SECRET
  parameters:
    usePodIdentity: "false"
    clientID: "REPLACE-MANAGED-IDENTITY-CLIENT-ID"
    keyvaultName: "REPLACE-VAULT-NAME"
    tenantId: "REPLACE-TENANT-ID"
    objects: |
      array:
        - |
          objectName: database-url
          objectType: secret
          objectAlias: DATABASE_URL
          objectVersion: ""
          filePermission: "0440"
        - |
          objectName: direct-database-url
          objectType: secret
          objectAlias: DIRECT_DATABASE_URL
          objectVersion: ""
          filePermission: "0440"
        - |
          objectName: web-database-url
          objectType: secret
          objectAlias: WEB_DATABASE_URL
          objectVersion: ""
          filePermission: "0440"
        - |
          objectName: nextauth-secret
          objectType: secret
          objectAlias: NEXTAUTH_SECRET
          objectVersion: ""
          filePermission: "0440"
        - |
          objectName: api-key-secret
          objectType: secret
          objectAlias: API_KEY_SECRET
          objectVersion: ""
          filePermission: "0440"
        - |
          objectName: encryption-keys
          objectType: secret
          objectAlias: ENCRYPTION_KEYS
          objectVersion: ""
          filePermission: "0440"
        - |
          objectName: setup-secret
          objectType: secret
          objectAlias: SETUP_SECRET
          objectVersion: ""
          filePermission: "0440"
