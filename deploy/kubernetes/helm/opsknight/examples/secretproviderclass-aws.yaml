# Replace all example identifiers; apply in the Helm release namespace.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: opsknight-runtime
  namespace: opsknight
spec:
  provider: aws
  secretObjects:
    - secretName: opsknight-runtime
      type: Opaque
      data:
        - objectName: DATABASE_URL
          key: DATABASE_URL
        - objectName: DIRECT_DATABASE_URL
          key: DIRECT_DATABASE_URL
        - objectName: WEB_DATABASE_URL
          key: WEB_DATABASE_URL
        - objectName: NEXTAUTH_SECRET
          key: NEXTAUTH_SECRET
        - objectName: API_KEY_SECRET
          key: API_KEY_SECRET
        - objectName: ENCRYPTION_KEYS
          key: ENCRYPTION_KEYS
        - objectName: SETUP_SECRET
          key: SETUP_SECRET
  parameters:
    region: us-east-1
    objects: |
      - objectName: "opsknight/runtime"
        objectType: "secretsmanager"
        filePermission: "0440"
        jmesPath:
          - path: DATABASE_URL
            objectAlias: DATABASE_URL
          - path: DIRECT_DATABASE_URL
            objectAlias: DIRECT_DATABASE_URL
          - path: WEB_DATABASE_URL
            objectAlias: WEB_DATABASE_URL
          - path: NEXTAUTH_SECRET
            objectAlias: NEXTAUTH_SECRET
          - path: API_KEY_SECRET
            objectAlias: API_KEY_SECRET
          - path: ENCRYPTION_KEYS
            objectAlias: ENCRYPTION_KEYS
          - path: SETUP_SECRET
            objectAlias: SETUP_SECRET
