{{- if .Values.migrations.job.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "opsknight.fullname" . }}-migration{{- if .Release.IsInstall }}-install{{- end }}
  labels:
    {{- include "opsknight.labels" . | nindent 4 }}
  {{- if .Release.IsUpgrade }}
  annotations:
    # On upgrade the existing database and Secret are available, so this hook
    # blocks workload replacement until the schema/index owner succeeds.
    helm.sh/hook: pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/hook-weight: "-1"
  {{- end }}
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "opsknight.labels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "opsknight.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            # Optional because migration ownership only requires the direct URL.
            - configMapRef:
                name: {{ include "opsknight.fullname" . }}-config
                optional: true
          command:
            - sh
            - -c
            - |
              set -eu
              echo "Starting schema migration Job..."
              if [ -n "${DIRECT_DATABASE_URL:-}" ]; then
                export DATABASE_URL="$DIRECT_DATABASE_URL"
              fi
              node node_modules/prisma/build/index.js migrate deploy
              node scripts/create-status-platform-online-indexes.cjs
              node scripts/create-sla-scheduler-online-index.cjs
              node scripts/create-voice-attempt-online-indexes.cjs
              echo "Migration Job completed successfully."
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "opsknight.secretName" . }}
                  key: {{ .Values.secrets.keys.databaseUrl }}
            - name: DIRECT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "opsknight.secretName" . }}
                  key: {{ .Values.secrets.keys.directDatabaseUrl }}
                  optional: true
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "opsknight.secretName" . }}
                  key: {{ .Values.secrets.keys.nextauthSecret }}
            - name: API_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "opsknight.secretName" . }}
                  key: {{ .Values.secrets.keys.apiKeySecret }}
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "opsknight.secretName" . }}
                  key: {{ .Values.secrets.keys.encryptionKey }}
                  optional: true
            {{- if or .Values.secrets.encryptionKeys .Values.secrets.existingSecret }}
            - name: ENCRYPTION_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ include "opsknight.secretName" . }}
                  key: {{ .Values.secrets.keys.encryptionKeys }}
                  optional: true
            {{- end }}
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          {{- if and (not .Values.postgresql.enabled) .Values.postgresql.tls.enabled }}
          volumeMounts:
            - name: database-tls
              mountPath: /etc/opsknight-db-tls
              readOnly: true
          {{- end }}
      {{- if and (not .Values.postgresql.enabled) .Values.postgresql.tls.enabled }}
      volumes:
        - name: database-tls
          secret:
            secretName: {{ required "postgresql.tls.existingSecret is required when external PostgreSQL TLS is enabled" .Values.postgresql.tls.existingSecret }}
            items:
              - key: {{ .Values.postgresql.tls.caKey }}
                path: ca.crt
      {{- end }}
{{- end }}
