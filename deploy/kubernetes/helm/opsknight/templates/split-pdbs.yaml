{{- if eq .Values.runtime.mode "split" }}
{{- $root := . }}
{{- $roles := list
  (dict "name" "web" "values" .Values.web)
  (dict "name" "scheduler" "values" .Values.scheduler)
  (dict "name" "general-worker" "values" .Values.generalWorker)
  (dict "name" "critical-worker" "values" .Values.criticalWorker)
  (dict "name" "bulk-worker" "values" .Values.bulkWorker)
  (dict "name" "status-projector" "values" .Values.statusProjector)
}}
{{- range $role := $roles }}
{{- if $role.values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "opsknight.fullname" $root }}-{{ $role.name }}
  labels:
    {{- include "opsknight.labels" $root | nindent 4 }}
spec:
  minAvailable: {{ $role.values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "opsknight.roleSelectorLabels" (dict "root" $root "role" $role.name) | nindent 6 }}
---
{{- end }}
{{- end }}
{{- end }}
