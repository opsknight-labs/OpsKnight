{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled (eq .Values.runtime.mode "split") }}
{{- if not .Values.metrics.scrapeTokenSecret.existingSecret }}
{{- fail "metrics.serviceMonitor.enabled requires metrics.scrapeTokenSecret.existingSecret" }}
{{- end }}
# In split mode the Service (and so the ServiceMonitor) selects only the web pods. Scheduler and
# worker pods keep their own in-memory counters (maintenance, queue and lane metrics), so they
# are scraped directly here.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "opsknight.fullname" . }}-roles
  labels:
    {{- include "opsknight.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "opsknight.selectorLabels" . | nindent 6 }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - scheduler
          - intelligence-worker
          - general-worker
          - critical-worker
          - bulk-worker
          - runbook-worker
          - status-projector
  podTargetLabels:
    - app.kubernetes.io/component
  podMetricsEndpoints:
    - port: http
      path: {{ .Values.metrics.path }}
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}
      bearerTokenSecret:
        name: {{ .Values.metrics.scrapeTokenSecret.existingSecret }}
        key: {{ .Values.metrics.scrapeTokenSecret.key }}
{{- end }}
