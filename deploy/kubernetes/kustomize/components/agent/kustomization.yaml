apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - policy.yaml
  - service-account.yaml
  - deployment.yaml
  - pvc.yaml
  - network-policy.yaml

secretGenerator:
  - name: opsknight-agent-enrollment
    namespace: opsknight
    literals:
      - enrollment-token=REPLACE_WITH_SINGLE_USE_TOKEN

generatorOptions:
  disableNameSuffixHash: true
