apiVersion: v1
kind: ServiceAccount
metadata:
  name: opsknight-agent
  namespace: opsknight
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opsknight-agent-readonly
  namespace: opsknight
rules:
  - apiGroups: ['']
    resources: [pods, pods/log]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, daemonsets, statefulsets]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opsknight-agent-readonly
  namespace: opsknight
subjects:
  - kind: ServiceAccount
    name: opsknight-agent
    namespace: opsknight
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: opsknight-agent-readonly
