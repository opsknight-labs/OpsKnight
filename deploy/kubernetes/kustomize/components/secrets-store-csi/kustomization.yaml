apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Mount-only primitive: does not manage Secret synchronization or ownership.
patches:
  - target:
      kind: Deployment
      name: opsknight-(app|web|scheduler|general-worker|critical-worker|bulk-worker|runbook-worker|status-projector)
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: unused
      spec:
        template:
          spec:
            serviceAccountName: opsknight-app
            containers:
              - name: opsknight-app
                volumeMounts:
                  - name: external-secrets
                    mountPath: /mnt/opsknight-secrets
                    readOnly: true
            volumes:
              - name: external-secrets
                csi:
                  driver: secrets-store.csi.k8s.io
                  readOnly: true
                  volumeAttributes:
                    secretProviderClass: opsknight-runtime
  - target:
      kind: Job
      name: opsknight-migration
    patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: unused
      spec:
        template:
          spec:
            serviceAccountName: opsknight-app
            securityContext:
              fsGroup: 1001
            containers:
              - name: migrate
                volumeMounts:
                  - name: external-secrets
                    mountPath: /mnt/opsknight-secrets
                    readOnly: true
            volumes:
              - name: external-secrets
                csi:
                  driver: secrets-store.csi.k8s.io
                  readOnly: true
                  volumeAttributes:
                    secretProviderClass: opsknight-runtime
