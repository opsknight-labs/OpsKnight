apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: opsknight-pgbouncer-network-policy, namespace: opsknight }
spec:
  podSelector: { matchLabels: { app: opsknight-pgbouncer } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: opsknight-app, opsknight-role: web } } }]
      ports: [{ protocol: TCP, port: 6432 }]
  egress:
    - to: []
      ports: [{ protocol: TCP, port: 5432 }]
    - to: [{ namespaceSelector: {} }]
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
