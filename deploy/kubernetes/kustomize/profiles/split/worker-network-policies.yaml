apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: opsknight-scheduler-network-policy, namespace: opsknight }
spec:
  podSelector: { matchLabels: { app: opsknight-app, opsknight-role: scheduler } }
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to: []
      ports: [{ protocol: TCP, port: 5432 }]
    - to: [{ namespaceSelector: {} }]
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - to: []
      ports:
        [{ protocol: TCP, port: 443 }, { protocol: TCP, port: 587 }, { protocol: TCP, port: 25 }]
---
