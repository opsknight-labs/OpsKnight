apiVersion: batch/v1
kind: Job
metadata:
  name: opsknight-migration
  namespace: opsknight
  labels:
    app: opsknight-app
    app.kubernetes.io/name: opsknight
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: opsknight-app
        app.kubernetes.io/name: opsknight
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          # Pin this to the same immutable image digest as the runtime Deployments.
          image: ghcr.io/opsknight-labs/opsknight:2.0.0
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
          env:
            - name: OPSKNIGHT_MIGRATION_ONLY
              value: "true"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: opsknight-secrets
                  key: DIRECT_DATABASE_URL
            - name: DIRECT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: opsknight-secrets
                  key: DIRECT_DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
