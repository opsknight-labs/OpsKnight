apiVersion: v1
kind: ConfigMap
metadata:
  name: opsknight-config
  namespace: opsknight
data:
  POSTGRES_DB: 'opsknight_db'
  POSTGRES_HOST: 'opsknight-postgres-service'
  POSTGRES_PORT: '5432'

  NODE_ENV: 'production'
  NEXTAUTH_URL: 'http://localhost:3000' # Update this to your public HTTPS origin
  NEXT_PUBLIC_APP_URL: 'http://localhost:3000' # Normally the same as NEXTAUTH_URL
  TRUST_PROXY_HEADERS: 'false'
  TRUSTED_PROXY_HOPS: '1'
  APP_HOST_ALIASES: ''
  REDIRECT_TO_CANONICAL_HOST: 'true'
  PORT: '3000'
  HOSTNAME: '0.0.0.0'
  NEXT_TELEMETRY_DISABLED: '1'
  # Set to 'false' on old replicas during a rolling upgrade to hold them on the
  # legacy direct-dispatch path. Remove after all replicas are updated.
  NOTIFICATION_CONTROL_PLANE_PERSONAL: 'true'
  ALLOW_INSECURE_SECRETS: 'false'
  RUNBOOK_ARTIFACT_RETENTION_DAYS: '30'
