services:
  opsknight-db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opsknight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required for demo stack}
      POSTGRES_DB: ${POSTGRES_DB:-opsknight_demo}
      POSTGRES_INITDB_ARGS: '-E UTF8 --locale=C'
      PGDATA: /var/lib/postgresql/data/pgdata
    # Bound strictly to loopback so PostgreSQL is not exposed on any host interface or external port
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - opsknight_demo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-opsknight} -d ${POSTGRES_DB:-opsknight_demo}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - opsknight-demo-network

  opsknight-app:
    image: ${OPSKNIGHT_IMAGE:-ghcr.io/opsknight-labs/opsknight:2.0.0}
    pull_policy: ${OPSKNIGHT_PULL_POLICY:-if_not_present}
    restart: unless-stopped
    ports:
      - '${APP_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-opsknight}:${POSTGRES_PASSWORD}@opsknight-db:5432/${POSTGRES_DB:-opsknight_demo}?sslmode=prefer&connection_limit=40&pool_timeout=30
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER:-opsknight}:${POSTGRES_PASSWORD}@opsknight-db:5432/${POSTGRES_DB:-opsknight_demo}?sslmode=prefer&connection_limit=40&pool_timeout=30
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      APP_HOST_ALIASES: ${APP_HOST_ALIASES:-}
      REDIRECT_TO_CANONICAL_HOST: ${REDIRECT_TO_CANONICAL_HOST:-false}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required for demo stack}
      API_KEY_SECRET: ${API_KEY_SECRET:?API_KEY_SECRET is required for demo stack}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required for demo stack}
      ALLOW_INSECURE_SECRETS: 'false'
      NOTIFICATION_CONTROL_PLANE_PERSONAL: 'true'
      DEMO_MODE: 'true'
      PORT: '3000'
      HOSTNAME: '0.0.0.0'
      NEXT_TELEMETRY_DISABLED: '1'
    depends_on:
      opsknight-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "require(''http'').get(''http://localhost:3000/api/health?mode=readiness'', (r) => {let data='''';r.on(''data'',(c)=>data+=c);r.on(''end'',()=>{try{const res=JSON.parse(data);process.exit(res.status===''unhealthy''?1:0)}catch(e){process.exit(1)}});}).on(''error'',()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - opsknight-demo-network

volumes:
  opsknight_demo_pgdata:

networks:
  opsknight-demo-network:
    driver: bridge
