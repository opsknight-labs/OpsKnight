version: '3.8'

# ==============================================================================
# OpsKnight Docker Swarm Custom CA Overlay (Integrated Runtime)
#
# Mounts a custom enterprise CA bundle into the integrated application container.
# ==============================================================================

services:
  opsknight-app:
    environment:
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/custom-ca.crt
      SSL_CERT_FILE: /etc/ssl/certs/custom-ca.crt
    secrets:
      - source: opsknight_custom_ca
        target: /etc/ssl/certs/custom-ca.crt

secrets:
  opsknight_custom_ca:
    external: true
    name: ${OPSKNIGHT_CUSTOM_CA_SECRET:-opsknight_custom_ca}
