version: '3.8'

# ==============================================================================
# OpsKnight Docker Swarm External Database Overlay (Split Runtime)
#
# Configures split runtime services with structured external PostgreSQL connection details.
# ==============================================================================

services:
  opsknight-web:
    environment:
      POSTGRES_HOST: ${EXTERNAL_DB_HOST:-}
      POSTGRES_PORT: ${EXTERNAL_DB_PORT:-5432}
      POSTGRES_DB: ${EXTERNAL_DB_NAME:-opsknight_db}
      POSTGRES_USER: ${EXTERNAL_DB_USER:-opsknight}

  opsknight-scheduler:
    environment:
      POSTGRES_HOST: ${EXTERNAL_DB_HOST:-}
      POSTGRES_PORT: ${EXTERNAL_DB_PORT:-5432}
      POSTGRES_DB: ${EXTERNAL_DB_NAME:-opsknight_db}
      POSTGRES_USER: ${EXTERNAL_DB_USER:-opsknight}

  opsknight-general-worker:
    environment:
      POSTGRES_HOST: ${EXTERNAL_DB_HOST:-}
      POSTGRES_PORT: ${EXTERNAL_DB_PORT:-5432}
      POSTGRES_DB: ${EXTERNAL_DB_NAME:-opsknight_db}
      POSTGRES_USER: ${EXTERNAL_DB_USER:-opsknight}

  opsknight-critical-worker:
    environment:
      POSTGRES_HOST: ${EXTERNAL_DB_HOST:-}
      POSTGRES_PORT: ${EXTERNAL_DB_PORT:-5432}
      POSTGRES_DB: ${EXTERNAL_DB_NAME:-opsknight_db}
      POSTGRES_USER: ${EXTERNAL_DB_USER:-opsknight}

  opsknight-bulk-worker:
    environment:
      POSTGRES_HOST: ${EXTERNAL_DB_HOST:-}
      POSTGRES_PORT: ${EXTERNAL_DB_PORT:-5432}
      POSTGRES_DB: ${EXTERNAL_DB_NAME:-opsknight_db}
      POSTGRES_USER: ${EXTERNAL_DB_USER:-opsknight}

  opsknight-status-projector:
    environment:
      POSTGRES_HOST: ${EXTERNAL_DB_HOST:-}
      POSTGRES_PORT: ${EXTERNAL_DB_PORT:-5432}
      POSTGRES_DB: ${EXTERNAL_DB_NAME:-opsknight_db}
      POSTGRES_USER: ${EXTERNAL_DB_USER:-opsknight}

networks:
  opsknight:
    external: true
    name: ${SWARM_NETWORK_NAME:-opsknight}
