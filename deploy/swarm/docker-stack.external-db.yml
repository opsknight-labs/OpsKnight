version: '3.8'

# ==============================================================================
# OpsKnight Docker Swarm External Database Overlay
#
# Connects OpsKnight services directly to an external managed PostgreSQL instance
# (e.g. AWS RDS, GCP Cloud SQL, Azure Database for PostgreSQL) instead of the
# bundled containerized PostgreSQL service.
#
# Deploy:
#   docker stack deploy --with-registry-auth \
#     -c deploy/swarm/docker-stack.yml \
#     -c deploy/swarm/docker-stack.external-db.yml \
#     opsknight
# ==============================================================================

services:
  opsknight-db:
    deploy:
      replicas: 0

  opsknight-pgbouncer:
    environment:
      PGBOUNCER_DB_HOST: ${EXTERNAL_DB_HOST:?Set EXTERNAL_DB_HOST for external database}
      PGBOUNCER_DB_PORT: ${EXTERNAL_DB_PORT:-5432}
      PGBOUNCER_DB_NAME: ${EXTERNAL_DB_NAME:-${POSTGRES_DB:-opsknight_db}}
      PGBOUNCER_DB_USER: ${EXTERNAL_DB_USER:-${POSTGRES_USER:-opsknight}}
      PGBOUNCER_DB_PASSWORD: ${EXTERNAL_DB_PASSWORD:-${POSTGRES_PASSWORD:-}}
      POSTGRES_USER: ${EXTERNAL_DB_USER:-${POSTGRES_USER:-opsknight}}
      POSTGRES_PASSWORD: ${EXTERNAL_DB_PASSWORD:-${POSTGRES_PASSWORD:-}}
      PGBOUNCER_SERVER_TLS_SSLMODE: ${PGBOUNCER_SERVER_TLS_SSLMODE:-verify-full}
      PGBOUNCER_SERVER_TLS_CA_FILE: ${PGBOUNCER_SERVER_TLS_CA_FILE:-/etc/ssl/certs/ca-certificates.crt}

  opsknight-web:
    environment:
      POSTGRES_HOST: ${EXTERNAL_DB_HOST:-}
      POSTGRES_PORT: ${EXTERNAL_DB_PORT:-5432}
      POSTGRES_DB: ${EXTERNAL_DB_NAME:-${POSTGRES_DB:-opsknight_db}}
      POSTGRES_USER: ${EXTERNAL_DB_USER:-${POSTGRES_USER:-opsknight}}

  opsknight-scheduler:
    environment:
      POSTGRES_HOST: ${EXTERNAL_DB_HOST:-}
      POSTGRES_PORT: ${EXTERNAL_DB_PORT:-5432}
      POSTGRES_DB: ${EXTERNAL_DB_NAME:-${POSTGRES_DB:-opsknight_db}}
      POSTGRES_USER: ${EXTERNAL_DB_USER:-${POSTGRES_USER:-opsknight}}

  opsknight-general-worker:
    environment:
      POSTGRES_HOST: ${EXTERNAL_DB_HOST:-}
      POSTGRES_PORT: ${EXTERNAL_DB_PORT:-5432}
      POSTGRES_DB: ${EXTERNAL_DB_NAME:-${POSTGRES_DB:-opsknight_db}}
      POSTGRES_USER: ${EXTERNAL_DB_USER:-${POSTGRES_USER:-opsknight}}

  opsknight-critical-worker:
    environment:
      POSTGRES_HOST: ${EXTERNAL_DB_HOST:-}
      POSTGRES_PORT: ${EXTERNAL_DB_PORT:-5432}
      POSTGRES_DB: ${EXTERNAL_DB_NAME:-${POSTGRES_DB:-opsknight_db}}
      POSTGRES_USER: ${EXTERNAL_DB_USER:-${POSTGRES_USER:-opsknight}}

  opsknight-bulk-worker:
    environment:
      POSTGRES_HOST: ${EXTERNAL_DB_HOST:-}
      POSTGRES_PORT: ${EXTERNAL_DB_PORT:-5432}
      POSTGRES_DB: ${EXTERNAL_DB_NAME:-${POSTGRES_DB:-opsknight_db}}
      POSTGRES_USER: ${EXTERNAL_DB_USER:-${POSTGRES_USER:-opsknight}}

  opsknight-status-projector:
    environment:
      POSTGRES_HOST: ${EXTERNAL_DB_HOST:-}
      POSTGRES_PORT: ${EXTERNAL_DB_PORT:-5432}
      POSTGRES_DB: ${EXTERNAL_DB_NAME:-${POSTGRES_DB:-opsknight_db}}
      POSTGRES_USER: ${EXTERNAL_DB_USER:-${POSTGRES_USER:-opsknight}}

networks:
  opsknight:
    external: true
    name: ${SWARM_NETWORK_NAME:-opsknight}
