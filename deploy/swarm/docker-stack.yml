  opsknight-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opsknight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opsknight_secure_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-opsknight_db}
    volumes:
      - opsknight-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-opsknight} -d ${POSTGRES_DB:-opsknight_db}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.opsknight.database == true
      restart_policy:
        condition: on-failure
      resources:
        reservations:
          cpus: '0.25'
          memory: 256M
        limits:
          cpus: '1.0'
          memory: 1G
    networks:
      - opsknight

networks:
  opsknight:
    external: true
    name: ${SWARM_NETWORK_NAME:-opsknight}

volumes:
  opsknight-db-data:

secrets:
  opsknight_database_url:
    external: true
    name: ${OPSKNIGHT_DATABASE_URL_SECRET:-opsknight_database_url}
  opsknight_direct_database_url:
    external: true
    name: ${OPSKNIGHT_DIRECT_DATABASE_URL_SECRET:-opsknight_direct_database_url}
  opsknight_nextauth_secret:
    external: true
    name: ${OPSKNIGHT_NEXTAUTH_SECRET_SECRET:-opsknight_nextauth_secret}
  opsknight_encryption_key:
    external: true
    name: ${OPSKNIGHT_ENCRYPTION_KEY_SECRET:-opsknight_encryption_key}
