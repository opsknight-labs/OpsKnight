version: '3.8'

# ==============================================================================
# OpsKnight Production Docker Swarm Stack (Core Split Manifest)
#
# Topology: Split Runtime with horizontal web scaling, isolated queue workers,
# lease-fenced maintenance scheduler, and resilient Raft-managed secrets.
#
# Deploy:
#   ./deploy/swarm/scripts/deploy.sh
#   OR
#   docker stack deploy --with-registry-auth -c deploy/swarm/docker-stack.yml opsknight
# ==============================================================================

services:
  opsknight-web:
    image: ${OPSKNIGHT_IMAGE:-ghcr.io/opsknight-labs/opsknight:latest}
    ports:
      - target: 3000
        published: ${APP_PORT:-3000}
        protocol: tcp
        mode: ingress
    environment:
      NODE_ENV: production
      OPSKNIGHT_PROCESS_ROLE: web
      DATABASE_POOL_SIZE_WEB: ${DATABASE_POOL_SIZE_WEB:-10}
      OPSKNIGHT_SKIP_MIGRATIONS: "true"
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NOTIFICATION_CONTROL_PLANE_PERSONAL: ${NOTIFICATION_CONTROL_PLANE_PERSONAL:-true}
      PORT: '3000'
      HOSTNAME: '0.0.0.0'
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL_FILE: /run/secrets/opsknight_database_url
      DIRECT_DATABASE_URL_FILE: /run/secrets/opsknight_direct_database_url
      NEXTAUTH_SECRET_FILE: /run/secrets/opsknight_nextauth_secret
      ENCRYPTION_KEY_FILE: /run/secrets/opsknight_encryption_key
    secrets:
      - source: opsknight_database_url
        target: /run/secrets/opsknight_database_url
      - source: opsknight_direct_database_url
        target: /run/secrets/opsknight_direct_database_url
      - source: opsknight_nextauth_secret
        target: /run/secrets/opsknight_nextauth_secret
      - source: opsknight_encryption_key
        target: /run/secrets/opsknight_encryption_key
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "require(''http'').get(''http://localhost:3000/api/health?mode=readiness'', (r) => {let data='''';r.on(''data'',(c)=>data+=c);r.on(''end'',()=>{try{const res=JSON.parse(data);process.exit(res.status===''healthy''?0:1)}catch(e){process.exit(1)}});}).on(''error'',()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 2
      placement:
        preferences:
          - spread: node.id
      update_config:
        parallelism: 1
        delay: 10s
        monitor: 30s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
        monitor: 30s
        failure_action: pause
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 60s
      resources:
        reservations:
          cpus: '0.25'
          memory: 256M
        limits:
          cpus: '1.0'
          memory: 1G
    networks:
      - opsknight

