version: '3.8'

# ==============================================================================
# OpsKnight Docker Swarm Bundled PostgreSQL Service
#
# Dedicated database manifest deployed first during bootstrap so PostgreSQL is
# healthy and ready to receive database migrations before application services start.
#
# Volume Locality:
#   Pinned via placement constraint `node.labels.opsknight.database == true`.
#   Single-node persistence for development, evaluation, and simple Swarm clusters.
# ==============================================================================

services:
  opsknight-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opsknight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opsknight_secure_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-opsknight_db}
    volumes:
      - opsknight-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-opsknight} -d ${POSTGRES_DB:-opsknight_db}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.opsknight.database == true
      restart_policy:
        condition: on-failure
      resources:
        reservations:
          cpus: '0.25'
          memory: 256M
        limits:
          cpus: '1.0'
          memory: 1G
    networks:
      - opsknight

networks:
  opsknight:
    external: true
    name: ${SWARM_NETWORK_NAME:-opsknight}

volumes:
  opsknight-db-data:
