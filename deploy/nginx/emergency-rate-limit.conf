# Include inside nginx's http context. Example for a trusted TLS-terminating edge.
# Set the upstream to your private OpsKnight web service; block direct public access.
# This per-source limit intentionally does not create a shared instance-wide quota.
limit_req_zone $binary_remote_addr zone=emergency_per_source:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=emergency_connections:10m;
server {
    listen 8080;
    server_name _;
    location = /api/auth/emergency {
        limit_req zone=emergency_per_source burst=10 nodelay;
        limit_req_status 429;
        limit_conn emergency_connections 4;
        limit_conn_status 429;
        client_max_body_size 64k;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://opsknight:3000;
    }
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://opsknight:3000;
    }
}
