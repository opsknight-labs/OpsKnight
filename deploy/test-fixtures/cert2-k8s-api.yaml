apiVersion: apps/v1
kind: Deployment
metadata:
  name: cert2-k8s-api
  namespace: opsknight-cert2
  labels:
    app: cert2-k8s-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cert2-k8s-api
  template:
    metadata:
      labels:
        app: cert2-k8s-api
    spec:
      containers:
        - name: api
          image: nginx:alpine
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: cert2-k8s-api
  namespace: opsknight-cert2
  labels:
    app: cert2-k8s-api
spec:
  type: ClusterIP
  selector:
    app: cert2-k8s-api
  ports:
    - port: 80
      targetPort: 80
