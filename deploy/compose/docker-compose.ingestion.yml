# Opt-in overlay after docker-compose.yml and docker-compose.split.yml.
# Use an image built from this branch. Existing release images lack ingestion workers.
x-ingestion-environment: &ingestion-environment
  OPSKNIGHT_INGESTION_MODE: postgres
  OPSKNIGHT_INGESTION_CONCURRENCY: ${OPSKNIGHT_INGESTION_CONCURRENCY:-4}
  OPSKNIGHT_INGESTION_MAX_INFLIGHT_REQUESTS: ${OPSKNIGHT_INGESTION_MAX_INFLIGHT_REQUESTS:-32}
  OPSKNIGHT_INGESTION_MAX_PENDING: ${OPSKNIGHT_INGESTION_MAX_PENDING:-100000}
  OPSKNIGHT_INGESTION_MAX_PENDING_BYTES: ${OPSKNIGHT_INGESTION_MAX_PENDING_BYTES:-1073741824}
  OPSKNIGHT_INGESTION_EVENTS_PER_MINUTE: ${OPSKNIGHT_INGESTION_EVENTS_PER_MINUTE:-120}
  OPSKNIGHT_INGESTION_INTEGRATION_PER_MINUTE: ${OPSKNIGHT_INGESTION_INTEGRATION_PER_MINUTE:-100}
  OPSKNIGHT_INGESTION_PAYLOAD_RETENTION_HOURS: ${OPSKNIGHT_INGESTION_PAYLOAD_RETENTION_HOURS:-24}

services:
  opsknight-web:
    environment: *ingestion-environment

  opsknight-scheduler:
    environment: *ingestion-environment

  opsknight-ingestion-worker:
    extends:
      file: docker-compose.split.yml
      service: opsknight-general-worker
    environment:
      <<: *ingestion-environment
      OPSKNIGHT_PROCESS_ROLE: ingestion-worker
      DATABASE_POOL_SIZE_INGESTION_WORKER: ${DATABASE_POOL_SIZE_INGESTION_WORKER:-5}
    stop_grace_period: 60s
