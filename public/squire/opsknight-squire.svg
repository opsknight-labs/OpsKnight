    <g class="sq-hand">
      <circle class="sq-glove" cx="84" cy="108" r="6"/>
      <ellipse class="sq-glove" cx="78.6" cy="105.5" rx="2.4" ry="3.2"/>
    </g>
  </g>
  </g>
  <!-- scarf -->
  <path class="sq-cape" d="M37.5 80.5C45 74.5 75 74.5 82.5 80.5C77 87 43 87 37.5 80.5Z"/>
  <path class="sq-cape-shade" d="M40 82.2C48 85.6 72 85.6 80 82.2C74 86.6 46 86.6 40 82.2Z"/>
  <circle class="sq-rim" cx="60" cy="84" r="3.6"/>
  <circle class="sq-armor" cx="59.4" cy="83.4" r="1.6"/>
  <!-- head -->
  <g class="sq-head">
    <g class="sq-plume">
      <path class="sq-red" d="M49 16C44 5 31 1.5 20 7C28 7.5 32.5 10 35 13.5C26 13.5 17.5 19.5 13 30C23 24 33.5 22 43 24.5Z"/>
