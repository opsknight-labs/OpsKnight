    <!-- visor -->
    <path class="sq-visor" d="M39 29.5H81C87.5 29.5 92 34.5 92 41.5V54.5C92 62.5 86 68 78 68H42C34 68 28 62.5 28 54.5V41.5C28 34.5 32.5 29.5 39 29.5Z"/>
