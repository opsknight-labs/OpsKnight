      </g>
      <g class="sq-eyes">
        <g class="sq-eyes-open">
          <ellipse class="sq-fill sq-eye l" cx="48" cy="49" rx="5" ry="6.6"/>
          <ellipse class="sq-fill sq-eye r" cx="72" cy="49" rx="5" ry="6.6"/>
        </g>
        <path class="sq-ink sq-eyes-happy" d="M42.6 52Q48 43.5 53.4 52M66.6 52Q72 43.5 77.4 52"/>
        <path class="sq-ink sq-eyes-closed" d="M42.6 49.5Q48 54 53.4 49.5M66.6 49.5Q72 54 77.4 49.5"/>
      </g>
      <path class="sq-ink sq-mouth" d="M54.5 59.5Q60 64.2 65.5 59.5"/>
      <ellipse class="sq-fill sq-mouth-o" cx="60" cy="61" rx="2.8" ry="3.3"/>
      <g class="sq-dots">
        <circle class="sq-fill" cx="54" cy="61.5" r="1.8"/>
        <circle class="sq-fill" cx="60" cy="61.5" r="1.8"/>
        <circle class="sq-fill" cx="66" cy="61.5" r="1.8"/>
      </g>
    </g>
  </g>
  <!-- badges -->
  <g class="sq-zzz"><path class="sq-z" d="M98 22H104L98 28H104"/><path class="sq-z s" d="M106 12H110L106 16H110"/></g>
  <path class="sq-spark s1" d="M104 26L105.5 30.5L110 32L105.5 33.5L104 38L102.5 33.5L98 32L102.5 30.5Z"/>
