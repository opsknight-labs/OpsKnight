    <circle class="sq-glove" cx="37" cy="110" r="6"/>
  </g>
  <!-- torso -->
  <path class="sq-armor-shade" d="M41 84C41 80 50 77 60 77S79 80 79 84L81 106C81 113 72 118.5 60 118.5S39 113 39 106Z"/>
