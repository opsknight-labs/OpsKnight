      <path class="sq-red-hi-line" d="M44 15C40 9.5 33 7 27 8"/>
    </g>
    <path class="sq-fin" d="M53.5 17.5C55.5 12.5 58 9.5 61 8C63 10 65 13.5 66.5 17.5Z"/>
    <circle class="sq-ear-ring" cx="24.5" cy="50" r="9"/>
    <circle class="sq-ear-ring" cx="95.5" cy="50" r="9"/>
    <circle class="sq-rim" cx="24.5" cy="50" r="9"/>
    <circle class="sq-armor" cx="23.6" cy="49.4" r="5.8"/>
    <circle class="sq-rim" cx="95.5" cy="50" r="9"/>
    <circle class="sq-armor" cx="96.4" cy="49.4" r="5.8"/>
    <ellipse class="sq-helm-shade" cx="60" cy="46" rx="36" ry="33"/>
    <ellipse class="sq-helm" cx="58.6" cy="44.2" rx="34.4" ry="31.2"/>
