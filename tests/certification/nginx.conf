worker_processes auto;
worker_rlimit_nofile 65536;

events {
  worker_connections 8192;
  use epoll;
  multi_accept on;
}

http {
  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout 30;
  keepalive_requests 10000;
  access_log      off;
  error_log       /var/log/nginx/error.log warn;

  # Proxy cache for snapshot-backed public endpoints
  proxy_cache_path /var/cache/nginx/status
    levels=1
    keys_zone=status_cache:10m
    max_size=256m
    inactive=60s
    use_temp_path=off;

  upstream opsknight {
    zone opsknight 128k;
    server web:3000;
    server web:3000;
    server web:3000;
    keepalive 256;
  }

  resolver 127.0.0.11 valid=2s;

  server {
    listen 3000 reuseport backlog=4096;

    # Cached: public snapshot read endpoint
    location = /api/status {
      proxy_pass          http://opsknight;
      proxy_http_version  1.1;
      proxy_set_header    Connection "";
      proxy_set_header    Host $host;
      proxy_connect_timeout 2s;
      proxy_read_timeout    15s;

      # Override app no-cache headers for the proxy layer
      proxy_ignore_headers  Cache-Control Expires Set-Cookie;
      proxy_hide_header     Cache-Control;
      add_header            Cache-Control "public, max-age=5, stale-while-revalidate=10";

      proxy_cache            status_cache;
      proxy_cache_key        "$uri";
      proxy_cache_valid      200 5s;
      proxy_cache_use_stale  error timeout updating http_502 http_503 http_504;
      proxy_cache_lock       on;
      proxy_cache_lock_timeout 2s;
      add_header             X-Cache-Status $upstream_cache_status;

      proxy_next_upstream   error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries   3;
      proxy_next_upstream_timeout 5s;
    }

    # Uncached: all other routes
    location / {
      proxy_pass          http://opsknight;
      proxy_http_version  1.1;
      proxy_set_header    Connection "";
      proxy_set_header    Host $host;
      proxy_set_header    X-Real-IP $remote_addr;
      proxy_connect_timeout 2s;
      proxy_read_timeout    15s;
      proxy_next_upstream   error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries   3;
      proxy_next_upstream_timeout 5s;
    }
  }
}
