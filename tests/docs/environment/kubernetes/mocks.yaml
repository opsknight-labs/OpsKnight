apiVersion: apps/v1
kind: Deployment
metadata:
  name: provider-mocks
  namespace: opsknight-docs
  annotations:
    checkov.io/skip1: CKV_K8S_40=Pinned third-party mock images define their tested non-root runtime UIDs.
spec:
  replicas: 1
  selector:
    matchLabels: { app: docs-provider-mocks }
  template:
    metadata:
      labels: { app: docs-provider-mocks }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: slack
          image: "wiremock/wiremock:3.13.1@sha256:d61e7720f89483fdef5366843b58d1dfd06bcce5828179c9f2f54de5c28354b0"
          imagePullPolicy: Always
          ports: [{ containerPort: 8080, name: slack }]
          readinessProbe: &slackProbe { httpGet: { path: /__admin/health, port: slack }, initialDelaySeconds: 5, periodSeconds: 5 }
          livenessProbe: *slackProbe
          resources: &mockResources { requests: { cpu: 25m, memory: 64Mi }, limits: { cpu: 250m, memory: 256Mi } }
          securityContext: &mockSecurityContext { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, capabilities: { drop: [ALL] } }
          volumeMounts: &mockVolumeMounts [{ name: runtime-tmp, mountPath: /tmp }]
        - name: teams
          image: "wiremock/wiremock:3.13.1@sha256:d61e7720f89483fdef5366843b58d1dfd06bcce5828179c9f2f54de5c28354b0"
          imagePullPolicy: Always
          args: [--port, "8081"]
          ports: [{ containerPort: 8081, name: teams }]
          readinessProbe: &teamsProbe { httpGet: { path: /__admin/health, port: teams }, initialDelaySeconds: 5, periodSeconds: 5 }
          livenessProbe: *teamsProbe
          resources: *mockResources
          securityContext: *mockSecurityContext
          volumeMounts: *mockVolumeMounts
        - name: jira
          image: "wiremock/wiremock:3.13.1@sha256:d61e7720f89483fdef5366843b58d1dfd06bcce5828179c9f2f54de5c28354b0"
          imagePullPolicy: Always
          args: [--port, "8082"]
          ports: [{ containerPort: 8082, name: jira }]
          readinessProbe: &jiraProbe { httpGet: { path: /__admin/health, port: jira }, initialDelaySeconds: 5, periodSeconds: 5 }
          livenessProbe: *jiraProbe
          resources: *mockResources
          securityContext: *mockSecurityContext
          volumeMounts: *mockVolumeMounts
        - name: webhook
          image: "wiremock/wiremock:3.13.1@sha256:d61e7720f89483fdef5366843b58d1dfd06bcce5828179c9f2f54de5c28354b0"
          imagePullPolicy: Always
          args: [--port, "8083"]
          ports: [{ containerPort: 8083, name: webhook }]
          readinessProbe: &webhookProbe { httpGet: { path: /__admin/health, port: webhook }, initialDelaySeconds: 5, periodSeconds: 5 }
          livenessProbe: *webhookProbe
          resources: *mockResources
          securityContext: *mockSecurityContext
          volumeMounts: *mockVolumeMounts
        - name: smtp
          image: "axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68"
          imagePullPolicy: Always
          ports: [{ containerPort: 1025, name: smtp }, { containerPort: 8025, name: mail-ui }]
          readinessProbe: &smtpProbe { httpGet: { path: /livez, port: mail-ui }, initialDelaySeconds: 5, periodSeconds: 5 }
          livenessProbe: *smtpProbe
          resources: *mockResources
          securityContext: *mockSecurityContext
          volumeMounts: *mockVolumeMounts
      volumes:
        - name: runtime-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: provider-mocks
  namespace: opsknight-docs
spec:
  selector: { app: docs-provider-mocks }
  ports:
    - { name: slack, port: 8080, targetPort: slack }
    - { name: teams, port: 8081, targetPort: teams }
    - { name: jira, port: 8082, targetPort: jira }
    - { name: webhook, port: 8083, targetPort: webhook }
    - { name: smtp, port: 1025, targetPort: smtp }
    - { name: mail-ui, port: 8025, targetPort: mail-ui }
