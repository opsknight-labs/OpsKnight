apiVersion: v1
kind: Namespace
metadata:
  name: opsknight-docs
  labels:
    app.kubernetes.io/part-of: opsknight-docs
    opsknight.com/ephemeral: "true"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: docs-budget
  namespace: opsknight-docs
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: docs-defaults
  namespace: opsknight-docs
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 100m, memory: 128Mi }
      default: { cpu: 500m, memory: 512Mi }
