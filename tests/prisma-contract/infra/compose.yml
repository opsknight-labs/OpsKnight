# Isolated databases for the Prisma runtime contract suite.
# Usage: tests/prisma-contract/infra/up.sh (generates TLS material first).
name: opsknight-prisma-contract

x-postgres-env: &postgres-env
  POSTGRES_USER: opsknight
  POSTGRES_PASSWORD: contract_password
  POSTGRES_DB: opsknight_contract

x-postgres-health: &postgres-health
  test: ['CMD-SHELL', 'pg_isready -U opsknight -d opsknight_contract']
  interval: 2s
  timeout: 3s
  retries: 30

services:
  # Plain UTC PostgreSQL without TLS (also proves sslmode=prefer plaintext fallback).
  pg:
    image: postgres:16
    environment: *postgres-env
    ports: ['127.0.0.1:${PC_PG_PORT:-56501}:5432']
    healthcheck: *postgres-health

  # Same server with a non-UTC default session time zone.
  pg-tz:
    image: postgres:16
    environment: *postgres-env
    command: ['postgres', '-c', 'timezone=Asia/Kolkata']
    ports: ['127.0.0.1:${PC_PG_TZ_PORT:-56502}:5432']
    healthcheck: *postgres-health

  # TLS-only PostgreSQL with a private CA whose server certificate names "localhost".
  pg-tls:
    image: postgres:16
    environment: *postgres-env
    volumes:
      - ./.tls:/tls-src:ro
    entrypoint:
      - bash
      - -c
      - |
        set -e
        install -d -o postgres -g postgres -m 700 /var/lib/postgresql/tls
        install -o postgres -g postgres -m 600 /tls-src/server.key /var/lib/postgresql/tls/server.key
        install -o postgres -g postgres -m 644 /tls-src/server.crt /var/lib/postgresql/tls/server.crt
        cat > /docker-entrypoint-initdb.d/zz-hostssl.sh <<'EOF'
        #!/bin/sh
        echo 'hostnossl all all all reject' > "$$PGDATA/pg_hba.conf.new"
        echo 'local all all trust' >> "$$PGDATA/pg_hba.conf.new"
        echo 'hostssl all all all scram-sha-256' >> "$$PGDATA/pg_hba.conf.new"
        mv "$$PGDATA/pg_hba.conf.new" "$$PGDATA/pg_hba.conf"
        EOF
        chmod +x /docker-entrypoint-initdb.d/zz-hostssl.sh
        exec docker-entrypoint.sh postgres -c ssl=on \
          -c ssl_cert_file=/var/lib/postgresql/tls/server.crt \
          -c ssl_key_file=/var/lib/postgresql/tls/server.key
    ports: ['127.0.0.1:${PC_PG_TLS_PORT:-56503}:5432']
    healthcheck: *postgres-health

  # Production PgBouncer image (transaction mode, max_prepared_statements=100).
  pgbouncer:
    build: ../../../deploy/images/pgbouncer
    depends_on:
      pg:
        condition: service_healthy
    environment:
      PGBOUNCER_DB_HOST: pg
      PGBOUNCER_DB_PORT: '5432'
      PGBOUNCER_DB_NAME: opsknight_contract
      PGBOUNCER_DB_USER: opsknight
      PGBOUNCER_DB_PASSWORD: contract_password
      PGBOUNCER_SERVER_TLS_SSLMODE: disable
      PGBOUNCER_ADMIN_USER: pgbouncer_admin
      PGBOUNCER_ADMIN_PASSWORD: admin_password
      PGBOUNCER_DEFAULT_POOL_SIZE: '10'
    ports: ['127.0.0.1:${PC_PGBOUNCER_PORT:-56504}:6432']

  # PgBouncer in front of the non-UTC server.
  pgbouncer-tz:
    build: ../../../deploy/images/pgbouncer
    depends_on:
      pg-tz:
        condition: service_healthy
    environment:
      PGBOUNCER_DB_HOST: pg-tz
      PGBOUNCER_DB_PORT: '5432'
      PGBOUNCER_DB_NAME: opsknight_contract
      PGBOUNCER_DB_USER: opsknight
      PGBOUNCER_DB_PASSWORD: contract_password
      PGBOUNCER_SERVER_TLS_SSLMODE: disable
    ports: ['127.0.0.1:${PC_PGBOUNCER_TZ_PORT:-56505}:6432']
