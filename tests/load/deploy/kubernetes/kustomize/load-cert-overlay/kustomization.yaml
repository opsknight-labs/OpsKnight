apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../../../deploy/kubernetes/kustomize/profiles/split-pgbouncer

patches:
  - path: secret-patch.yaml
  - path: pgbouncer-secret-patch.yaml
  - path: network-policy-patch.yaml
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: opsknight-(web|scheduler|general-worker|critical-worker|bulk-worker|status-projector)
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OPSKNIGHT_LOAD_TEST_ALLOW_HOSTS
          value: "host.docker.internal,10.0.2.2,127.0.0.1,opsknight-emulator"
