apiVersion: v1
kind: Pod
metadata:
  name: k6-automation-cert
  namespace: automation-cert
  labels:
    app.kubernetes.io/name: automation-load-generator
    app.kubernetes.io/instance: automation-load-generator
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 12345
    runAsGroup: 12345
    fsGroup: 12345
  containers:
    - name: k6
      # Imported from the official pinned Linux/arm64 v2.3.0 manifest:
      # sha256:06181d5d1aebfde4dce5b5ea970041fd3e7d4613a9ed895f65509525fb73dcb2
      image: grafana/k6:automation-2.3.0-arm64
      imagePullPolicy: Never
      command: [sh, -c, 'sleep infinity']
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 256Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: work
          mountPath: /work
  volumes:
    - name: work
      emptyDir: {}
